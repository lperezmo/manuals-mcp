<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15131c" media="(prefers-color-scheme: dark)" />
    <title>Join · Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header class="top" id="top"></header>
    <main class="wrap" id="main">
      <p class="muted">One moment…</p>
    </main>

    <script type="module">
      import { $, boot, db, esc, itemIcon, signIn } from "/app.js";

      // Where invite links and share links land: join a household, or add a
      // copy of someone's thing to your own home. Signs you in first.
      const main = $("#main");
      const params = new URLSearchParams(location.search);
      const invite = params.get("invite");
      const thing = params.get("thing");
      const plural = (n, word, many = `${word}s`) => `${n} ${n === 1 ? word : many}`;
      const note = (text) => {
        main.innerHTML = `<section class="card stack" style="max-width:560px"><p style="margin:0">${esc(text)}</p><div class="row"><a class="button" href="/">Go home</a></div></section>`;
      };

      async function joinHome(supa) {
        const { data: p, error } = await supa.rpc("invite_preview", { p_code: invite });
        if (error) throw new Error(error.message);
        if (!p) return note("That invite link doesn't work. Ask for a new one.");
        if (p.already_in) return note("You're already in this home.");
        if (!p.usable) return note("That invite link has expired or was already used. Ask for a new one.");
        main.innerHTML = `
          <section class="card stack" style="max-width:560px">
            <h1>${esc(p.invited_by ?? "Someone")} invited you to their home</h1>
            <p class="muted" style="margin:0">${plural(p.people, "person", "people")} · ${plural(p.things, "thing")}</p>
            <p style="margin:0">You'll see and update their things, upkeep schedule and manuals, signed in as yourself. Your own things stay in your own home, and you can go back any time from Your household.</p>
            <div class="row"><button type="button" id="go">Join their home</button><a class="button quiet" href="/">Not now</a></div>
          </section>`;
        $("#go").addEventListener("click", async (e) => {
          e.target.disabled = true;
          const { error: err } = await supa.rpc("accept_invite", { p_code: invite });
          if (err) return note(err.message);
          location.assign("/");
        });
      }

      async function copyThing(supa) {
        const { data: p, error } = await supa.rpc("shared_item_preview", { p_code: thing });
        if (error) throw new Error(error.message);
        if (!p) return note("That share link no longer works. Ask for a new one.");
        const chips = [
          p.tasks && plural(p.tasks, "upkeep task"),
          p.facts && plural(p.facts, "fact"),
          p.seat_modes && plural(p.seat_modes, "car seat limit"),
          p.corrected && `${plural(p.corrected, "fix", "fixes")} by its owner`,
        ].filter(Boolean);
        main.innerHTML = `
          <section class="card stack" style="max-width:560px">
            <div class="row" style="gap:16px;align-items:center;flex-wrap:nowrap">
              ${itemIcon(p, 64)}
              <div style="min-width:0"><h1 style="margin:0">${esc(p.nickname)}</h1>
                <p class="muted" style="margin:0">${esc([p.brand, p.model].filter(Boolean).join(" · "))}</p></div>
            </div>
            <p style="margin:0">Someone shared this thing's manual with you. Add a copy to your home and it comes with:</p>
            <div class="chips">${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>
            ${p.pages ? `<p class="small muted" style="margin:0">The PDF stays with them. Its ${plural(p.pages, "page")} of text come along, so you can still ask about it.</p>` : ""}
            <div class="row"><button type="button" id="go">Add to my home</button><a class="button quiet" href="/">Not now</a></div>
          </section>`;
        $("#go").addEventListener("click", async (e) => {
          e.target.disabled = true;
          const { data: id, error: err } = await supa.rpc("copy_shared_item", { p_code: thing });
          if (err) return note(err.message);
          location.assign(`/things?id=${id}`);
        });
      }

      async function start() {
        const session = await boot("/join", { open: true });
        if (!invite && !thing) return note("This page opens from an invite or share link.");
        if (!session) {
          main.innerHTML = `<p class="muted">Sign in first, then you can ${invite ? "join the home you were invited to" : "add the shared manual to your home"}.</p><div id="sign"></div>`;
          signIn($("#sign"), () => location.reload());
          return;
        }
        const supa = await db();
        return invite ? joinHome(supa) : copyThing(supa);
      }
      start().catch((err) => {
        main.innerHTML = `<p class="card">Something went wrong: ${esc(err.message)}</p>`;
      });
    </script>
  </body>
</html>
