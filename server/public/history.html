<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History · Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header class="top" id="top"></header>
    <main class="wrap" id="main">
      <p class="muted">One moment…</p>
    </main>

    <script type="module">
      import { $, ago, boot, db, esc } from "/app.js";

      const main = $("#main");
      const KIND = { manual_facts: "Fact", tasks: "Task", seat_modes: "Car seat limit" };
      const shown = (row) => row.value ?? row.details ?? row.fit_note ?? row.title ?? "";

      async function start() {
        if (!(await boot("/history"))) return;
        const { data, error } = await (await db())
          .from("revisions")
          .select("id, target_table, before, after, source, reason, created_at")
          .order("created_at", { ascending: false })
          .limit(200);
        if (error) throw new Error(error.message);
        main.innerHTML = `
          <section class="stack">
            <h1>Every change, and why.</h1>
            <p class="muted">Muse reads the manuals first. When an assistant or you correct something, the old version stays here with the reason.</p>
          </section>
          <section class="card">${
            data
              .map((r) => {
                const changed = JSON.stringify(shown(r.before)) !== JSON.stringify(shown(r.after));
                return `<div class="fact">
                  <div>
                    <div class="small muted">${KIND[r.target_table]} · ${esc(r.after.label || r.after.title || (r.after.mode ?? "").replace(/_/g, "-"))}${r.after.source_page ? ` · page ${r.after.source_page}` : ""}</div>
                    ${changed ? `<div><s class="muted">${esc(shown(r.before))}</s></div><div><strong>${esc(shown(r.after))}</strong></div>` : "<div><strong>Checked, no change</strong></div>"}
                    <div class="small muted">“${esc(r.reason)}”</div>
                  </div>
                  <div class="small" style="text-align:right"><div style="font-weight:700;color:${r.source === "user" ? "var(--coral)" : "var(--teal)"}">${r.source === "user" ? "You" : "Assistant"}</div><div class="muted">${ago(r.created_at)}</div></div>
                </div>`;
              })
              .join("") || '<p class="muted">No changes yet. Everything is as Muse read it.</p>'
          }</section>
          <p class="small muted">Curious what the model did? <a href="/runs">See the model log</a>.</p>`;
      }
      start().catch((err) => {
        main.innerHTML = `<p class="card">Something went wrong: ${esc(err.message)}</p>`;
      });
    </script>
  </body>
</html>
