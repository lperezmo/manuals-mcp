<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your things · Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0..1,0&icon_names=archive,auto_awesome,build,check,cleaning_services,content_copy,delete,edit,event,fact_check,forum,health_and_safety,menu_book,more_horiz,palette,settings,share,tune,unarchive&display=block"
    />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header class="top" id="top"></header>
    <main class="wrap" id="main">
      <p class="muted">One moment…</p>
    </main>

    <script type="module">
      import { $, ago, api, boot, daysBetween, db, esc, howOften, ICONS, iconKey, iconSvg, itemIcon, openChat, relDay, shareLink, shrink, TINTS, takePendingPhoto, tintKey, toast, today, tool } from "/app.js";

      const main = $("#main");
      const params = new URLSearchParams(location.search);
      const KINDS = { error_code: "Error codes", part: "Parts", spec: "Specs", safety: "Safety", other: "Other" };
      const SOURCES = { reader: "Read by Muse", assistant: "Checked by an assistant", user: "Set by you" };
      const STATUS = { needs_review: ["To check", "gold"], revised: ["Revised", "teal"], confirmed: ["Checked", "teal"] };

      // --- List ---------------------------------------------------------------

      const PIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2h-5v6l-1 1-1-1v-6H6v-2l4-4z"></path></svg>';
      const GROUPS = { appliance: "Appliances", baby_gear: "Baby gear", vehicle: "Vehicles", other: "Other" };
      let filter = "all";

      // The example home's manuals are made up, so there is no PDF to open.
      const isExample = (url) => /^https:\/\/example\.com\//.test(url);

      function nextTask(i) {
        const open = (i.tasks ?? []).filter((t) => t.active && t.next_due_on).sort((a, b) => a.next_due_on.localeCompare(b.next_due_on));
        return open[0];
      }

      function summary(i) {
        const tasks = (i.tasks ?? []).filter((t) => t.active);
        const late = tasks.filter((t) => t.next_due_on && t.next_due_on < today()).length;
        const check = (i.manual_facts ?? []).filter((f) => f.status === "needs_review").length;
        if (!i.manuals?.length) return { late, text: "No manual yet" };
        const parts = [`${tasks.length} task${tasks.length === 1 ? "" : "s"}`];
        if (late) parts.push(`${late} late`);
        else if (check) parts.push(`${check} to check`);
        return { late, text: parts.join(" · ") };
      }

      // --- Archive / restore / delete for good ---------------------------------
      // Archiving hides a thing (sold, given away, thrown out) from lists,
      // upcoming tasks and Muse, and keeps everything. Only deleting is final.
      async function setArchived(item, on) {
        const { error } = await (await db())
          .from("items")
          .update(on ? { archived_at: new Date().toISOString(), pinned: false } : { archived_at: null })
          .eq("id", item.id);
        if (error) throw new Error(error.message);
        toast(on ? `Archived the ${item.nickname}. Find it under Manage things.` : `The ${item.nickname} is back.`);
      }

      /** Asks first; removes the stored PDFs, then the item (its manual, tasks, facts and history go with it). */
      async function deleteForever(item) {
        if (!confirm(`Delete the ${item.nickname} for good, with its manual, upkeep, facts and history? This can't be undone.`)) return false;
        const supa = await db();
        const { data: files } = await supa.from("manuals").select("storage_path").eq("item_id", item.id);
        const paths = (files ?? []).map((f) => f.storage_path).filter(Boolean);
        if (paths.length) await supa.storage.from("manuals").remove(paths);
        const { error } = await supa.from("items").delete().eq("id", item.id);
        if (error) throw new Error(error.message);
        toast(`Deleted the ${item.nickname}.`);
        return true;
      }

      function drawManage(items) {
        const active = items.filter((i) => !i.archived_at);
        const archived = items.filter((i) => i.archived_at);
        const row = (i, buttons) => `<div class="manage-row">${itemIcon(i, 44)}<div class="manage-name"><strong>${esc(i.nickname)}</strong><span class="small muted">${esc([i.brand, i.model].filter(Boolean).join(" ")) || "No model saved"}</span></div><div class="row">${buttons}</div></div>`;
        main.innerHTML = `
          <section class="stack">
            <a href="/things" style="font-weight:700;text-decoration:none">← Your things</a>
            <h1 style="margin:0">Manage things</h1>
            <p class="muted" style="margin:0">Sold it, gave it away or threw it out? Archive it: it leaves your list, your upcoming tasks and Muse, and you can bring it back any time.</p>
          </section>
          <section class="card lines">${active.map((i) => row(i, `<button type="button" class="quiet small" data-archive="${i.id}">${ic("archive")}Archive</button>`)).join("") || '<p class="muted small">Nothing here yet.</p>'}</section>
          ${
            archived.length
              ? `<section class="stack"><h2 style="margin:0">Archived</h2><div class="card lines">${archived
                  .map((i) => row(i, `<button type="button" class="quiet small" data-restore="${i.id}">${ic("unarchive")}Restore</button><button type="button" class="quiet small danger" data-delete="${i.id}">${ic("delete")}Delete for good</button>`))
                  .join("")}</div></section>`
              : ""
          }`;
        const byId = new Map(items.map((i) => [i.id, i]));
        main.onclick = async (e) => {
          const b = e.target.closest("[data-archive], [data-restore], [data-delete]");
          if (!b) return;
          const item = byId.get(b.dataset.archive || b.dataset.restore || b.dataset.delete);
          b.disabled = true;
          try {
            if (b.dataset.archive) await setArchived(item, true);
            else if (b.dataset.restore) await setArchived(item, false);
            else if (!(await deleteForever(item))) {
              b.disabled = false;
              return;
            }
            await list();
          } catch (err) {
            b.disabled = false;
            toast(err.message);
          }
        };
      }

      async function list() {
        main.onclick = null;
        const { data, error } = await (await db())
          .from("items")
          .select("id, nickname, brand, model, kind, category, icon, tint, pinned, archived_at, manuals(page_count), manual_facts(status), tasks(active, title, next_due_on)")
          .order("created_at");
        if (error) throw new Error(error.message);
        if (params.get("manage")) return drawManage(data);
        drawList(data.filter((i) => !i.archived_at), data.filter((i) => i.archived_at).length);
      }

      function drawList(items, archived = 0) {
        const kinds = Object.keys(GROUPS).filter((k) => items.some((i) => i.kind === k));
        if (filter !== "all" && !kinds.includes(filter)) filter = "all";
        const shown = items.filter((i) => filter === "all" || i.kind === filter);
        const pinned = items.filter((i) => i.pinned);
        const pinButton = (i) =>
          `<button type="button" class="pin" data-pin="${i.id}" aria-pressed="${i.pinned}" aria-label="${i.pinned ? "Unpin" : "Pin"} ${esc(i.nickname)}" title="${i.pinned ? "Unpin" : "Pin to the top"}">${PIN}</button>`;
        main.innerHTML = `
          <div class="section-head" style="margin:0;align-items:flex-end">
            <div class="stack" style="gap:4px"><div class="row" style="align-items:center;justify-content:space-between;flex-wrap:nowrap"><h1>Your things</h1><a class="button quiet small" href="/things?manage=1" title="Manage things: archive, restore or delete">${ic("settings")}Manage${archived ? ` (${archived})` : ""}</a></div><p class="muted" style="margin:0">Tap a thing for its tasks and manual. Pin the ones you check most.</p></div>
            ${kinds.length > 1 ? `<div class="filters" role="group" aria-label="Show">${["all", ...kinds].map((k) => `<button type="button" data-filter="${k}" aria-pressed="${filter === k}">${k === "all" ? "All" : GROUPS[k]}</button>`).join("")}</div>` : ""}
          </div>
          ${
            pinned.length
              ? `<section aria-labelledby="pinned-h" class="stack">
                  <h2 id="pinned-h" style="margin:0">Pinned</h2>
                  <div class="pinned-grid">${pinned
                    .map((i) => {
                      const next = nextTask(i);
                      const late = next && next.next_due_on < today();
                      return `<div class="card pinned-card">
                        ${itemIcon(i, 64)}
                        <div>
                          <a href="/things?id=${i.id}" style="color:inherit;text-decoration:none;font-weight:700;font-size:18px">${esc(i.nickname)}</a>
                          <span class="small muted">${esc([i.brand, i.model].filter(Boolean).join(" ")) || "No model saved"}</span>
                          <span class="small" style="font-weight:700;margin-top:6px;color:${late ? "var(--coral)" : "var(--accent)"}">${next ? `${esc(next.title)}: ${esc(relDay(next.next_due_on))}` : esc(summary(i).text)}</span>
                        </div>
                        ${pinButton(i)}
                      </div>`;
                    })
                    .join("")}</div>
                </section>`
              : ""
          }
          <section aria-labelledby="all-h" class="stack">
            ${pinned.length ? '<h2 id="all-h" style="margin:0">Everything</h2>' : '<h2 id="all-h" class="sr-only">Everything</h2>'}
            <div class="tile-grid">${shown
              .map((i) => {
                const sum = summary(i);
                return `<div class="card tile">
                  ${sum.late ? '<span class="late-tag">Late</span>' : ""}
                  ${pinButton(i)}
                  ${itemIcon(i, 64)}
                  <a class="tile-name" href="/things?id=${i.id}">${esc(i.nickname)}</a>
                  <span class="small muted">${esc(sum.text)}</span>
                </div>`;
              })
              .join("")}
              <a class="add-tile" href="/things?add=1"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a thing</a>
            </div>
          </section>`;
        for (const b of main.querySelectorAll("[data-filter]")) {
          b.addEventListener("click", () => {
            filter = b.dataset.filter;
            drawList(items, archived);
          });
        }
        for (const b of main.querySelectorAll("[data-pin]")) {
          b.addEventListener("click", async () => {
            const item = items.find((i) => i.id === b.dataset.pin);
            b.disabled = true;
            const { error } = await (await db()).from("items").update({ pinned: !item.pinned }).eq("id", item.id);
            if (error) {
              b.disabled = false;
              return toast(error.message);
            }
            item.pinned = !item.pinned;
            drawList(items);
          });
        }
      }

      // --- One thing -----------------------------------------------------------

      // Someone with the same thing gets a copy of its schedule, facts and pages.
      async function shareCard(item) {
        const supa = await db();
        const body = $("#share-body");
        const { data: share, error } = await supa.from("item_shares").select("code, copies").eq("item_id", item.id).maybeSingle();
        if (error) {
          body.innerHTML = `<p class="small">${esc(error.message)}</p>`;
          return;
        }
        const url = share && `${location.origin}/join?thing=${share.code}`;
        body.innerHTML = share
          ? `<p class="muted small" style="margin:0">Anyone with this link can add a copy of the ${esc(item.nickname.toLowerCase())}'s schedule, facts and your fixes to their own home. Your serial number, notes and history stay here.${share.copies ? ` Copied ${share.copies} ${share.copies === 1 ? "time" : "times"} so far.` : ""}</p>
             <div class="field"><label class="sr-only" for="share-url">Share link</label><input id="share-url" readonly value="${esc(url)}"><button type="button" id="share-send">Share</button></div>
             <button type="button" class="link" id="share-stop">Stop sharing</button>`
          : `<p class="muted small" style="margin:0">Know someone with the same ${esc(item.nickname.toLowerCase())}? Make a link and they can add its schedule, facts and your fixes to their own home, without Muse reading it again.</p>
             <div class="row"><button type="button" id="share-make">Make a share link</button></div>`;
        $("#share-make")?.addEventListener("click", async () => {
          const { error: e } = await supa.from("item_shares").insert({ item_id: item.id });
          if (e) return toast(e.message);
          shareCard(item);
        });
        $("#share-send")?.addEventListener("click", () => shareLink(url, `${item.nickname} manual`));
        $("#share-stop")?.addEventListener("click", async () => {
          const { error: e } = await supa.from("item_shares").delete().eq("item_id", item.id);
          if (e) return toast(e.message);
          toast("The link no longer works.");
          shareCard(item);
        });
      }

      async function detail(id) {
        const supa = await db();
        const { data: item, error } = await supa
          .from("items")
          .select(
            "id, nickname, brand, model, serial, category, kind, icon, tint, pinned, archived_at, uses_per_week, manuals(id, title, page_count, source_url, status, status_detail), manual_facts(id, kind, label, value, source_page, source, status), tasks(id, title, details, interval_unit, interval_value, next_due_on, last_done_on, source_page, source, status, active), seat_modes(id, mode, min_weight_kg, max_weight_kg, min_height_cm, max_height_cm, min_age_months, fit_note, source_page, source, status), item_readings(kind, value, measured_on)",
          )
          .eq("id", id)
          .maybeSingle();
        if (error) throw new Error(error.message);
        if (!item) {
          main.innerHTML = '<p class="card">That thing isn\'t in your household.</p>';
          return;
        }
        const ids = [
          ...item.manual_facts.map((f) => f.id),
          ...item.tasks.map((t) => t.id),
          ...item.seat_modes.map((s) => s.id),
        ];
        const { data: history } = ids.length
          ? await supa
              .from("revisions")
              .select("target_id, before, after, source, reason, created_at")
              .in("target_id", ids)
              .order("created_at", { ascending: false })
          : { data: [] };

        const manual = item.manuals?.[0];
        const readings = [...item.item_readings].sort((a, b) => b.measured_on.localeCompare(a.measured_on));
        const cycles = readings.find((r) => r.kind === "cycles");
        const badge = (x) =>
          STATUS[x.status] ? `<span class="chip ${STATUS[x.status][1]} strong">${STATUS[x.status][0]}</span>` : "";
        const source = (x) =>
          `<span class="row small muted" style="gap:6px"><span class="dot src-${x.source}"></span>${SOURCES[x.source]}${x.source_page ? ` · p. ${x.source_page}` : ""}</span>`;

        main.onclick = null;
        main.innerHTML = `
          <section class="stack">
            <a href="/things" style="font-weight:700;text-decoration:none">← Your things</a>
            ${item.archived_at ? `<div class="card flat archived-banner"><span>${ic("archive")}Archived. It's hidden from your list, your upcoming tasks and Muse.</span><div class="row"><button type="button" class="small" id="restore-item">${ic("unarchive")}Restore</button><button type="button" class="quiet small danger" id="delete-item">${ic("delete")}Delete for good</button></div></div>` : ""}
            <div class="row" style="gap:16px;align-items:center;flex-wrap:nowrap">
              <div class="icon-wrap">${itemIcon(item, 72)}<button type="button" class="corner-btn" id="look-btn" aria-label="Change icon or color" title="Change icon or color" aria-controls="look">${ic("palette")}</button></div>
              <div style="flex:1 1 auto;min-width:0">
                <h1 style="margin:0">${esc(item.nickname)}</h1>
                <p class="muted" style="margin:0">${esc([item.brand, item.model, item.serial && `serial ${item.serial}`].filter(Boolean).join(" · "))}</p>
              </div>
              <button type="button" class="pin" id="share-btn" aria-label="Share this manual" title="Share this manual" aria-controls="share">${ic("share")}</button>
              <button type="button" class="pin" id="pin" aria-pressed="${!!item.pinned}" aria-label="${item.pinned ? "Unpin" : "Pin"} ${esc(item.nickname)}" title="${item.pinned ? "Unpin" : "Pin to the top"}">${PIN}</button>
            </div>
            <div class="row">
              <button type="button" id="ask">${ic("forum")}Ask about the ${esc(item.nickname.toLowerCase())}</button>
              ${manual ? `<button type="button" class="quiet" id="setup">${ic("auto_awesome")}Set it up with Muse</button>` : ""}
              ${manual?.source_url && !isExample(manual.source_url) ? `<a class="button quiet" href="${esc(manual.source_url)}" rel="noopener noreferrer" target="_blank">${ic("menu_book")}Open the manual</a>` : manual?.source_url ? '<span class="small muted">Example manual, no PDF to open</span>' : ""}
            </div>
            <details class="card panel" id="look">
              <summary style="font-weight:700;cursor:pointer">Change icon or color</summary>
              <div class="stack" style="margin-top:14px">
                <div class="stack" style="gap:8px">
                  <span class="small" style="font-weight:700">Icon</span>
                  <div class="choices" role="group" aria-label="Icon">${Object.keys(ICONS)
                    .map((k) => `<button type="button" data-icon="${k}" aria-pressed="${iconKey(item) === k}" aria-label="${ICONS[k][0]}" title="${ICONS[k][0]}">${iconSvg(k, 26)}</button>`)
                    .join("")}</div>
                </div>
                <div class="stack" style="gap:8px">
                  <span class="small" style="font-weight:700">Color</span>
                  <div class="choices" role="group" aria-label="Color">${Object.keys(TINTS)
                    .map((k) => `<button type="button" class="swatch ${k}" data-tint="${k}" aria-pressed="${tintKey(item) === k}" aria-label="${TINTS[k]}" title="${TINTS[k]}"></button>`)
                    .join("")}</div>
                </div>
                <div class="row" style="justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px">
                  ${item.archived_at ? "" : `<button type="button" class="quiet small" id="archive-item">${ic("archive")}Sold it or got rid of it? Archive</button>`}
                </div>
              </div>
            </details>
            <details class="card panel" id="share">
              <summary style="font-weight:700;cursor:pointer">Share this manual</summary>
              <div class="stack" id="share-body" style="margin-top:14px"><p class="muted small">One moment…</p></div>
            </details>
          </section>

          ${
            manual
              ? manualLine(manual)
              : `<section class="card">
                  <h2>Add its manual</h2>
                  <p class="muted">${item.brand || item.model ? "Looking for it online first. Pick the right PDF and Muse reads it into tasks and facts, each with its page." : "Add the brand and model in the details above and Muse can look for it online, or upload the PDF yourself."}</p>
                  ${manualForm(!!(item.brand || item.model))}
                </section>`
          }

          ${
            item.tasks.length
              ? `<section aria-labelledby="sched-h" id="upkeep">
                  <div class="section-head"><h2 id="sched-h">Upkeep</h2>${cycles ? `<span class="small muted">${Number(cycles.value)} uses so far${item.uses_per_week ? `, about ${Number(item.uses_per_week)} a week` : ""}</span>` : ""}</div>
                  <div id="upkeep-body"></div>
                </section>`
              : ""
          }

          ${
            item.seat_modes.length
              ? `<section aria-labelledby="seat-h"><div class="section-head"><h2 id="seat-h">Car seat limits</h2></div>
                  <div class="card">${item.seat_modes
                    .map(
                      (s) => `<div class="fact"><div><strong>${esc(s.mode.replace(/_/g, "-"))}</strong>
                        <div>${[s.max_weight_kg && `${s.min_weight_kg ?? 0} to ${s.max_weight_kg} kg`, s.max_height_cm && `${s.min_height_cm ?? 0} to ${s.max_height_cm} cm`, s.min_age_months && `at least ${s.min_age_months} months`].filter(Boolean).map(esc).join(" · ")}</div>
                        ${s.fit_note ? `<div class="muted">${esc(s.fit_note)}</div>` : ""}
                        <div class="row" style="margin-top:4px">${source(s)}${badge(s)}</div></div>
                        <div class="fact-actions"><button type="button" class="quiet small" data-fix="seat_limit:${s.id}">Fix</button></div></div>`,
                    )
                    .join("")}
                    <p class="small muted">A certified child passenger safety technician can check the fit in person.</p>
                  </div></section>`
              : ""
          }

          ${item.manual_facts.length ? '<div id="facts" class="stack"></div>' : ""}

          ${
            item.tasks.some((t) => t.interval_unit === "cycles")
              ? `<section class="card flat"><h2 style="font-size:22px">Log a reading</h2>
                  <p class="muted small">The cycle count from its display keeps "every 30 washes" tasks on real dates.</p>
                  <form class="field" id="reading"><label class="sr-only" for="cycles">Cycle count</label>
                  <input id="cycles" type="number" min="0" step="1" required placeholder="${cycles ? `Last: ${Number(cycles.value)}` : "Cycle count"}"><button type="submit">Save</button></form></section>`
              : ""
          }

          ${
            history?.length
              ? `<section class="card flat"><h2 style="font-size:22px">History</h2>${history
                  .map(
                    (h) => `<div class="fact"><div>${esc(h.after.label || h.after.title || h.after.mode)}: <s class="muted">${esc(h.before.value ?? h.before.details ?? h.before.fit_note ?? "")}</s> → <strong>${esc(h.after.value ?? h.after.details ?? h.after.fit_note ?? "")}</strong><div class="small muted">“${esc(h.reason)}”</div></div><span class="small muted">${ago(h.created_at)} · ${h.source === "user" ? "You" : "Assistant"}</span></div>`,
                  )
                  .join("")}</section>`
              : ""
          }`;

        $("#ask").addEventListener("click", () => openChat(undefined, () => detail(id)));
        // Muse asks a few questions with small forms (who it's for, when it was bought) and trims the task list.
        $("#setup")?.addEventListener("click", () =>
          openChat(`Set up the ${item.nickname} with me: ask what you need to know.`, () => detail(id)),
        );
        const saveLook = async (change) => {
          const { error } = await supa.from("items").update(change).eq("id", id);
          if (error) return toast(error.message);
          await detail(id);
          if ("icon" in change || "tint" in change) $("#look").open = true;
        };
        $("#pin").addEventListener("click", () => saveLook({ pinned: !item.pinned }));
        const act = (selector, run) =>
          $(selector)?.addEventListener("click", async (e) => {
            const button = e.currentTarget;
            button.disabled = true;
            try {
              await run(button);
            } catch (err) {
              button.disabled = false;
              toast(err.message);
            }
          });
        act("#archive-item", async () => {
          await setArchived(item, true);
          location.assign("/things");
        });
        act("#restore-item", async () => {
          await setArchived(item, false);
          detail(id);
        });
        act("#delete-item", async (button) => {
          if (await deleteForever(item)) location.assign("/things?manage=1");
          else button.disabled = false;
        });
        for (const [button, panel] of [["#look-btn", "#look"], ["#share-btn", "#share"]]) {
          $(button).addEventListener("click", () => {
            const d = $(panel);
            d.open = !d.open;
            if (d.open) d.scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
        }
        $("#share").addEventListener("toggle", (e) => {
          if (e.target.open) shareCard(item);
        });
        for (const b of main.querySelectorAll("[data-icon]")) {
          b.addEventListener("click", () => saveLook({ icon: b.dataset.icon }));
        }
        for (const b of main.querySelectorAll("[data-tint]")) {
          b.addEventListener("click", () => saveLook({ tint: b.dataset.tint }));
        }
        wireManualForm(item, () => detail(id));
        const markDone = async (taskId) => {
          const { error: e } = await supa.rpc("log_task_done", { p_task: taskId });
          if (e) return toast(e.message);
          toast("Done. The next one is scheduled.");
          detail(id);
        };
        for (const b of main.querySelectorAll("[data-reread]")) {
          b.addEventListener("click", async () => {
            b.disabled = true;
            b.textContent = "Reading, up to a minute…";
            try {
              await readManual(b.dataset.reread, (text) => {
                b.textContent = text;
              }, true);
            } catch (err) {
              toast(err.message);
            }
            detail(id);
          });
        }
        const fixIt = (fix) => {
          const [type, target] = fix.split(":");
          const field = { fact: "value", task: "details", seat_limit: "fit_note" }[type];
          const value = prompt("What should it say? Your version wins, and the old one is kept.");
          if (!value?.trim()) return;
          tool("revise_fact", { id: target, type, source: "user", changes: { [field]: value.trim() }, reason: "Set by you." })
            .then(() => {
              toast("Saved.");
              detail(id);
            })
            .catch((err) => toast(err.message));
        };
        // Car seat limits are drawn with the page; upkeep and facts are redrawn on taps, so they delegate.
        for (const b of main.querySelectorAll("[data-fix]")) {
          if (!b.closest("#upkeep, #facts")) b.addEventListener("click", () => fixIt(b.dataset.fix));
        }
        const remember = (key, value) => {
          try {
            sessionStorage.setItem(key, value ?? "");
          } catch {}
        };
        const recall = (key) => {
          try {
            return sessionStorage.getItem(key) || null;
          } catch {
            return null;
          }
        };

        const upkeep = $("#upkeep");
        let groups = guessGroups(item.tasks);
        const drawUpkeep = () => {
          $("#upkeep-body").innerHTML = upkeepBody(item.tasks, groups, recall(`manuals-upkeep-${id}`), { source, badge });
        };
        upkeep?.addEventListener("click", (e) => {
          const done = e.target.closest("[data-done]");
          const fix = e.target.closest("[data-fix]");
          const tile = e.target.closest("[data-group]");
          if (done) markDone(done.dataset.done);
          else if (fix) fixIt(fix.dataset.fix);
          else if (tile) {
            remember(`manuals-upkeep-${id}`, tile.getAttribute("aria-pressed") === "true" ? null : tile.dataset.group);
            drawUpkeep();
          }
        });
        if (upkeep) {
          drawUpkeep();
          // Jev's grouping replaces the keyword guess when it's back; remembered for this visit.
          const key = `manuals-groups-${id}-${item.tasks.length}`;
          let cached = null;
          try {
            cached = JSON.parse(recall(key) || "null");
          } catch {}
          (cached ? Promise.resolve(cached) : api("/api/upkeep-groups", { item_id: id }).then((r) => r.groups))
            .then((jev) => {
              remember(key, JSON.stringify(jev));
              groups = { ...groups, ...jev };
              if (document.body.contains(upkeep)) drawUpkeep();
            })
            .catch(() => {});
        }

        const facts = $("#facts");
        let openCode = null;
        const drawFacts = () => {
          facts.innerHTML = factsBody(item.manual_facts, openCode, { source, badge });
        };
        facts?.addEventListener("click", (e) => {
          const fix = e.target.closest("[data-fix]");
          const code = e.target.closest("[data-code]");
          if (fix) fixIt(fix.dataset.fix);
          else if (e.target.closest("[data-ask-facts]")) openChat(undefined, () => detail(id));
          else if (e.target.closest("[data-copy-specs]")) {
            // Plain "Label: value" lines, ready to paste into a parts order or a support chat.
            const text = [
              [item.nickname, item.brand, item.model].filter(Boolean).join(" "),
              ...item.manual_facts.filter((f) => f.kind === "spec").map((f) => `${f.label}: ${f.value}`),
            ].join("\n");
            navigator.clipboard
              .writeText(text)
              .then(() => toast("Specs copied."))
              .catch(() => toast("Couldn't copy here; select the text instead."));
          }
          else if (code) {
            openCode = openCode === code.dataset.code ? null : code.dataset.code;
            drawFacts();
          }
        });
        if (facts) drawFacts();
        $("#reading")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const out = await tool("record_measurement", { item: id, cycles: Number($("#cycles").value) });
            toast(out.summary);
            detail(id);
          } catch (err) {
            toast(err.message);
          }
        });
      }

      // --- Upkeep tiles -------------------------------------------------------
      // "What do you want to work on?": tasks sorted into a few groups, one
      // tile each; a tile opens its tasks as one line each, details on tap.
      /** A Material Symbols icon; decorative, the text next to it says what it does. */
      const ic = (name) => `<span class="msi" aria-hidden="true">${name}</span>`;
      const UPKEEP_ICONS = { due: "event", cleaning: "cleaning_services", parts: "build", checks: "fact_check", setup: "tune", safety: "health_and_safety", other: "more_horiz" };
      const UPKEEP = [
        ["due", "Due soon"],
        ["cleaning", "Cleaning", /clean|wash|wipe|descal|rinse|deodor|soak|scrub|dust|stain|odor/i],
        ["parts", "Filters & parts", /filter|replac|bulb|lamp|batter|seal|gasket|accessor|turntable|rack|\bparts?\b/i],
        ["checks", "Checks", /inspect|check|test|look for|examine|wear|damage|leak|loose|tighten/i],
        ["setup", "Setup & use", /install|set ?up|setting|program|mode|how to|adjust|level/i],
        ["safety", "Safety", /safety|warn|unplug|disconnect|power|child|expir|recall|discard|never|do not/i],
        ["other", "Other"],
      ];

      /** Instant keyword guess per task; Jev's answer replaces it when it arrives. */
      function guessGroups(tasks) {
        const out = {};
        for (const t of tasks) {
          const text = `${t.title} ${t.details ?? ""}`;
          out[t.id] = UPKEEP.find(([, , re]) => re?.test(text))?.[0] ?? "other";
        }
        return out;
      }

      const dueSoon = (t) => t.active && t.next_due_on && daysBetween(today(), t.next_due_on) <= 14;
      const late = (t) => t.active && t.next_due_on && t.next_due_on < today();

      function upkeepBody(tasks, groups, open, { source, badge }) {
        const members = (key) =>
          key === "due"
            ? tasks.filter(dueSoon).sort((a, b) => a.next_due_on.localeCompare(b.next_due_on))
            : tasks.filter((t) => groups[t.id] === key);
        const tiles = UPKEEP.map(([key, label]) => {
          const list = members(key);
          if (!list.length) return "";
          const overdue = list.filter(late).length;
          return `<button type="button" class="uk-tile${key === "due" ? " due" : ""}" data-group="${key}" aria-pressed="${open === key}">
            <span class="msi uk-icon" aria-hidden="true">${UPKEEP_ICONS[key]}</span>
            <strong>${esc(label)}</strong>
            <span class="small muted">${list.length} ${list.length === 1 ? "task" : "tasks"}</span>
            ${overdue ? `<span class="small late">${overdue} late</span>` : ""}
          </button>`;
        }).join("");
        const when = (t) =>
          t.next_due_on
            ? `<span class="small ${late(t) ? "late" : "muted"}">${esc(relDay(t.next_due_on))}</span>`
            : `<span class="small muted">${esc(howOften(t.interval_unit, t.interval_value))}</span>`;
        const rows = (open ? members(open) : [])
          .map(
            (t) => `<details class="line">
              <summary><span class="line-title">${esc(t.title)}</span>${when(t)}</summary>
              <div class="stack line-body">
                ${t.details ? `<div>${esc(t.details)}</div>` : ""}
                <div class="row">${source(t)}${badge(t)}<span class="small muted">${esc(howOften(t.interval_unit, t.interval_value))}</span></div>
                <div class="row">${t.active ? `<button type="button" class="small" data-done="${t.id}">${ic("check")}Done</button>` : ""}<button type="button" class="quiet small" data-fix="task:${t.id}">${ic("edit")}Fix</button></div>
              </div>
            </details>`,
          )
          .join("");
        return `<p class="muted" style="margin:0 0 10px">What do you want to work on?</p>
          <div class="uk-tiles" role="group" aria-label="Kinds of upkeep">${tiles}</div>
          ${open && members(open).length ? `<div class="card lines">${rows}</div>` : ""}`;
      }

      // --- Facts overview -----------------------------------------------------
      // Specs as one compact table, error codes as chips you tap, the rest
      // folded away with a count. Fix lives inside an opened entry, not on every row.
      /** The specs' one-line summary: up to three short values, numbers first. */
      function glanceLine(specs) {
        const short = specs.filter((f) => f.value.length <= 20);
        const picked = [...short.filter((f) => /\d/.test(f.value)), ...short.filter((f) => !/\d/.test(f.value))].slice(0, 3);
        return (picked.length ? picked : specs.slice(0, 2)).map((f) => (f.value.length > 24 ? `${f.value.slice(0, 24)}…` : f.value)).join(" · ");
      }

      function factsBody(facts, openCode, { source, badge }) {
        const of = (kind) => facts.filter((f) => f.kind === kind);
        const page = (f) => (f.source_page ? `<span class="small muted"> p. ${f.source_page}</span>` : "");
        const check = (f) => (f.status === "needs_review" ? ' <span class="chip gold strong">To check</span>' : "");
        const specs = of("spec");
        const codes = of("error_code");
        const glance = specs.length
          ? `<section aria-labelledby="glance-h"><div class="section-head"><h2 id="glance-h">At a glance</h2></div>
              <div class="card glance-card"><button type="button" class="corner-copy" data-copy-specs aria-label="Copy all specs" title="Copy all specs">${ic("content_copy")}</button>
                <details class="glance-more"><summary><span class="glance-line">${esc(glanceLine(specs))}</span><span class="glance-all"><span class="when-closed">All ${specs.length}</span><span class="when-open">Less</span></span></summary>
                  <dl class="glance">${specs
                    .map((f) => `<dt>${esc(f.label)}</dt><dd>${esc(f.value)}${page(f)}${check(f)}</dd>`)
                    .join("")}</dl>
                  <button type="button" class="link small" data-ask-facts>Something off? Ask Muse</button>
                </details></div></section>`
          : "";
        const open = codes.find((f) => f.id === openCode);
        const codeCard = codes.length
          ? `<section aria-labelledby="codes-h"><div class="section-head"><h2 id="codes-h">Error codes</h2></div>
              <div class="card"><p class="muted" style="margin:0 0 10px">Seeing a code on the display?</p>
                <div class="codes" role="group" aria-label="Error codes">${codes
                  .map((f) => `<button type="button" class="code" data-code="${f.id}" aria-pressed="${f.id === openCode}">${esc(f.label)}</button>`)
                  .join("")}</div>
                ${open ? `<div class="stack line-body" style="margin-top:12px"><div><strong>${esc(open.label)}</strong>: ${esc(open.value)}</div><div class="row">${source(open)}${badge(open)}<button type="button" class="quiet small" data-fix="fact:${open.id}">${ic("edit")}Fix</button></div></div>` : ""}
              </div></section>`
          : "";
        const folded = ["part", "safety", "other"]
          .map((kind) => {
            const list = of(kind);
            if (!list.length) return "";
            return `<details class="card fold"><summary><strong>${KINDS[kind]}</strong> <span class="muted small">${list.length}</span></summary>
              <div class="lines">${list
                .map(
                  (f) => `<details class="line"><summary><span class="line-title">${esc(f.label)}</span>${f.status === "needs_review" ? '<span class="chip gold strong">To check</span>' : ""}</summary>
                    <div class="stack line-body"><div>${esc(f.value)}</div><div class="row">${source(f)}${badge(f)}<button type="button" class="quiet small" data-fix="fact:${f.id}">${ic("edit")}Fix</button></div></div></details>`,
                )
                .join("")}</div></details>`;
          })
          .join("");
        return glance + codeCard + folded;
      }

      // --- Adding --------------------------------------------------------------

      // Searching is the default; a link or an upload is the fallback, opened when the search comes up empty.
      function manualForm(searchable) {
        return `<div class="stack" id="found" aria-live="polite"></div>
          ${searchable ? '<div class="row"><button type="button" class="quiet small hidden" id="find-manual">Search again</button></div>' : ""}
          <details id="own-pdf"${searchable ? "" : " open"}>
            <summary>Have the PDF or a link?</summary>
            <div class="stack" style="margin-top:10px">
              <form class="field" data-link><label class="sr-only" for="pdf-url">Link to the manual PDF</label>
                <input id="pdf-url" type="url" placeholder="https://maker.example/manual.pdf"><button type="submit">Read it</button></form>
              <div class="row"><label class="button quiet" for="pdf-file" style="cursor:pointer">Upload a PDF</label>
                <input id="pdf-file" type="file" accept="application/pdf" class="sr-only"><span class="small muted" data-progress role="status"></span></div>
            </div>
          </details>`;
      }

      const FOUND_KEY = (id) => `manuals-found-${id}`;

      function candidateCard(c) {
        const tags = [
          c.official ? '<span class="chip teal strong">From the maker</span>' : "",
          c.unchecked
            ? `<span class="chip gold">Couldn't open it to check; the link names your model</span>`
            : c.has_model
              ? c.match === "lookalike"
                ? '<span class="chip gold">Nearly your model number; check the label</span>'
                : `<span class="chip teal">${c.match === "family" ? "Same model family" : "Names your model"}</span>`
              : '<span class="chip gold">Model not found in the text</span>',
        ].join("");
        return `<div class="card found-card">
          <div class="stack" style="gap:4px;min-width:0">
            <strong style="overflow-wrap:anywhere">${esc(c.title || c.url.split("/").pop())}</strong>
            <span class="small muted" style="overflow-wrap:anywhere">${esc(c.host)}${c.page_count ? ` · ${c.page_count} pages` : ""}</span>
            <div class="row" style="gap:6px">${tags}</div>
            ${c.model_hint ? `<p class="small" style="margin:4px 0 0">This manual spells it <strong>${esc(c.model_hint)}</strong>; the label photo may have been misread. <button type="button" class="quiet small" data-fix-model="${esc(c.model_hint)}">Fix the model</button></p>` : ""}
          </div>
          <div class="row">
            <button type="button" data-use="${esc(c.url)}" data-official="${c.official}">Use this</button>
            <a class="button quiet" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
        </div>`;
      }

      async function findOnline(item, after, fresh = false) {
        const found = $("#found");
        const button = $("#find-manual");
        const fallback = () => {
          const own = $("#own-pdf");
          if (own) own.open = true;
        };
        if (button) button.disabled = true;
        found.innerHTML = '<p class="muted small" role="status">Searching the web for the manual and opening the best PDFs. About 10 seconds…</p>';
        try {
          // One search per thing per visit; going back and forth reuses it.
          let out;
          try {
            out = fresh ? null : JSON.parse(sessionStorage.getItem(FOUND_KEY(item.id)) || "null");
          } catch {}
          if (!out) {
            out = await api("/api/find-manual", { item_id: item.id });
            // Only a search that found something is remembered; an empty one is tried again next visit.
            try {
              if (out.candidates.length) sessionStorage.setItem(FOUND_KEY(item.id), JSON.stringify(out));
              else sessionStorage.removeItem(FOUND_KEY(item.id));
            } catch {}
          }
          if (!out.candidates.length) {
            found.innerHTML = `<p class="muted small">Couldn't find a PDF that looks like this one for “${esc(out.query)}”. If you have the paper manual, the maker's site often has it under Support; paste that link or upload the PDF below.</p>`;
            fallback();
            return;
          }
          found.innerHTML = `<h3>Is this yours?</h3>${out.candidates.map(candidateCard).join("")}`;
          // The maker's PDF prints the real number; one tap saves it on the thing.
          for (const b of found.querySelectorAll("[data-fix-model]")) {
            b.addEventListener("click", async () => {
              b.disabled = true;
              const { error } = await (await db()).from("items").update({ model: b.dataset.fixModel }).eq("id", item.id);
              if (error) {
                b.disabled = false;
                return toast(error.message);
              }
              item.model = b.dataset.fixModel;
              for (const other of found.querySelectorAll("[data-fix-model]")) other.closest("p")?.remove();
              toast(`Model saved as ${item.model}.`);
            });
          }
          // Two calls: download and store (a maker's site can be slow), then Muse's read.
          // Progress and errors stay on the card, not in a toast that disappears.
          for (const b of found.querySelectorAll("[data-use]")) {
            b.addEventListener("click", async () => {
              const uses = found.querySelectorAll("[data-use]");
              for (const other of uses) other.disabled = true;
              let status = found.querySelector("[data-attach-status]");
              if (!status) {
                found.insertAdjacentHTML("beforeend", '<p class="small" role="status" data-attach-status></p>');
                status = found.querySelector("[data-attach-status]");
              }
              status.style.color = "";
              status.textContent = "Downloading the manual from the maker's site. Some are slow; this can take a minute or two.";
              try {
                const { manual_id } = await api("/api/attach", { item_id: item.id, url: b.dataset.use, official: b.dataset.official === "true" });
                status.textContent = "Got it. Muse is reading the manual now, about a minute.";
                await readManual(manual_id, (text) => {
                  status.textContent = text;
                });
                after();
              } catch (err) {
                status.style.color = "var(--coral)";
                status.textContent = err.message;
                for (const other of uses) other.disabled = false;
              }
            });
          }
        } catch (err) {
          found.innerHTML = `<p class="small" style="color:var(--coral)">${esc(err.message)}</p>`;
          fallback();
        } finally {
          if (button) {
            button.disabled = false;
            button.classList.remove("hidden");
          }
        }
      }

      function wireManualForm(item, after) {
        const link = main.querySelector("[data-link]");
        if (!link) return;
        $("#find-manual")?.addEventListener("click", () => findOnline(item, after, true));
        if (params.get("find") === "1") history.replaceState(null, "", `/things?id=${item.id}`);
        if (item.brand || item.model) findOnline(item, after);
        const progress = $("[data-progress]");
        link.addEventListener("submit", async (e) => {
          e.preventDefault();
          progress.textContent = "Muse is reading the manual. This takes up to a minute.";
          try {
            const out = await tool("add_item", { attach_to: item.id, pdf_url: $("#pdf-url").value.trim() });
            toast(out.summary);
            after();
          } catch (err) {
            progress.textContent = err.message;
          }
        });
        $("#pdf-file").addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          progress.textContent = "Uploading…";
          try {
            await uploadManual(item, file, (t) => {
              progress.textContent = t;
            });
            after();
          } catch (err) {
            progress.textContent = err.message;
          }
        });
      }

      // A failed read used to save the reader's raw error here; show those as one plain sentence.
      const READ_FAILED = "Muse couldn't turn it into a schedule this time. The text is still searchable, and you can read it again.";
      const canReread = (m) =>
        m.status === "text_ready" && /couldn't distill|couldn't turn it into|wasn't read yet|not read yet|scanned pages/.test(m.status_detail || "");

      function manualLine(manual) {
        const detail = /couldn't distill/.test(manual.status_detail || "") ? READ_FAILED : manual.status_detail;
        // A failed or unread manual gets the button up front; a read one gets a quiet one (your fixes are kept).
        const button = canReread(manual)
          ? ` <button type="button" class="small" data-reread="${esc(manual.id)}">Read it again</button>`
          : manual.status === "distilled"
            ? ` <button type="button" class="link small" data-reread="${esc(manual.id)}">Read it again</button>`
            : "";
        return `<p class="small muted">${esc(manual.title || "Manual")}${manual.page_count ? `, ${manual.page_count} pages` : ""}${detail ? `. ${esc(detail)}` : ""}${button}</p>`;
      }

      /**
       * Asks Muse to read a manual. If the connection drops (the phone switched apps) or a
       * read is already running, the server keeps going, so this checks back until it's done.
       */
      async function readManual(manualId, say, reread = false) {
        let out;
        try {
          out = await api("/api/ingest", reread ? { manual_id: manualId, reread: true } : { manual_id: manualId });
        } catch (err) {
          if (!err.dropped && !err.busy) throw err;
          // A refused re-read right after a read has nothing to wait for.
          if (err.busy && reread && /just read/.test(err.message)) throw err;
          say("Still reading. You can leave this page; it keeps going.");
          out = await waitForRead(manualId);
        }
        toast(out.distilled ? `Read it: ${out.distilled.tasks} tasks, ${out.distilled.facts} facts.` : out.note || "Saved.");
      }

      /** Checks the manual every few seconds until no read is running, for up to six minutes. */
      async function waitForRead(manualId) {
        const supa = await db();
        const until = Date.now() + 6 * 60_000;
        while (Date.now() < until) {
          await new Promise((r) => setTimeout(r, 5000));
          const { data: m } = await supa.from("manuals").select("status, status_detail, reading_since").eq("id", manualId).maybeSingle();
          if (m && !m.reading_since && m.status !== "pending") {
            return { note: m.status === "distilled" ? "Muse finished reading it." : m.status_detail || "Saved." };
          }
        }
        return { note: "Still working on it. Check back in a minute." };
      }

      async function uploadManual(item, file, say) {
        const supa = await db();
        const { data: hid } = await supa.rpc("ensure_household");
        const { data: manual, error } = await supa
          .from("manuals")
          .insert({ household_id: hid, item_id: item.id, title: file.name, source: "pdf_upload" })
          .select("id")
          .single();
        if (error) throw new Error(error.message);
        const path = `${hid}/${manual.id}.pdf`;
        const up = await supa.storage.from("manuals").upload(path, file, { contentType: "application/pdf", upsert: true });
        if (up.error) throw new Error(up.error.message);
        await supa.from("manuals").update({ storage_path: path }).eq("id", manual.id);
        say("Muse is reading the manual. This takes up to a minute.");
        await readManual(manual.id, say);
      }

      /** Shrinks a photo to at most 1280 px so it stays small to send. */

      // --- Add a thing: a short wizard -----------------------------------------

      // Where the model label usually is, by what the thing is.
      const LABEL_SPOTS = {
        washer: "under the lid or around the door opening",
        dryer: "inside the door frame",
        dishwasher: "on the edge of the door, top or side",
        fridge: "on a wall inside the fridge, near the top or the crisper",
        range: "behind the storage drawer or on the oven frame",
        microwave: "inside the door frame or on the back",
        furnace: "inside the front panel door",
        water_heater: "on the side of the tank",
        air_conditioner: "on the side of the outdoor unit",
        car_seat: "on a sticker on the side or the bottom of the seat",
        stroller: "on the frame near the back wheels",
        mower: "on the deck, near the back",
        vacuum: "under the base or the bin",
        coffee: "on the bottom",
        car: "on the driver's door frame",
        other: "on the back, the bottom, or inside a door",
      };
      const KIND_OF = { car_seat: "baby_gear", stroller: "baby_gear", car: "vehicle", mower: "other", other: "other" };

      function add() {
        // What we know so far; the photo fills it, the person corrects it.
        const thing = { nickname: "", brand: "", model: "", serial: "", category: null, kind: "appliance", pdf: "" };
        let image = null;
        let manual = params.get("add") === "pdf";

        const head = `<section class="stack">
            <a href="/things" style="font-weight:700;text-decoration:none">← Your things</a>
            <h1>Add a thing</h1>
          </section>`;

        function where() {
          const key = thing.category ? iconKey({ category: thing.category }) : null;
          return LABEL_SPOTS[key] ?? "inside the door, on the back, or under the base";
        }

        function picker(label) {
          return `<div class="stack" style="gap:8px">
            <strong class="small">${label}</strong>
            <div class="choices" role="group" aria-label="${label}">${Object.keys(ICONS)
              .map((k) => `<button type="button" data-what="${k}" aria-pressed="${thing.category && iconKey({ category: thing.category }) === k}" aria-label="${ICONS[k][0]}" title="${ICONS[k][0]}">${iconSvg(k, 26)}</button>`)
              .join("")}</div>
          </div>`;
        }

        function photoButton(text, quiet = false) {
          return `<label class="button ${quiet ? "outline" : ""}" for="photo" style="cursor:pointer">${text}</label>`;
        }

        function detailsForm(open) {
          return `<details class="card" id="manual-entry" ${open ? "open" : ""}>
            <summary style="font-weight:700;cursor:pointer">${open ? "Details" : "Enter the details yourself"}</summary>
            <form class="stack" id="add-form" style="margin-top:12px">
              <label class="small" for="f-nick"><strong>What do you call it?</strong></label>
              <input id="f-nick" required placeholder="Washer" value="${esc(thing.nickname)}">
              <label class="small" for="f-brand"><strong>Brand</strong></label><input id="f-brand" value="${esc(thing.brand)}">
              <label class="small" for="f-model"><strong>Model</strong></label><input id="f-model" value="${esc(thing.model)}">
              <label class="small" for="f-serial"><strong>Serial</strong> <span class="muted">(optional)</span></label><input id="f-serial" value="${esc(thing.serial)}">
              <label class="small" for="f-kind"><strong>Kind</strong></label>
              <select id="f-kind">${[["appliance", "Appliance"], ["baby_gear", "Baby gear"], ["vehicle", "Vehicle"], ["other", "Other"]]
                .map(([v, t]) => `<option value="${v}" ${thing.kind === v ? "selected" : ""}>${t}</option>`)
                .join("")}</select>
              <label class="small" for="f-pdf"><strong>Link to the manual PDF</strong> <span class="muted">(optional; we'll search for it otherwise)</span></label>
              <input id="f-pdf" type="url" placeholder="https://maker.example/manual.pdf" value="${esc(thing.pdf)}">
              <button type="submit">Add it</button>
              <p class="small muted" data-add-msg role="status"></p>
            </form>
          </details>`;
        }

        function step(body) {
          main.innerHTML = `${head}
            <section class="card wizard" style="max-width:640px">${body}</section>
            <input id="photo" type="file" accept="image/*" capture="environment" class="sr-only">
            <div style="max-width:640px">${detailsForm(manual)}</div>`;
          $("#photo").addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            if (file) read(file);
          });
          for (const b of main.querySelectorAll("[data-what]")) {
            b.addEventListener("click", () => {
              thing.category = b.dataset.what;
              thing.kind = KIND_OF[b.dataset.what] ?? "appliance";
              if (!thing.nickname) thing.nickname = ICONS[b.dataset.what][0];
              redraw();
            });
          }
          $("[data-type]")?.addEventListener("click", () => {
            manual = true;
            redraw();
            $("#f-nick").focus();
          });
          $("[data-continue]")?.addEventListener("click", () => save(main.querySelector("[data-continue]")));
          $("[data-anyway]")?.addEventListener("click", () => readImage(async () => image, true));
          $("#add-form").addEventListener("submit", (e) => {
            e.preventDefault();
            thing.nickname = $("#f-nick").value.trim();
            thing.brand = $("#f-brand").value.trim();
            thing.model = $("#f-model").value.trim();
            thing.serial = $("#f-serial").value.trim();
            thing.kind = $("#f-kind").value;
            thing.pdf = $("#f-pdf").value.trim();
            save($("#add-form [type=submit]"));
          });
          $("#f-nick-quick")?.addEventListener("input", (e) => {
            thing.nickname = e.target.value;
          });
        }

        let redraw = start;

        function start() {
          redraw = start;
          step(`<div class="stack" style="justify-items:start">
            <h2>Take a photo of its label</h2>
            <p class="muted">Muse reads the brand and model off it, then finds the manual for you. The label is usually ${esc(where())}.</p>
            ${photoButton(`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg> Take or choose a photo`)}
            <div class="row"><button type="button" class="link" data-type>Type it in instead</button><span class="muted">·</span><a href="/things?add=pdf" class="link">I already have the PDF</a></div>
          </div>`);
        }

        function reading() {
          step(`<div class="stack">
            ${image ? `<img src="${image}" alt="Your label photo" class="wizard-photo">` : ""}
            <p class="muted" role="status">Reading the label…</p>
          </div>`);
        }

        function notFound() {
          redraw = notFound;
          step(`<div class="stack">
            ${image ? `<img src="${image}" alt="Your label photo" class="wizard-photo">` : ""}
            <h2>Couldn't read a label in that one</h2>
            <p class="muted">Get close enough that the text fills most of the photo, in good light, without glare. ${thing.category ? `On a ${esc(ICONS[iconKey({ category: thing.category })][0].toLowerCase())} it's usually ${esc(where())}.` : "Tell me what it is and I'll say where to look."}</p>
            ${picker("What is it?")}
            <div class="row">${photoButton("Try another photo")}<button type="button" class="quiet" data-type>Type it in</button></div>
          </div>`);
        }

        // Jev's quick look found no label, or text too blurry to read; Muse wasn't asked yet.
        function retake(reason) {
          redraw = () => retake(reason);
          step(`<div class="stack">
            ${image ? `<img src="${image}" alt="Your label photo" class="wizard-photo">` : ""}
            <h2>${reason === "blurry" ? "That one's a little blurry" : "I don't see a label in that one"}</h2>
            <p class="muted">${reason === "blurry" ? "Hold steady a moment, tap to focus, and avoid glare on the sticker." : "Look for a sticker with the model number, usually inside the door, on the back or under the base."} A close photo of just the label works best.</p>
            <div class="row">${photoButton("Take another photo")}<button type="button" class="quiet" data-anyway>Read it anyway</button><button type="button" class="quiet" data-type>Type it in</button></div>
          </div>`);
        }

        function partial() {
          redraw = partial;
          const got = [thing.brand && `<strong>${esc(thing.brand)}</strong>`, thing.model && `model <strong>${esc(thing.model)}</strong>`].filter(Boolean).join(", ");
          const missing = !thing.model ? "the model number" : "all of it clearly";
          step(`<div class="stack">
            ${image ? `<img src="${image}" alt="Your label photo" class="wizard-photo">` : ""}
            <h2>Almost</h2>
            <p>I read ${got || "part of it"}, but not ${missing}. ${thing.category ? `On a ${esc(ICONS[iconKey({ category: thing.category })][0].toLowerCase())} the model label is usually ${esc(where())}.` : ""} A close photo of just that sticker works best.</p>
            ${thing.category ? "" : picker("What is it?")}
            <div class="row">${photoButton("Take a closer photo")}<button type="button" class="quiet" data-type>Type the model</button><button type="button" class="quiet" data-continue>Continue without it</button></div>
            <p class="small muted" data-add-msg role="status"></p>
          </div>`);
        }

        function confirm() {
          redraw = confirm;
          const key = iconKey(thing);
          step(`<div class="stack">
            <div class="row" style="gap:14px;flex-wrap:nowrap">
              ${itemIcon(thing, 64)}
              <div style="min-width:0">
                <h2 style="margin:0">${esc([thing.brand, ICONS[key][0].toLowerCase() === "other" ? "" : ICONS[key][0].toLowerCase()].filter(Boolean).join(" "))}</h2>
                <p class="muted" style="margin:0">Model ${esc(thing.model)}${thing.serial ? ` · serial ${esc(thing.serial)}` : ""}</p>
              </div>
            </div>
            <label class="small" for="f-nick-quick"><strong>What do you call it?</strong></label>
            <input id="f-nick-quick" value="${esc(thing.nickname)}" placeholder="Washer">
            <div class="row"><button type="button" data-continue>Add it and find the manual</button>${photoButton("Retake", true)}</div>
            <p class="small muted">Something off? Fix it in the details below.</p>
            <p class="small muted" data-add-msg role="status"></p>
          </div>`);
        }

        async function read(file) {
          return readImage(() => shrink(file));
        }

        async function readImage(getImage, force = false) {
          // A closer photo after "Almost" adds to what we read; any other photo starts over.
          if (redraw !== partial) {
            Object.assign(thing, { nickname: "", brand: "", model: "", serial: "", category: null, kind: "appliance" });
          }
          try {
            image = await getImage();
            reading();
            const label = await api("/api/snap", force ? { image, force: true } : { image });
            if (label.retake) return retake(label.retake);
            if (label.category) thing.category = label.category;
            if (label.kind) thing.kind = label.kind;
            if (!label.found && !label.brand && !label.model) return notFound();
            thing.nickname = label.nickname || thing.nickname;
            thing.brand = label.brand || thing.brand;
            thing.model = label.model || thing.model;
            thing.serial = label.serial || thing.serial;
            if (!thing.model || label.unsure) return partial();
            confirm();
          } catch (err) {
            notFound();
            toast(err.message);
          }
        }

        async function save(button) {
          const msg = main.querySelector("[data-add-msg]");
          if (!thing.nickname) thing.nickname = thing.category ? ICONS[iconKey(thing)][0] : "";
          if (!thing.nickname) {
            manual = true;
            redraw();
            $("#f-nick").focus();
            return;
          }
          button.disabled = true;
          if (msg) msg.textContent = thing.pdf ? "Adding it. Muse is reading the manual, up to a minute." : "Adding it…";
          const args = { nickname: thing.nickname, kind: thing.kind, ...(thing.category ? { category: thing.category } : {}) };
          for (const key of ["brand", "model", "serial"]) if (thing[key]) args[key] = thing[key];
          if (thing.pdf) args.pdf_url = thing.pdf;
          try {
            const out = await tool("add_item", args);
            toast(out.summary.split(".")[0]);
            location.assign(`/things?id=${out.data.item.id}${thing.pdf ? "" : "&find=1"}`);
          } catch (err) {
            button.disabled = false;
            if (msg) msg.textContent = err.message;
            else toast(err.message);
          }
        }

        const handed = takePendingPhoto();
        if (handed) readImage(async () => handed);
        else start();
      }

      async function start() {
        if (!(await boot("/things"))) return;
        if (params.get("id")) return detail(params.get("id"));
        if (params.get("add")) return add();
        return list();
      }
      start().catch((err) => {
        main.innerHTML = `<p class="card">Something went wrong: ${esc(err.message)}</p>`;
      });
    </script>
  </body>
</html>
