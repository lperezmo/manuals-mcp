<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your things · Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0..1,0&icon_names=add_a_photo,archive,auto_awesome,autorenew,build,center_focus_strong,check,cleaning_services,close,content_copy,delete,download,edit,event,expand_more,fact_check,flare,forum,health_and_safety,history,info,inventory_2,ios_share,keyboard,location_on,menu_book,more_horiz,new_releases,open_in_new,palette,photo_camera,picture_as_pdf,receipt_long,schedule,search,settings,share,task_alt,tune,unarchive,upload,zoom_in&display=block"
    />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header class="top" id="top"></header>
    <main class="wrap" id="main">
      <p class="muted">One moment…</p>
    </main>

    <script type="module">
      import { $, ago, api, boot, daysBetween, db, esc, forgetJob, howOften, ICONS, iconKey, iconSvg, itemIcon, loadItemPhotos, openChat, relDay, setItemPhoto, shareLink, shrink, TINTS, takePendingPhoto, tintKey, toast, today, tool, watchJob } from "/app.js";
      import { JOB_MAX_MS } from "/jobs.js";

      const main = $("#main");
      const params = new URLSearchParams(location.search);
      const KINDS = { error_code: "Error codes", part: "Parts", spec: "Specs", safety: "Safety", other: "Other" };
      const SOURCES = { reader: "Read by Muse", assistant: "Checked by an assistant", user: "Set by you" };
      const STATUS = { needs_review: ["To check", "gold"], revised: ["Revised", "teal"], confirmed: ["Checked", "teal"] };

      // --- List ---------------------------------------------------------------

      const PIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2h-5v6l-1 1-1-1v-6H6v-2l4-4z"></path></svg>';
      const GROUPS = { appliance: "Appliances", baby_gear: "Baby gear", vehicle: "Vehicles", other: "Other" };
      let filter = "all";

      // The example home's manuals are made up, so there is no PDF to open.
      const isExample = (url) => /^https:\/\/example\.com\//.test(url);

      function nextTask(i) {
        const open = (i.tasks ?? []).filter((t) => t.active && t.next_due_on).sort((a, b) => a.next_due_on.localeCompare(b.next_due_on));
        return open[0];
      }

      function summary(i) {
        const tasks = (i.tasks ?? []).filter((t) => t.active);
        const late = tasks.filter((t) => t.next_due_on && t.next_due_on < today()).length;
        const check = (i.manual_facts ?? []).filter((f) => f.status === "needs_review").length;
        if (!i.manuals?.length) return { late, text: "No manual yet" };
        const parts = [`${tasks.length} task${tasks.length === 1 ? "" : "s"}`];
        if (late) parts.push(`${late} late`);
        else if (check) parts.push(`${check} to check`);
        return { late, text: parts.join(" · ") };
      }

      // --- Archive / restore / delete for good ---------------------------------
      // Archiving hides a thing (sold, given away, thrown out) from lists,
      // upcoming tasks and Muse, and keeps everything. Only deleting is final.
      async function setArchived(item, on) {
        const { error } = await (await db())
          .from("items")
          .update(on ? { archived_at: new Date().toISOString(), pinned: false } : { archived_at: null })
          .eq("id", item.id);
        if (error) throw new Error(error.message);
        toast(on ? `Archived the ${item.nickname}. Find it under Manage things.` : `The ${item.nickname} is back.`);
      }

      /** Asks first; removes the stored PDFs and photo, then the item (its manual, tasks, facts and history go with it). */
      async function deleteForever(item) {
        if (!confirm(`Delete the ${item.nickname} for good, with its manual, upkeep, facts and history? This can't be undone.`)) return false;
        const supa = await db();
        const { data: files } = await supa.from("manuals").select("storage_path").eq("item_id", item.id);
        const paths = (files ?? []).map((f) => f.storage_path).filter(Boolean);
        if (paths.length) await supa.storage.from("manuals").remove(paths);
        if ((await loadItemPhotos())?.has(item.id)) await setItemPhoto(item, null).catch(() => {});
        const { error } = await supa.from("items").delete().eq("id", item.id);
        if (error) throw new Error(error.message);
        toast(`Deleted the ${item.nickname}.`);
        return true;
      }

      function drawManage(items) {
        const active = items.filter((i) => !i.archived_at);
        const archived = items.filter((i) => i.archived_at);
        const row = (i, buttons) => `<div class="manage-row">${itemIcon(i, 44)}<div class="manage-name"><strong>${esc(i.nickname)}</strong><span class="small muted">${esc([i.brand, i.model].filter(Boolean).join(" ")) || "No model saved"}</span></div><div class="row">${buttons}</div></div>`;
        main.innerHTML = `
          <section class="stack">
            <a href="/things" style="font-weight:700;text-decoration:none">← Your things</a>
            <h1 style="margin:0">Manage things</h1>
            <p class="muted" style="margin:0">Sold it, gave it away or threw it out? Archive it: it leaves your list, your upcoming tasks and Muse, and you can bring it back any time.</p>
          </section>
          <section class="card lines">${active.map((i) => row(i, `<button type="button" class="quiet small" data-archive="${i.id}">${ic("archive")}Archive</button>`)).join("") || '<p class="muted small">Nothing here yet.</p>'}</section>
          ${
            archived.length
              ? `<section class="stack"><h2 style="margin:0">Archived</h2><div class="card lines">${archived
                  .map((i) => row(i, `<button type="button" class="quiet small" data-restore="${i.id}">${ic("unarchive")}Restore</button><button type="button" class="quiet small danger" data-delete="${i.id}">${ic("delete")}Delete for good</button>`))
                  .join("")}</div></section>`
              : ""
          }`;
        const byId = new Map(items.map((i) => [i.id, i]));
        main.onclick = async (e) => {
          const b = e.target.closest("[data-archive], [data-restore], [data-delete]");
          if (!b) return;
          const item = byId.get(b.dataset.archive || b.dataset.restore || b.dataset.delete);
          b.disabled = true;
          try {
            if (b.dataset.archive) await setArchived(item, true);
            else if (b.dataset.restore) await setArchived(item, false);
            else if (!(await deleteForever(item))) {
              b.disabled = false;
              return;
            }
            await list();
          } catch (err) {
            b.disabled = false;
            toast(err.message);
          }
        };
      }

      async function list() {
        main.onclick = null;
        const { data, error } = await (await db())
          .from("items")
          .select("id, nickname, brand, model, kind, category, icon, tint, pinned, archived_at, manuals(page_count), manual_facts(status), tasks(active, title, next_due_on)")
          .order("created_at");
        if (error) throw new Error(error.message);
        if (params.get("manage")) return drawManage(data);
        drawList(data.filter((i) => !i.archived_at), data.filter((i) => i.archived_at).length);
      }

      function drawList(items, archived = 0) {
        const kinds = Object.keys(GROUPS).filter((k) => items.some((i) => i.kind === k));
        if (filter !== "all" && !kinds.includes(filter)) filter = "all";
        const shown = items.filter((i) => filter === "all" || i.kind === filter);
        const pinned = items.filter((i) => i.pinned);
        const pinButton = (i) =>
          `<button type="button" class="pin" data-pin="${i.id}" aria-pressed="${i.pinned}" aria-label="${i.pinned ? "Unpin" : "Pin"} ${esc(i.nickname)}" title="${i.pinned ? "Unpin" : "Pin to the top"}">${PIN}</button>`;
        main.innerHTML = `
          <div class="section-head" style="margin:0;align-items:flex-end">
            <div class="stack" style="gap:4px"><div class="row" style="align-items:center;justify-content:space-between;flex-wrap:nowrap"><h1>Your things</h1><a class="button quiet small" href="/things?manage=1" title="Manage things: archive, restore or delete">${ic("settings")}Manage${archived ? ` (${archived})` : ""}</a></div><p class="muted" style="margin:0">Tap a thing for its tasks and manual. Pin the ones you check most.</p></div>
            ${kinds.length > 1 ? `<div class="filters" role="group" aria-label="Show">${["all", ...kinds].map((k) => `<button type="button" data-filter="${k}" aria-pressed="${filter === k}">${k === "all" ? "All" : GROUPS[k]}</button>`).join("")}</div>` : ""}
          </div>
          ${
            pinned.length
              ? `<section aria-labelledby="pinned-h" class="stack">
                  <h2 id="pinned-h" style="margin:0">Pinned</h2>
                  <div class="pinned-grid">${pinned
                    .map((i) => {
                      const next = nextTask(i);
                      const late = next && next.next_due_on < today();
                      return `<div class="card pinned-card">
                        ${itemIcon(i, 64)}
                        <div>
                          <a href="/things?id=${i.id}" style="color:inherit;text-decoration:none;font-weight:700;font-size:18px">${esc(i.nickname)}</a>
                          <span class="small muted">${esc([i.brand, i.model].filter(Boolean).join(" ")) || "No model saved"}</span>
                          <span class="small" style="font-weight:700;margin-top:6px;color:${late ? "var(--coral)" : "var(--accent)"}">${next ? `${esc(next.title)}: ${esc(relDay(next.next_due_on))}` : esc(summary(i).text)}</span>
                        </div>
                        ${pinButton(i)}
                      </div>`;
                    })
                    .join("")}</div>
                </section>`
              : ""
          }
          <section aria-labelledby="all-h" class="stack">
            ${pinned.length ? '<h2 id="all-h" style="margin:0">Everything</h2>' : '<h2 id="all-h" class="sr-only">Everything</h2>'}
            <div class="tile-grid">${shown
              .map((i) => {
                const sum = summary(i);
                return `<div class="card tile">
                  ${sum.late ? '<span class="late-tag">Late</span>' : ""}
                  ${pinButton(i)}
                  ${itemIcon(i, 64)}
                  <a class="tile-name" href="/things?id=${i.id}">${esc(i.nickname)}</a>
                  <span class="small muted">${esc(sum.text)}</span>
                </div>`;
              })
              .join("")}
              <a class="add-tile" href="/things?add=1"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a thing</a>
            </div>
          </section>`;
        for (const b of main.querySelectorAll("[data-filter]")) {
          b.addEventListener("click", () => {
            filter = b.dataset.filter;
            drawList(items, archived);
          });
        }
        for (const b of main.querySelectorAll("[data-pin]")) {
          b.addEventListener("click", async () => {
            const item = items.find((i) => i.id === b.dataset.pin);
            b.disabled = true;
            const { error } = await (await db()).from("items").update({ pinned: !item.pinned }).eq("id", item.id);
            if (error) {
              b.disabled = false;
              return toast(error.message);
            }
            item.pinned = !item.pinned;
            drawList(items);
          });
        }
      }

      // --- Back history ----------------------------------------------------------
      // A thing that isn't new (used for years, or out of storage) shouldn't
      // start its schedule as if it was serviced today. What the owner says
      // about it goes to Muse, which plans the catch-up (the catch_up tool).
      const CONDITIONS = [["used", "Used for a while"], ["stored", "Coming out of storage"], ["new", "Brand new"]];
      const IDLE = [["0", "It's in use now"], ["3", "A few months ago"], ["12", "About a year ago"], ["24", "Two years ago or more"], ["", "Not sure"]];
      const GOALS = [["keep_running", "Just keep it running"], ["like_new", "Get it back to like new"], ["bare_minimum", "The bare minimum"]];
      // Kept for this visit too, so the page can plan from it before the database has the history columns.
      const HISTORY_KEY = (id) => `manuals-history-${id}`;
      // Set by the add wizard: the thing's page picks the manual for it and shows a Ready card once it's read.
      const FRESH_KEY = (id) => `manuals-fresh-${id}`;
      const PLAN_KEY = (id) => `manuals-plan-${id}`;
      const PLANNED_KEY = (id) => `manuals-planned-${id}`;
      const stash = (key, value) => {
        try {
          sessionStorage.setItem(key, value);
        } catch {}
      };
      const unstash = (key) => {
        try {
          return JSON.parse(sessionStorage.getItem(key) || "null");
        } catch {
          return null;
        }
      };

      function historyFields(h = {}, withCondition = true) {
        const opt = (list, value) => list.map(([v, t]) => `<option value="${v}" ${String(value ?? "") === v ? "selected" : ""}>${t}</option>`).join("");
        return `${withCondition ? `<label class="small" for="h-condition"><strong>Is it new?</strong></label><select id="h-condition">${opt(CONDITIONS, h.condition)}</select>` : ""}
          <label class="small" for="h-age"><strong>About how old is it?</strong> <span class="muted">(years, optional)</span></label>
          <input id="h-age" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="${h.age_years ?? ""}">
          <label class="small" for="h-idle"><strong>When was it last used?</strong></label>
          <select id="h-idle">${opt(IDLE, h.idle_months)}</select>
          <label class="small" for="h-done"><strong>What has been done to it?</strong> <span class="muted">In your own words</span></label>
          <textarea id="h-done" rows="3" maxlength="1000" placeholder="In storage two years, never touched. Or: I clean the lint trap but nothing else. Or: no idea.">${esc(h.done ?? "")}</textarea>
          <label class="small" for="h-goal"><strong>Going forward</strong></label>
          <select id="h-goal">${opt(GOALS, h.goal ?? "keep_running")}</select>`;
      }

      /** The history form's answers, in the catch_up tool's terms; blanks are left out. */
      function readHistory(condition) {
        const h = { condition: condition ?? $("#h-condition").value, goal: $("#h-goal").value };
        if ($("#h-age").value !== "") h.age_years = Number($("#h-age").value);
        if ($("#h-idle").value !== "") h.idle_months = Number($("#h-idle").value);
        const done = $("#h-done").value.trim();
        if (done) h.done = done;
        return h;
      }

      // --- One thing -----------------------------------------------------------

      // Someone with the same thing gets a copy of its schedule, facts and pages.
      async function shareCard(item) {
        const supa = await db();
        const body = $("#share-body");
        const { data: share, error } = await supa.from("item_shares").select("code, copies").eq("item_id", item.id).maybeSingle();
        if (error) {
          body.innerHTML = `<p class="small">${esc(error.message)}</p>`;
          return;
        }
        const url = share && `${location.origin}/join?thing=${share.code}`;
        body.innerHTML = share
          ? `<p class="muted small" style="margin:0">Anyone with this link can add a copy of the ${esc(item.nickname.toLowerCase())}'s schedule, facts and your fixes to their own home. Your serial number, notes and history stay here.${share.copies ? ` Copied ${share.copies} ${share.copies === 1 ? "time" : "times"} so far.` : ""}</p>
             <div class="field"><label class="sr-only" for="share-url">Share link</label><input id="share-url" readonly value="${esc(url)}"><button type="button" id="share-send">Share</button></div>
             <button type="button" class="link" id="share-stop">Stop sharing</button>`
          : `<p class="muted small" style="margin:0">Know someone with the same ${esc(item.nickname.toLowerCase())}? Make a link and they can add its schedule, facts and your fixes to their own home, without Muse reading it again.</p>
             <div class="row"><button type="button" id="share-make">Make a share link</button></div>`;
        $("#share-make")?.addEventListener("click", async () => {
          const { error: e } = await supa.from("item_shares").insert({ item_id: item.id });
          if (e) return toast(e.message);
          shareCard(item);
        });
        $("#share-send")?.addEventListener("click", () => shareLink(url, `${item.nickname} manual`));
        $("#share-stop")?.addEventListener("click", async () => {
          const { error: e } = await supa.from("item_shares").delete().eq("item_id", item.id);
          if (e) return toast(e.message);
          toast("The link no longer works.");
          shareCard(item);
        });
      }

      // The open thing's page redraws when a read in the background finishes.
      let onJobDone = null;
      window.addEventListener("manuals:job-done", (e) => onJobDone?.(e.detail));

      // Manual atlas: the manual's pages by kind, as jump links ("Repairs p. 31, 32").
      const PAGE_KINDS = [
        ["safety", "Safety"],
        ["setup", "Setup"],
        ["use", "Use"],
        ["care", "Care"],
        ["fix", "Repairs"],
        ["parts", "Parts"],
        ["warranty", "Warranty"],
      ];
      /** The manual's PDF link and its pages by kind, for Open and Jump to. */
      async function manualPages(supa, manual) {
        const none = { pdf: null, groups: [] };
        if (!manual) return none;
        // Page numbers only help when they open the PDF there; without one, show nothing.
        let pdf = manual.source_url && !isExample(manual.source_url) ? manual.source_url : null;
        if (!pdf && manual.storage_path) {
          const { data } = await supa.storage.from("manuals").createSignedUrl(manual.storage_path, 3600);
          pdf = data?.signedUrl ?? null;
        }
        if (!pdf) return none;
        // Read on its own, so the page still works before pages have kinds.
        const { data: rows, error } = await supa
          .from("manual_pages")
          .select("page_number, kind")
          .eq("manual_id", manual.id)
          .not("kind", "is", null)
          .order("page_number")
          .limit(1000);
        if (error || !rows?.length) return { pdf, groups: [] };
        const groups = PAGE_KINDS.map(([kind, label]) => ({ kind, label, pages: rows.filter((r) => r.kind === kind).map((r) => r.page_number) })).filter((g) => g.pages.length);
        return { pdf, groups };
      }

      /** The PDF opened at a page. */
      const pdfAt = (pdf, n) => `${pdf.split("#")[0]}#page=${n}`;

      /** "Jump to a page": each kind of page with its first page as the big target. */
      function jumpSheet(manual, pages) {
        if (!pages.groups.length) return "";
        const at = (n) => esc(pdfAt(pages.pdf, n));
        const rows = pages.groups
          .map((g) => {
            const [first, ...rest] = g.pages;
            const also = rest.length
              ? `Also ${rest.slice(0, 4).map((n) => `<a href="${at(n)}" target="_blank" rel="noopener noreferrer">p. ${n}</a>`).join(", ")}${rest.length > 4 ? ` and ${rest.length - 4} more` : ""}`
              : "";
            return `<div class="jump-row"><span class="ref-text"><strong>${esc(g.label)}</strong>${also ? `<span class="small muted">${also}</span>` : ""}</span>
              <a class="page-chip k-${g.kind}" href="${at(first)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(g.label)}, page ${first}">p. ${first}</a></div>`;
          })
          .join("");
        return `<dialog class="sheet" id="jump-sheet" aria-labelledby="jump-h">
            <div class="sheet-grip" aria-hidden="true"></div>
            <h2 id="jump-h" style="margin:0">Jump to a page</h2>
            <p class="small muted" style="margin:0 0 6px">${esc(manual.title || "The manual")}${manual.page_count ? ` · ${manual.page_count} pages` : ""}</p>
            ${rows}
            <a class="button quiet" href="${esc(pages.pdf)}" target="_blank" rel="noopener noreferrer" style="margin-top:8px">${ic("menu_book")}Open the whole PDF</a>
            <button type="button" class="link" data-close-sheet>Close</button>
          </dialog>`;
      }

      async function detail(id) {
        onJobDone = (job) => {
          if (job.item !== id) return;
          if (job.kind === "read") return detail(id);
          // A search that carried on while the page was paused: show what it found,
          // or say it didn't finish (never start another one by itself).
          if (!$("[data-still-searching]")) return;
          recentSearch(id).then((out) => {
            const still = $("[data-still-searching]");
            if (out) detail(id);
            else if (still) still.textContent = "The search didn't finish. Tap Search again.";
          });
        };
        const supa = await db();
        const { data: item, error } = await supa
          .from("items")
          .select(
            "id, nickname, brand, model, serial, category, kind, icon, tint, pinned, archived_at, uses_per_week, purchased_on, manuals(id, title, page_count, source_url, storage_path, status, status_detail, reading_since), manual_facts(id, kind, label, value, source_page, source, status), tasks(id, title, details, interval_unit, interval_value, next_due_on, last_done_on, source_page, source, status, active), seat_modes(id, mode, min_weight_kg, max_weight_kg, min_height_cm, max_height_cm, min_age_months, fit_note, source_page, source, status), item_readings(kind, value, measured_on)",
          )
          .eq("id", id)
          .maybeSingle();
        if (error) throw new Error(error.message);
        if (!item) {
          main.innerHTML = '<p class="card">That thing isn\'t in your household.</p>';
          return;
        }
        // "Doesn't apply to mine" lines stay in the history but not on the page.
        item.manual_facts = item.manual_facts.filter((f) => f.status !== "not_applicable");
        item.seat_modes = item.seat_modes.filter((m) => m.status !== "not_applicable");
        const ids = [
          ...item.manual_facts.map((f) => f.id),
          ...item.tasks.map((t) => t.id),
          ...item.seat_modes.map((s) => s.id),
        ];
        const { data: history } = ids.length
          ? await supa
              .from("revisions")
              .select("target_id, before, after, source, reason, created_at")
              .in("target_id", ids)
              .order("created_at", { ascending: false })
          : { data: [] };
        // Back history and catch-up steps. Read on their own, so the page still
        // works where the database doesn't have these columns yet.
        const [{ data: saved }, { data: marked }] = await Promise.all([
          supa.from("items").select("condition, age_years, idle_months, history_note, upkeep_goal, caught_up_at, catch_up_summary").eq("id", id).maybeSingle(),
          supa.from("tasks").select("id").eq("item_id", id).eq("catch_up", true),
        ]);
        const lastPlan = unstash(PLAN_KEY(id));
        const past = saved?.condition
          ? { condition: saved.condition, age_years: saved.age_years ?? undefined, idle_months: saved.idle_months ?? undefined, done: saved.history_note ?? undefined, goal: saved.upkeep_goal ?? undefined }
          : unstash(HISTORY_KEY(id));
        const stepIds = new Set([...(marked ?? []).map((t) => t.id), ...(lastPlan?.ids ?? [])]);
        const steps = item.tasks.filter((t) => stepIds.has(t.id) && t.active).sort((a, b) => (a.next_due_on ?? "").localeCompare(b.next_due_on ?? ""));
        const planSummary = saved?.catch_up_summary || lastPlan?.summary || "";

        // Read on its own, so the page still works before receipts are set up.
        const { data: receipts, error: receiptsError } = await supa
          .from("receipts")
          .select(RECEIPT_COLUMNS)
          .eq("item_id", id)
          .order("created_at", { ascending: false })
          .limit(1);
        const receipt = receipts?.[0] ?? null;

        const manual = item.manuals?.[0];
        const pages = await manualPages(supa, manual);

            <div class="row" style="gap:16px;align-items:center;flex-wrap:nowrap">
              <div class="icon-wrap">${itemIcon(item, 72)}<button type="button" class="corner-btn" id="look-btn" aria-label="Change name, photo, icon or color" title="Change name, photo, icon or color" aria-controls="look">${ic("palette")}</button></div>
              <div style="flex:1 1 auto;min-width:0">
                <h1 style="margin:0;cursor:pointer" id="name-h" title="Rename">${esc(item.nickname)}</h1>
                <p class="muted" style="margin:0">${esc([item.brand, item.model].filter(Boolean).join(" · "))}</p>
              </div>
              <button type="button" class="pin" id="pin" aria-pressed="${!!item.pinned}" aria-label="${item.pinned ? "Unpin" : "Pin"} ${esc(item.nickname)}" title="${item.pinned ? "Unpin" : "Pin to the top"}">${PIN}</button>
            </div>
            <div class="ask-row">
              <button type="button" id="ask" class="ask-big">${ic("forum")}Ask about the ${esc(item.nickname.toLowerCase())}</button>
              <button type="button" class="more-btn" id="more-btn" aria-haspopup="dialog" aria-controls="more-sheet" aria-label="More: catch it up, the manual, share, archive" title="More">${ic("more_horiz")}</button>
            </div>
            <details class="card panel" id="look">
              <summary style="font-weight:700;cursor:pointer">Change name, photo, icon or color</summary>
              <div class="stack" style="margin-top:14px">
                <form class="stack" style="gap:8px" id="name-form">
                  <label class="small" style="font-weight:700" for="name-input">Name</label>
                  <div class="row"><input id="name-input" value="${esc(item.nickname)}" maxlength="80" required autocomplete="off" style="flex:1;min-width:12ch"><button type="submit">Save</button></div>
                </form>
                ${
                  photoMap
                    ? `<div class="stack" style="gap:8px">
                  <span class="small" style="font-weight:700">Photo</span>
                  <div class="row">
                    <label class="button outline" for="look-camera" style="cursor:pointer">${ic("photo_camera")}Take a photo</label>
                    <label class="button outline" for="look-upload" style="cursor:pointer">Upload a photo</label>
                    ${hasPhoto ? '<button type="button" class="quiet" id="photo-clear">Back to the icon</button>' : ""}
                  </div>
                  <input id="look-camera" type="file" accept="image/*" capture="environment" class="sr-only">
                  <input id="look-upload" type="file" accept="image/*" class="sr-only">
                  <p class="small muted" id="photo-msg" role="status" style="margin:0">A photo shows in place of the icon and color.</p>
                </div>`
                    : ""
                }
                <div class="stack" style="gap:8px">
                  <span class="small" style="font-weight:700">Icon</span>
                  <div class="choices" role="group" aria-label="Icon">${Object.keys(ICONS)
                    .map((k) => `<button type="button" data-icon="${k}" aria-pressed="${iconKey(item) === k}" aria-label="${ICONS[k][0]}" title="${ICONS[k][0]}">${iconSvg(k, 26)}</button>`)
                    .join("")}</div>
                </div>
                <div class="stack" style="gap:8px">
                  <span class="small" style="font-weight:700">Color</span>
                  <div class="choices" role="group" aria-label="Color">${Object.keys(TINTS)
                    .map((k) => `<button type="button" class="swatch ${k}" data-tint="${k}" aria-pressed="${tintKey(item) === k}" aria-label="${TINTS[k]}" title="${TINTS[k]}"></button>`)
                    .join("")}</div>
                </div>
              </div>
            </details>
            <details class="card panel" id="share">
              <summary style="font-weight:700;cursor:pointer">Share this manual</summary>
              <div class="stack" id="share-body" style="margin-top:14px"><p class="muted small">One moment…</p></div>
            </details>
            ${
              item.archived_at
                ? ""
                : `<details class="card panel" id="catchup">
                    <summary style="font-weight:700;cursor:pointer">Catch up a thing that isn't new</summary>
                    <form class="stack" id="catchup-form" style="margin-top:14px">
                      <p class="muted small" style="margin:0">Been in use for years, or sat in storage? Tell Muse what has been done and it plans the catch-up: steps to do first (with the manual's page where it says so), tasks you already do dated from when you last did them, and the rest due over the next few weeks, a couple at a time.</p>
                      ${historyFields(past ?? { condition: "used" })}
                      <div class="row"><button type="submit">Make a catch-up plan</button></div>
                    </form>
                  </details>`
            }
          </section>

          <div id="catchup-live" aria-live="polite"></div>
          ${manual ? "" : `<section class="card" id="manual-section">
                  ${inWizard ? `<div class="row" style="justify-content:space-between;align-items:center"><h2 id="manual-h" style="margin:0">Finding its manual</h2>${stepDots(3)}</div>` : '<h2 id="manual-h">Add its manual</h2>'}
                  <p class="muted" id="manual-lede"${inWizard ? " hidden" : ""}>${item.brand || item.model ? "Looking for it online first. Pick the right PDF and Muse reads it into tasks and facts, each with its page." : "Add the brand and model in the details above and Muse can look for it online, or upload the PDF yourself."}</p>
                  ${manualForm(!!(item.brand || item.model))}
                </section>`}
          ${doNowCard(item.tasks, stepIds, planSummary, { source, badge })}
          ${
            unsure
              ? `<section class="card do-clear" aria-label="Lines Muse wasn't sure about"><span class="ref-icon gold" aria-hidden="true">${ic("fact_check")}</span>
                  <span class="ref-text"><strong>Muse wasn't sure about ${unsure === 1 ? "one line" : `${unsure} lines`}</strong><span class="small muted">A second read checks them against their pages and asks before saving.</span></span>
                  <button type="button" class="quiet small" id="check-flagged">Check them</button></section>`
              : ""
          }

          ${
            item.tasks.length
              ? `<section aria-labelledby="sched-h" id="upkeep">
                  <div class="section-head"><h2 id="sched-h">Upkeep</h2><span class="small muted">${item.tasks.filter((t) => t.active).length} tasks${cycles ? ` · ${Number(cycles.value)} uses so far${item.uses_per_week ? `, about ${Number(item.uses_per_week)} a week` : ""}` : ""}</span></div>
                  <div id="upkeep-body"></div>
                </section>`
              : ""
          }

          ${
            item.seat_modes.length
              ? `<section aria-labelledby="seat-h"><div class="section-head"><h2 id="seat-h">Car seat limits</h2></div>
                  <div class="card">${item.seat_modes
                    .map(
                      (s) => `<div class="fact"><div><strong>${esc(s.mode.replace(/_/g, "-"))}</strong>
                        <div>${[s.max_weight_kg && `${s.min_weight_kg ?? 0} to ${s.max_weight_kg} kg`, s.max_height_cm && `${s.min_height_cm ?? 0} to ${s.max_height_cm} cm`, s.min_age_months && `at least ${s.min_age_months} months`].filter(Boolean).map(esc).join(" · ")}</div>
                        ${s.fit_note ? `<div class="muted">${esc(s.fit_note)}</div>` : ""}
                        <div class="row" style="margin-top:4px">${source(s)}${badge(s)}</div></div>
                        <div class="fact-actions"><button type="button" class="quiet small" data-fix="seat_limit:${s.id}">Fix</button></div></div>`,
                    )
                    .join("")}
                    <p class="small muted">A certified child passenger safety technician can check the fit in person.</p>
                  </div></section>`
              : ""
          }

          ${item.manual_facts.length || item.tasks.length ? '<div id="facts" class="stack"></div>' : ""}

          <section class="card ref-card" aria-label="Warranty and manual">
            ${warrantySection(item, receipt, !receiptsError)}
            ${manual ? manualRow(manual, pages) : ""}
          </section>
          <input id="receipt-photo" type="file" accept="image/*" capture="environment" class="sr-only">
          <input id="receipt-gallery" type="file" accept="image/*" class="sr-only">

          ${
            history?.length
              ? `<details class="card flat history-fold"><summary><strong>History</strong><span class="small muted">${history.length} change${history.length === 1 ? "" : "s"}</span></summary>${history
                  .map(
                    (h) => `<div class="fact"><div>${esc(h.after.label || h.after.title || h.after.mode)}: <s class="muted">${esc(h.before.value ?? h.before.details ?? h.before.fit_note ?? "")}</s> → <strong>${esc(h.after.value ?? h.after.details ?? h.after.fit_note ?? "")}</strong><div class="small muted">“${esc(h.reason)}”</div></div><span class="small muted">${ago(h.created_at)} · ${h.source === "user" ? "You" : "Assistant"}</span></div>`,
                  )
                  .join("")}</details>`
              : ""
          }
          ${moreSheet(item, manual, pages, past)}
          ${manual ? jumpSheet(manual, pages) : ""}`;

        // One way in: the thing's own chat, with a few starters when it's empty. Setting it up
        // (Muse asks with small forms) and the cycle count both go through here.
        const nick = item.nickname;
        const counted = item.tasks.some((t) => t.active && t.interval_unit === "cycles");
        const starters = [
          ...(manual && !(item.purchased_on && item.uses_per_week)
            ? [{ label: "Set it up with me", text: `Set up the ${nick} with me: ask what you need to know.` }]
            : []),
          ...(counted
            ? [{ label: cycles ? `Log the count (last ${Number(cycles.value)})` : "Log the cycle count", text: `The ${nick}'s cycle counter shows `, draft: true }]
            : []),
          { label: "What's due soon?", text: `What's coming up for the ${nick}?` },
          { label: "Something's wrong", text: `Something's wrong with the ${nick}: `, draft: true },
        ];
        const ask = () => openChat(undefined, () => detail(id), { about: id, starters });
        $("#ask").addEventListener("click", ask);
        $("#check-flagged")?.addEventListener("click", () =>
          openChat(`Double-check the lines you weren't sure about for the ${nick} against their pages.`, () => detail(id), { about: id, starters }),
        );
        const saveLook = async (change) => {
          const { error } = await supa.from("items").update(change).eq("id", id);
          if (error) return toast(error.message);
          await detail(id);
          if ("icon" in change || "tint" in change) $("#look").open = true;
        };
        $("#pin").addEventListener("click", () => saveLook({ pinned: !item.pinned }));
        const act = (selector, run) =>
          $(selector)?.addEventListener("click", async (e) => {
            const button = e.currentTarget;
            button.disabled = true;
            try {
              await run(button);
            } catch (err) {
              button.disabled = false;
              toast(err.message);
            }
          });
        act("#archive-item", async () => {
          await setArchived(item, true);
          location.assign("/things");
        });
        act("#restore-item", async () => {
          await setArchived(item, false);
          detail(id);
        });
        act("#delete-item", async (button) => {
          if (await deleteForever(item)) location.assign("/things?manage=1");
          else button.disabled = false;
        });
        // Tapping the name opens the panel with the name ready to change.
        $("#name-h").addEventListener("click", () => {
          $("#look").open = true;
          $("#name-input").focus();
          $("#name-input").select();
        });
        $("#name-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const nickname = $("#name-input").value.trim();
          if (!nickname || nickname === item.nickname) return;
          await saveLook({ nickname });
          toast(`Renamed to ${nickname}.`);
        });
        for (const [button, panel] of [["#look-btn", "#look"], ["#share-btn", "#share"]]) {
          $(button).addEventListener("click", () => {
            const d = $(panel);
            d.open = !d.open;
            if (d.open) d.scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
        }
        $("#share").addEventListener("toggle", (e) => {
          if (e.target.open) shareCard(item);
        });
        for (const b of main.querySelectorAll("[data-icon]")) {
          b.addEventListener("click", () => saveLook({ icon: b.dataset.icon }));
        }
        for (const b of main.querySelectorAll("[data-tint]")) {
          b.addEventListener("click", () => saveLook({ tint: b.dataset.tint }));
        }
        // A real photo of the thing in place of its icon, or back to the icon.
        const savePhoto = async (file, done) => {
          const busy = [...main.querySelectorAll("#look-camera, #look-upload, #photo-clear")];
          for (const b of busy) b.disabled = true;
          $("#photo-msg").textContent = file ? "Saving the photo…" : "Removing the photo…";
          try {
            await setItemPhoto(item, file);
            await detail(id);
            $("#look").open = true;
            toast(done);
          } catch (err) {
            for (const b of busy) b.disabled = false;
            $("#photo-msg").textContent = err.message;
          }
        };
        for (const input of ["#look-camera", "#look-upload"]) {
          $(input)?.addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            e.target.value = "";
            if (file) savePhoto(file, "Photo saved.");
          });
        }
        $("#photo-clear")?.addEventListener("click", () => savePhoto(null, "Back to the icon."));
        wireManualForm(item, () => detail(id));
        if (ready) {
          // Shown once: closing it, or any of its buttons, ends the wizard.
          const done = () => {
            try {
              sessionStorage.removeItem(FRESH_KEY(item.id));
            } catch {}
            $("#ready-card")?.remove();
          };
          $("#ready-close").addEventListener("click", done);
          $("#ready-receipt").addEventListener("click", () => {
            done();
            $("#receipt-photo")?.click();
          });
          $("#ready-tune").addEventListener("click", () => {
            done();
            openChat(`Set up the ${item.nickname} with me: ask what you need to know.`, () => detail(id), { once: true, about: id, starters });
          });
        }
        wireWarranty(item, receipt, !receiptsError, () => detail(id));
        // The more menu and Jump to open as sheets from the bottom; a tap outside or on an item closes them.
        $("#more-btn").addEventListener("click", () => $("#more-sheet").showModal());
        $("#jump-btn")?.addEventListener("click", () => $("#jump-sheet").showModal());
        for (const sheet of main.querySelectorAll("dialog.sheet")) {
          sheet.addEventListener("click", (e) => {
            const r = sheet.getBoundingClientRect();
            const outside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
            if (e.target.closest("[data-reread]")) toast("Reading it again. About a minute; you'll get a heads-up.");
            if (outside || e.target.closest("[data-close-sheet], .sheet-item, a")) setTimeout(() => sheet.close(), 0);
          });
        }
        $("[data-open-look]")?.addEventListener("click", () => {
          $("#look").open = true;
          $("#look").scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
        $("[data-copy-serial]")?.addEventListener("click", () => {
          navigator.clipboard
            .writeText(item.serial)
            .then(() => toast("Serial copied."))
            .catch(() => toast("Couldn't copy here."));
        });
        const markDone = async (taskId) => {
          const { error: e } = await supa.rpc("log_task_done", { p_task: taskId });
          if (e) return toast(e.message);
          toast("Done. The next one is scheduled.");
          detail(id);
        };
        for (const b of main.querySelectorAll("[data-reread]")) {
          b.addEventListener("click", async () => {
            b.disabled = true;
            b.textContent = "Reading, up to a minute…";
            try {
              const out = await readManual(b.dataset.reread, (text) => {
                b.textContent = text;
              }, true, item);
              if (out?.background) return;
            } catch (err) {
              toast(err.message);
            }
            detail(id);
          });
        }
        const fixIt = (fix) => {
          const [type, target] = fix.split(":");
          const field = { fact: "value", task: "details", seat_limit: "fit_note" }[type];
          const value = prompt("What should it say? Your version wins, and the old one is kept.");
          if (!value?.trim()) return;
          tool("revise_fact", { id: target, type, source: "user", changes: { [field]: value.trim() }, reason: "Set by you." })
            .then(() => {
              toast("Saved.");
              detail(id);
            })
            .catch((err) => toast(err.message));
        };
        // Car seat limits are drawn with the page; upkeep and facts are redrawn on taps, so they delegate.
        for (const b of main.querySelectorAll("[data-fix]")) {
          if (!b.closest("#upkeep, #facts")) b.addEventListener("click", () => fixIt(b.dataset.fix));
        }
        const remember = (key, value) => {
          try {
            sessionStorage.setItem(key, value ?? "");
          } catch {}
        };
        const recall = (key) => {
          try {
            return sessionStorage.getItem(key) || null;
          } catch {
            return null;
          }
        };

        const upkeep = $("#upkeep");
        let groups = guessGroups(item.tasks);
        // Safety tasks sit with the safety warnings, so the facts redraw when Jev's groups come back.
        let drawFacts = () => {};
        const drawUpkeep = () => {
          $("#upkeep-body").innerHTML = upkeepBody(item.tasks, groups, recall(`manuals-upkeep-${id}`), { source, badge });
        };
        upkeep?.addEventListener("click", (e) => {
          const done = e.target.closest("[data-done]");
          const fix = e.target.closest("[data-fix]");
          const tile = e.target.closest("[data-group]");
          if (done) markDone(done.dataset.done);
          else if (fix) fixIt(fix.dataset.fix);
          else if (tile) {
            remember(`manuals-upkeep-${id}`, tile.getAttribute("aria-pressed") === "true" ? null : tile.dataset.group);
            drawUpkeep();
          }
        });
        if (upkeep) {
          drawUpkeep();
          // Jev's grouping replaces the keyword guess when it's back; remembered for this visit.
          const key = `manuals-groups-${id}-${item.tasks.length}`;
          let cached = null;
          try {
            cached = JSON.parse(recall(key) || "null");
          } catch {}
          (cached ? Promise.resolve(cached) : api("/api/upkeep-groups", { item_id: id }).then((r) => r.groups))
            .then((jev) => {
              remember(key, JSON.stringify(jev));
              groups = { ...groups, ...jev };
              if (document.body.contains(upkeep)) {
                drawUpkeep();
                drawFacts();
              }
            })
            .catch(() => {});
        }

        // --- Catch-up plan: from the button, or on its own once the manual is read ---
        $("#catchup-btn")?.addEventListener("click", () => {
          const d = $("#catchup");
          d.open = !d.open;
          if (d.open) d.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
        $("#do-now")?.addEventListener("click", (e) => {
          const done = e.target.closest("[data-done]");
          if (done) markDone(done.dataset.done);
        });
        const live = $("#catchup-live");
        const say = (text, bad = false) => {
          live.innerHTML = `<section class="card flat"><p class="small" style="margin:0${bad ? ";color:var(--coral)" : ""}">${esc(text)}</p></section>`;
        };
        const planCatchUp = async (h) => {
          remember(PLANNED_KEY(id), "1");
          stash(HISTORY_KEY(id), JSON.stringify(h));
          say(`Muse is reading the ${item.nickname.toLowerCase()}'s storage and startup pages and planning the catch-up. About half a minute.`);
          try {
            const out = await tool("catch_up", { item: id, ...h });
            const plan = out.data?.plan;
            if (plan) stash(PLAN_KEY(id), JSON.stringify({ summary: plan.summary, ids: plan.steps.map((s) => s.id) }));
            toast(out.summary.split(": ")[0].split(". ")[0]);
            detail(id);
          } catch (err) {
            say(err.message, true);
          }
        };
        $("#catchup-form")?.addEventListener("submit", (e) => {
          e.preventDefault();
          $("#catchup").open = false;
          planCatchUp(readHistory());
        });
        // Told the wizard it isn't new: plan once the manual is read, without asking again.
        if (past && past.condition !== "new" && !saved?.caught_up_at && !recall(PLANNED_KEY(id)) && manual?.status === "distilled" && !item.archived_at) {
          planCatchUp(past);
        }

        const facts = $("#facts");
        let openCode = null;
        let glanceOpen = false;
        drawFacts = () => {
          if (!facts) return;
          const checks = item.tasks.filter((t) => t.active && groups[t.id] === "safety");
          facts.innerHTML = factsBody(item.manual_facts, openCode, { source, badge }, { checks, glanceOpen });
        };
        facts?.addEventListener("click", (e) => {
          const fix = e.target.closest("[data-fix]");
          const code = e.target.closest("[data-code]");
          const done = e.target.closest("[data-done]");
          const copyOne = e.target.closest("[data-copy-fact]");
          if (done) markDone(done.dataset.done);
          else if (e.target.closest("[data-glance-all]")) {
            glanceOpen = !glanceOpen;
            drawFacts();
          } else if (copyOne) {
            const f = item.manual_facts.find((x) => x.id === copyOne.dataset.copyFact);
            if (f)
              navigator.clipboard
                .writeText(`${f.label}: ${f.value}`)
                .then(() => toast("Copied."))
                .catch(() => toast("Couldn't copy here; select the text instead."));
          } else if (fix) fixIt(fix.dataset.fix);
          else if (e.target.closest("[data-ask-facts]")) openChat(undefined, () => detail(id));
          else if (e.target.closest("[data-copy-specs]")) {
            // Plain "Label: value" lines, ready to paste into a parts order or a support chat.
            const text = [
              [item.nickname, item.brand, item.model].filter(Boolean).join(" "),
              ...item.manual_facts.filter((f) => f.kind === "spec").map((f) => `${f.label}: ${f.value}`),
            ].join("\n");
            navigator.clipboard
              .writeText(text)
              .then(() => toast("Specs copied."))
              .catch(() => toast("Couldn't copy here; select the text instead."));
          }
          else if (code) {
            openCode = openCode === code.dataset.code ? null : code.dataset.code;
            drawFacts();
          }
        });
        drawFacts();
      }

      // --- Do now --------------------------------------------------------------
      // What to do now, in one list: catch-up steps, late tasks and anything due
      // this week, each with a check. Nothing due is one line with what's next.
      function doNowCard(tasks, stepIds, planSummary, { source, badge }) {
        const active = tasks.filter((t) => t.active);
        if (!active.length) return "";
        const byDate = (a, b) => (a.next_due_on ?? "9999").localeCompare(b.next_due_on ?? "9999");
        const now = active.filter((t) => stepIds.has(t.id) || late(t) || (t.next_due_on && daysBetween(today(), t.next_due_on) <= 7)).sort(byDate);
        const next = active.filter((t) => t.next_due_on && !now.includes(t)).sort(byDate)[0];
        const nextLine = next ? `Next: ${esc(next.title)}, ${esc(relDay(next.next_due_on))}` : "";
        if (!now.length)
          return `<section class="card do-clear" id="do-now"><span class="do-ok" aria-hidden="true">${ic("check")}</span>
              <span class="ref-text"><strong>Nothing due</strong>${nextLine ? `<span class="small muted">${nextLine}</span>` : ""}</span></section>`;
        const steps = now.filter((t) => stepIds.has(t.id)).length;
        const lates = now.filter(late).length;
        const meta = [steps && `Catching up · ${steps} step${steps === 1 ? "" : "s"} left`, !steps && lates && `${lates} late`].filter(Boolean).join("");
        const row = (t) => {
          const when = t.next_due_on ? relDay(t.next_due_on) : "once";
          const sub = [stepIds.has(t.id) && "Catch-up step", when, t.source_page && `p. ${t.source_page}`].filter(Boolean).join(" · ");
          return `<div class="do-row${late(t) ? " late" : ""}">
              <details class="do-line"><summary><span class="do-title">${esc(t.title)}</span><span class="small ${late(t) ? "late" : "muted"}">${esc(sub)}</span></summary>
                <div class="stack line-body">${t.details ? `<div>${esc(t.details)}</div>` : ""}<div class="row">${source(t)}${badge(t)}<button type="button" class="quiet small" data-fix="task:${t.id}">${ic("edit")}Fix</button></div></div>
              </details>
              <button type="button" class="do-check" data-done="${t.id}" aria-label="Mark done: ${esc(t.title)}" title="Done">${ic("check")}</button>
            </div>`;
        };
        return `<section class="card do-card" id="do-now" aria-labelledby="do-h">
            <div class="section-head" style="margin:0"><h2 id="do-h" style="margin:0">Do now</h2>${meta ? `<span class="small muted">${esc(meta)}</span>` : ""}</div>
            ${steps && planSummary ? `<p class="small muted do-plan">${esc(planSummary)}</p>` : ""}
            ${now.map(row).join("")}
            ${nextLine ? `<p class="small muted" style="margin:0">${ic("schedule")} ${nextLine}</p>` : ""}
          </section>`;
      }

      /** The manual as one row: pages and how the read went, with Jump to. A failed read gets its button here. */
      function manualRow(manual, pages) {
        const st = manualStatus(manual);
        const sub = [manual.page_count && `${manual.page_count} pages`, st.detail].filter(Boolean).join(" · ");
        const action =
          st.reread === "primary"
            ? `<button type="button" class="small" data-reread="${esc(manual.id)}">Read it again</button>`
            : pages.groups.length
              ? `<button type="button" class="quiet small" id="jump-btn" aria-haspopup="dialog" aria-controls="jump-sheet">Jump to</button>`
              : pages.pdf
                ? `<a class="button quiet small" href="${esc(pages.pdf)}" target="_blank" rel="noopener noreferrer">Open</a>`
                : "";
        return `<div class="ref-row"><span class="ref-icon violet" aria-hidden="true">${ic("menu_book")}</span>
            <span class="ref-text"><strong>Manual</strong>${sub ? `<span class="small muted">${esc(sub)}</span>` : ""}</span>${action}</div>`;
      }

      /** Everything that isn't asking: the thing's ids, catch-up, the manual, sharing, its look and archiving. */
      function moreSheet(item, manual, pages, past) {
        const st = manual ? manualStatus(manual) : null;
        const id = [item.brand, item.model].filter(Boolean).join(" ");
        return `<dialog class="sheet" id="more-sheet" aria-label="More for the ${esc(item.nickname.toLowerCase())}">
            <div class="sheet-grip" aria-hidden="true"></div>
            ${
              id || item.serial
                ? `<div class="sheet-id">${id ? `<span class="small muted">${esc(id)}</span>` : ""}${item.serial ? `<span class="row" style="gap:8px">Serial <strong class="code">${esc(item.serial)}</strong><button type="button" class="quiet small" data-copy-serial>Copy</button></span>` : ""}</div>`
                : ""
            }
            ${item.archived_at ? "" : `<button type="button" class="sheet-item" id="catchup-btn" aria-controls="catchup">${ic("history")}${past && past.condition !== "new" ? "Catch it up again" : "Not new? Catch it up"}</button>`}
            ${pages.pdf ? `<a class="sheet-item" href="${esc(pages.pdf)}" target="_blank" rel="noopener noreferrer">${ic("menu_book")}<span>Open the manual</span><span class="small muted">PDF</span></a>` : ""}
            ${st?.reread === "quiet" ? `<button type="button" class="sheet-item" data-reread="${esc(manual.id)}">${ic("autorenew")}Read the manual again</button>` : ""}
            <button type="button" class="sheet-item" id="share-btn" aria-controls="share">${ic("share")}Share this manual</button>
            <button type="button" class="sheet-item" data-open-look>${ic("palette")}Name, photo, icon or color</button>
            ${item.archived_at ? "" : `<button type="button" class="sheet-item danger" id="archive-item">${ic("archive")}Sold it or got rid of it? Archive</button>`}
            <button type="button" class="link" data-close-sheet>Close</button>
          </dialog>`;
      }

      // --- Upkeep tiles -------------------------------------------------------
      // "What do you want to work on?": tasks sorted into a few groups, one
      // tile each; a tile opens its tasks as one line each, details on tap.
      /** A Material Symbols icon; decorative, the text next to it says what it does. */
      const ic = (name) => `<span class="msi" aria-hidden="true">${name}</span>`;
      const UPKEEP_ICONS = { due: "event", cleaning: "cleaning_services", parts: "build", checks: "fact_check", setup: "tune", safety: "health_and_safety", other: "more_horiz" };
      const UPKEEP = [
        ["due", "Due soon"],
        ["cleaning", "Cleaning", /clean|wash|wipe|descal|rinse|deodor|soak|scrub|dust|stain|odor/i],
        ["parts", "Filters & parts", /filter|replac|bulb|lamp|batter|seal|gasket|accessor|turntable|rack|\bparts?\b/i],
        ["checks", "Checks", /inspect|check|test|look for|examine|wear|damage|leak|loose|tighten/i],
        ["setup", "Setup & use", /install|set ?up|setting|program|mode|how to|adjust|level/i],
        ["safety", "Safety", /safety|warn|unplug|disconnect|power|child|expir|recall|discard|never|do not/i],
        ["other", "Other"],
      ];

      /** Instant keyword guess per task; Jev's answer replaces it when it arrives. */
      function guessGroups(tasks) {
        const out = {};
        for (const t of tasks) {
          const text = `${t.title} ${t.details ?? ""}`;
          out[t.id] = UPKEEP.find(([, , re]) => re?.test(text))?.[0] ?? "other";
        }
        return out;
      }

      const dueSoon = (t) => t.active && t.next_due_on && daysBetween(today(), t.next_due_on) <= 14;
      const late = (t) => t.active && t.next_due_on && t.next_due_on < today();

      function taskLine(t, { source, badge }) {
        const when = t.next_due_on
          ? `<span class="small ${late(t) ? "late" : "muted"}">${esc(relDay(t.next_due_on))}</span>`
          : `<span class="small muted">${esc(howOften(t.interval_unit, t.interval_value))}</span>`;
        return `<details class="line">
            <summary><span class="line-title">${esc(t.title)}</span>${when}</summary>
            <div class="stack line-body">
              ${t.details ? `<div>${esc(t.details)}</div>` : ""}
              <div class="row">${source(t)}${badge(t)}<span class="small muted">${esc(howOften(t.interval_unit, t.interval_value))}</span></div>
              <div class="row">${t.active ? `<button type="button" class="small" data-done="${t.id}">${ic("check")}Done</button>` : ""}<button type="button" class="quiet small" data-fix="task:${t.id}">${ic("edit")}Fix</button></div>
            </div>
          </details>`;
      }

      function upkeepBody(tasks, groups, open, { source, badge }) {
        const members = (key) =>
          key === "due"
            ? tasks.filter(dueSoon).sort((a, b) => a.next_due_on.localeCompare(b.next_due_on))
            : tasks.filter((t) => groups[t.id] === key);
        const shown = UPKEEP.filter(([key]) => key !== "due" && key !== "safety");
        const lines = shown
          .map(([key, label]) => {
            const list = members(key);
            if (list.length !== 1) return "";
            return `<button type="button" class="uk-line" data-group="${key}" aria-pressed="${open === key}"><strong>${esc(label)}</strong><span class="muted"> · ${esc(list[0].title)}</span></button>`;
          })
          .join("");
        const tiles = shown.map(([key, label]) => {
          const list = members(key);
          if (list.length < 2) return "";
          const overdue = list.filter(late).length;
          return `<button type="button" class="uk-tile${key === "due" ? " due" : ""}" data-group="${key}" aria-pressed="${open === key}">
            <span class="msi uk-icon" aria-hidden="true">${UPKEEP_ICONS[key]}</span>
            <strong>${esc(label)}</strong>
            <span class="small muted">${list.length} ${list.length === 1 ? "task" : "tasks"}</span>
            ${overdue ? `<span class="small late">${overdue} late</span>` : ""}
          </button>`;
        }).join("");
        const rows = (open ? members(open) : []).map((t) => taskLine(t, { source, badge })).join("");
        return `<div class="uk-tiles" role="group" aria-label="Kinds of upkeep">${tiles}</div>
          ${lines ? `<div class="uk-lines">${lines}</div>` : ""}
          ${open && members(open).length ? `<div class="card lines">${rows}</div>` : ""}`;
      }

      // --- Facts overview -----------------------------------------------------
      // Specs as one compact table, error codes as chips you tap, the rest
      // folded away with a count. Fix lives inside an opened entry, not on every row.
      /** The specs' one-line summary: up to three short values, numbers first. */
      function glanceLine(specs) {
        const short = specs.filter((f) => f.value.length <= 20);
        const picked = [...short.filter((f) => /\d/.test(f.value)), ...short.filter((f) => !/\d/.test(f.value))].slice(0, 3);
        return (picked.length ? picked : specs.slice(0, 2)).map((f) => (f.value.length > 24 ? `${f.value.slice(0, 24)}…` : f.value)).join(" · ");
      }

      function factsBody(facts, openCode, { source, badge }, { checks = [], glanceOpen = false } = {}) {
        const of = (kind) => facts.filter((f) => f.kind === kind);
        const page = (f) => (f.source_page ? ` · p. ${f.source_page}` : "");
        const check = (f) => (f.status === "needs_review" ? ' <span class="chip gold strong">To check</span>' : "");
        const specs = of("spec");
        const codes = of("error_code");
        // Short, numeric specs first: the ones people look up.
        const ranked = [...specs.filter((f) => /\d/.test(f.value) && f.value.length <= 40), ...specs.filter((f) => !(/\d/.test(f.value) && f.value.length <= 40))];
        const rows = (glanceOpen ? specs : ranked.slice(0, 3))
          .map(
            (f) => `<div class="gl-row"><div class="gl-text"><span class="small muted">${esc(f.label)}${page(f)}</span><strong>${esc(f.value)}</strong>${check(f)}</div>
              <button type="button" class="gl-copy" data-copy-fact="${f.id}" aria-label="Copy ${esc(f.label)}" title="Copy">${ic("content_copy")}</button></div>`,
          )
          .join("");
        const glance = specs.length
          ? `<section class="card glance2" aria-labelledby="glance-h">
              <div class="section-head" style="margin:0"><h2 id="glance-h" style="margin:0">At a glance</h2>${specs.length > 3 ? `<button type="button" class="link" data-glance-all aria-expanded="${glanceOpen}">${glanceOpen ? "Less" : `All ${specs.length}`}</button>` : ""}</div>
              <div class="gl-rows">${rows}</div>
              ${glanceOpen || specs.length <= 3 ? `<div class="row" style="gap:16px"><button type="button" class="link small" data-copy-specs>Copy all specs</button><button type="button" class="link small" data-ask-facts>Something off? Ask Muse</button></div>` : ""}
            </section>`
          : "";
        const open = codes.find((f) => f.id === openCode);
        const codeCard = codes.length
          ? `<section aria-labelledby="codes-h"><div class="section-head"><h2 id="codes-h">Error codes</h2></div>
              <div class="card"><p class="muted" style="margin:0 0 10px">Seeing a code on the display?</p>
                <div class="codes" role="group" aria-label="Error codes">${codes
                  .map((f) => `<button type="button" class="code" data-code="${f.id}" aria-pressed="${f.id === openCode}">${esc(f.label)}</button>`)
                  .join("")}</div>
                ${open ? `<div class="stack line-body" style="margin-top:12px"><div><strong>${esc(open.label)}</strong>: ${esc(open.value)}</div><div class="row">${source(open)}${badge(open)}<button type="button" class="quiet small" data-fix="fact:${open.id}">${ic("edit")}Fix</button></div></div>` : ""}
              </div></section>`
          : "";
        const folded = ["part", "safety", "other"]
          .map((kind) => {
            const list = of(kind);
            const safetyChecks = kind === "safety" ? checks : [];
            if (!list.length && !safetyChecks.length) return "";
            const count = safetyChecks.length
              ? [list.length && `${list.length} warning${list.length === 1 ? "" : "s"}`, `${safetyChecks.length} check${safetyChecks.length === 1 ? "" : "s"}`].filter(Boolean).join(" · ")
              : list.length;
            return `<details class="card fold"><summary><strong>${KINDS[kind]}</strong> <span class="muted small">${count}</span></summary>
              ${safetyChecks.length ? `<p class="small muted fold-label">Checks</p><div class="lines">${safetyChecks.map((t) => taskLine(t, { source, badge })).join("")}</div>${list.length ? '<p class="small muted fold-label">Warnings</p>' : ""}` : ""}
              <div class="lines">${list
                .map(
                  (f) => `<details class="line"><summary><span class="line-title">${esc(f.label)}</span>${f.status === "needs_review" ? '<span class="chip gold strong">To check</span>' : ""}</summary>
                    <div class="stack line-body"><div>${esc(f.value)}</div><div class="row">${source(f)}${badge(f)}<button type="button" class="quiet small" data-fix="fact:${f.id}">${ic("edit")}Fix</button></div></div></details>`,
                )
                .join("")}</div></details>`;
          })
          .join("");
        return glance + codeCard + folded;
      }

      // --- Adding --------------------------------------------------------------

      // Searching is the default; a link or an upload is the fallback, opened when the search comes up empty.
      function manualForm(searchable) {
        return `<div class="stack" id="found" aria-live="polite"></div>
          ${searchable ? '<div class="row"><button type="button" class="quiet small hidden" id="find-manual">Search again</button></div>' : ""}
          <details id="own-pdf"${searchable ? "" : " open"}>
            <summary>Have the PDF or a link?</summary>
            <div class="stack" style="margin-top:10px">
              <form class="field" data-link><label class="sr-only" for="pdf-url">Link to the manual PDF</label>
                <input id="pdf-url" type="url" placeholder="https://maker.example/manual.pdf"><button type="submit">Read it</button></form>
              <div class="row"><button type="button" class="quiet" data-pages>${ic("photo_camera")}Photograph the paper manual</button></div>
              <div class="row"><label class="button quiet" for="pdf-file" style="cursor:pointer">Upload a PDF</label>
                <input id="pdf-file" type="file" accept="application/pdf" class="sr-only"><span class="small muted" data-progress role="status"></span></div>
            </div>
          </details>`;
      }

      const FOUND_KEY = (id) => `manuals-found-${id}`;

      /** The thing's search from the last half hour, from the model log: a search finished after the page was left. */
      async function recentSearch(itemId) {
        const supa = await db();
        const { data: run } = await supa
          .from("model_runs")
          .select("raw_output")
          .eq("kind", "search")
          .eq("item_id", itemId)
          .eq("ok", true)
          .gte("created_at", new Date(Date.now() - 30 * 60_000).toISOString())
          .order("created_at", { ascending: false })
          .limit(1)
          .maybeSingle();
        try {
          const saved = JSON.parse(run?.raw_output ?? "null");
          return saved?.candidates?.length ? { query: saved.query, candidates: saved.candidates } : null;
        } catch {
          return null;
        }
      }

      function candidateCard(c, item) {
        // A site that blocks apps: the person's own phone can still open and save it.
        const who = c.official && item?.brand ? item.brand : c.host.replace(/^www[.]/, "");
        const tags = [
          c.best ? '<span class="chip teal strong">Best match</span>' : "",
          c.official ? '<span class="chip teal strong">From the maker</span>' : "",
          c.blocked
            ? ""
            : c.unchecked
              ? `<span class="chip gold">Couldn't open it to check; the link names your model</span>`
              : c.has_model
                ? c.match === "lookalike"
                  ? '<span class="chip gold">Nearly your model number; check the label</span>'
                  : `<span class="chip teal">${c.match === "family" ? "Same model family" : "Names your model"}</span>`
                : c.named
                  ? `<span class="chip gold">Your model number isn't printed in it</span>`
                  : '<span class="chip gold">Model not found in the text</span>',
          c.sheet ? '<span class="chip gold">A spec or install sheet, not the full manual</span>' : "",
        ].join("");
        return `<div class="card found-card">
          <div class="stack" style="gap:4px;min-width:0">
            <strong style="overflow-wrap:anywhere">${esc(c.title || c.url.split("/").pop())}</strong>
            <span class="small muted" style="overflow-wrap:anywhere">${esc(c.host)}${c.page_count ? ` · ${c.page_count} pages` : ""}</span>
            <div class="row" style="gap:6px">${tags}</div>
            ${c.models?.length ? `<p class="small muted" style="margin:4px 0 0">Covers ${c.models.length} models: ${esc(c.models.slice(0, 4).join(", "))}${c.models.length > 4 ? ", …" : ""}</p>` : ""}
            ${c.blocked ? `<p class="small" style="margin:4px 0 0">${esc(who)} blocks apps from downloading it. Takes 20 seconds:</p>${grabSteps(c)}` : ""}
            ${c.model_hint ? `<p class="small" style="margin:4px 0 0">This manual spells it <strong>${esc(c.model_hint)}</strong>; the label photo may have been misread. <button type="button" class="quiet small" data-fix-model="${esc(c.model_hint)}">Fix the model</button></p>` : ""}
          </div>
          ${c.blocked ? "" : `<div class="row"><button type="button" data-use="${esc(c.url)}" data-official="${c.official}">Use this</button><a class="button quiet" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Open</a></div>`}
        </div>`;
      }

      /** The three steps to save a PDF a site won't let the app download. */
      const grabSteps = (c) => `<ol class="wz-num">
          <li><span>Open the PDF</span><a class="button small" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${ic("open_in_new")}Open</a></li>
          <li><span>Tap ${ic("ios_share")} or ⋮, then <strong>Download</strong></span></li>
          <li><span>Come back and add it</span><button type="button" class="quiet small" data-add-pdf>${ic("upload")}Add PDF</button></li>
        </ol>`;

      /** The wizard's three steps (label, is it new, manual) as dots. */
      const stepDots = (n) =>
        `<div class="wz-dots" role="img" aria-label="Step ${n} of 3">${[1, 2, 3].map((i) => `<span class="${i <= n ? "on" : ""}"></span>`).join("")}</div>`;

      /** The wizard's manual heading, once the search knows what it found. */
      function manualHeading(text) {
        const h = $("#manual-h");
        if (h) h.textContent = text;
        $("#manual-lede")?.setAttribute("hidden", "");
      }

      /**
       * The candidate to use without asking: Jev's pick, else the only one, else the
       * maker's PDF that names this exact model. Never a spec sheet. Null when it's
       * a real choice, and the person picks.
       */
      function autoPick(candidates) {
        const usable = candidates.filter((c) => !c.sheet);
        // Opened here (so it downloads) and either the maker's own or naming the model.
        const opened = usable.filter((c) => !c.blocked && !c.unchecked && (c.official || c.has_model || c.named));
        return (
          usable.find((c) => c.best) ??
          (candidates.length === 1 && usable.length === 1 ? usable[0] : null) ??
          usable.find((c) => c.official && c.has_model && c.match === "exact") ??
          // The only one that opened, from the maker with the model in its link (a Whirlpool PDF
          // whose text says WDF330PAHS while the label reads WDF330PAHS 5).
          (opened.length === 1 ? opened[0] : null) ??
          null
        );
      }

      /** A found manual's icon, title and the few tags that matter. */
      function foundHead(c, item) {
        const who = c.official && item?.brand ? item.brand : c.host.replace(/^www[.]/, "");
        const tags = [
          c.official ? `<span class="chip teal strong">From ${esc(who)}</span>` : `<span class="chip">${esc(who)}</span>`,
          c.has_model && c.match !== "lookalike" ? `<span class="chip teal strong">${c.match === "family" ? "Same model family" : "Your exact model"}</span>` : "",
          c.page_count ? `<span class="chip">${c.page_count} pages</span>` : "",
        ].join("");
        return `<div class="wz-found-head"><span class="wz-pdf" aria-hidden="true"><i></i><i></i><i></i><b>PDF</b></span>
          <div class="stack" style="gap:6px;min-width:0"><strong style="overflow-wrap:anywhere">${esc(c.title || "Owner's manual")}</strong><div class="row" style="gap:6px">${tags}</div></div></div>`;
      }

      /** Marks the progress steps: those before `now` done, `now` running; each says it in its own tense. */
      function markStep(found, now) {
        const order = ["dl", "read", "facts"];
        for (const li of found.querySelectorAll("[data-st]")) {
          const i = order.indexOf(li.dataset.st);
          const state = i < order.indexOf(now) ? "done" : i === order.indexOf(now) ? "now" : "";
          li.className = state;
          li.textContent = li.dataset[state || "todo"] ?? li.textContent;
        }
      }

      // Two calls: download and store (a maker's site can be slow), then Muse's read.
      // Progress and errors stay on the card, not in a toast that disappears.
      async function attachManual(found, c, item, after, fallback) {
        const uses = found.querySelectorAll("[data-use]");
        for (const other of uses) other.disabled = true;
        let status = found.querySelector("[data-attach-status]");
        if (!status) {
          found.insertAdjacentHTML("beforeend", '<p class="small" role="status" data-attach-status></p>');
          status = found.querySelector("[data-attach-status]");
        }
        const steps = !!found.querySelector("[data-st]");
        status.style.color = "";
        if (!steps) status.textContent = "Downloading the manual from the maker's site. Some are slow; this can take a minute or two.";
        try {
          // The read starts on the server, so leaving the page doesn't stop it.
          watchJob({ kind: "read", item: item.id, label: item.nickname });
          const out = await api("/api/attach", { item_id: item.id, url: c.url, official: !!c.official, read: true });
          if (out.reading) {
            if (steps) markStep(found, "read");
            else status.textContent = READING_IN_BACKGROUND;
            return;
          }
          forgetJob("read", item.id);
          if (!unstash(FRESH_KEY(item.id))) toast(out.distilled ? `Read it: ${out.distilled.tasks} tasks, ${out.distilled.facts} facts.` : out.note || "Saved.");
          after();
        } catch (err) {
          forgetJob("read", item.id);
          found.querySelector(".wz-progress")?.remove();
          status.style.color = "var(--coral)";
          status.textContent = err.message;
          for (const other of uses) other.disabled = false;
          // Saving the PDF by hand is the way forward; show where to add it.
          fallback();
        }
      }

      /** "Add PDF" on a blocked card and "Photograph the paper manual" anywhere in `root`. */
      function wirePdfButtons(root, item, after) {
        for (const b of root.querySelectorAll("[data-add-pdf]")) {
          b.addEventListener("click", () => {
            const own = $("#own-pdf");
            if (own) own.open = true;
            $("#pdf-file")?.click();
          });
        }
        for (const b of root.querySelectorAll("[data-pages]")) {
          b.addEventListener("click", () => pagesFlow(item, after));
        }
      }

      // --- Photographing a paper manual ----------------------------------------
      // Each page is snapped one at a time into a grid. Jev looks at each as it
      // lands: a blurry page is marked for a retake. A page in another language
      // is skipped only when there are English pages too (a manual printed in
      // several languages); a manual in one language is kept whole and Muse
      // writes its tasks in English. The usable pages become one PDF on the phone, and
      // that goes up like any upload: the server reads a PDF without a text
      // layer page by page with Muse.

      const MAX_PAGE_PHOTOS = 40;
      let jsPdfLoading = null;
      function loadJsPdf() {
        jsPdfLoading ??= new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
          s.onload = () => resolve(window.jspdf.jsPDF);
          s.onerror = () => {
            jsPdfLoading = null;
            reject(new Error("Couldn't load the PDF maker. Check the connection and try again."));
          };
          document.head.append(s);
        });
        return jsPdfLoading;
      }

      /** A data URL's pixel size, for sizing its PDF page. */
      const imageSize = (src) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve({ w: img.width, h: img.height });
          img.onerror = () => reject(new Error("Couldn't open a page photo."));
          img.src = src;
        });

      async function pagesPdf(pages) {
        const JsPdf = await loadJsPdf();
        let doc = null;
        for (const p of pages) {
          const { w, h } = await imageSize(p.src);
          const format = [w, h];
          if (!doc) doc = new JsPdf({ unit: "px", format, orientation: w > h ? "landscape" : "portrait", hotfixes: ["px_scaling"] });
          else doc.addPage(format, w > h ? "landscape" : "portrait");
          doc.addImage(p.src, "JPEG", 0, 0, w, h);
        }
        return new File([doc.output("blob")], "Photographed manual.pdf", { type: "application/pdf" });
      }

      function pagesFlow(item, after) {
        const section = $("#found")?.closest("section") ?? $("#manual-section");
        if (!section) return;
        const pages = [];
        let replacing = null;
        const sound = () => pages.filter((p) => p.check && !p.check.retake);
        // Other-language pages are left out only beside English ones: a manual in one language is read whole.
        const hasEnglish = () => sound().some((p) => p.check.english);
        const skips = (p) => !!p.check && !p.check.retake && !p.check.english && hasEnglish();
        const usable = () => sound().filter((p) => !skips(p));
        const langName = (p) => p.check?.language || "another language";
        const draw = () => {
          const ready = usable().length;
          const retakes = pages.filter((p) => p.check?.retake).length;
          const skipped = pages.filter(skips).length;
          const foreign = !hasEnglish() && sound().find((p) => !p.check.english);
          const checking = pages.filter((p) => !p.check).length;
          section.innerHTML = `<div class="stack" id="pages-flow">
              <div class="row" style="justify-content:space-between"><h2 style="margin:0">Snap each page</h2><span class="small muted">${pages.length} page${pages.length === 1 ? "" : "s"}</span></div>
              <p class="muted" style="margin:0">Care and troubleshooting pages matter most.</p>
              <div class="pg-grid">${pages
                .map((p, i) => {
                  const flag = !p.check ? '<span class="pg-flag">Checking…</span>' : p.check.retake ? '<span class="pg-flag gold">Retake</span>' : skips(p) ? `<span class="pg-flag">${esc(p.check.language ?? "Not English")}, skipped</span>` : "";
                  const cls = p.check?.retake ? "retake" : skips(p) ? "skip" : "";
                  return `<div class="pg-tile ${cls}">
