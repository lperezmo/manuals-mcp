                    <button type="button" class="pg-shot" data-page="${i}" aria-label="Page ${i + 1}${p.check?.retake ? ", blurry, tap to retake" : ""}">${p.src ? `<img src="${p.src}" alt="">` : ""}</button>
                    ${flag}<span class="pg-num">${i + 1}</span>
                    <button type="button" class="pg-x" data-drop="${i}" aria-label="Remove page ${i + 1}">${ic("close")}</button>
                  </div>`;
                })
                .join("")}
                ${pages.length < MAX_PAGE_PHOTOS ? `<label class="pg-add" for="page-camera">${ic("add_a_photo")}<span>${pages.length ? "Next page" : "First page"}</span></label>` : ""}
              </div>
              <div class="row"><label class="link small" for="page-upload" style="cursor:pointer">Or pick photos you already took</label></div>
              ${foreign ? `<p class="wz-card small" style="margin:0">${ic("info")} Only in ${esc(langName(foreign))}? That's fine: Muse reads it and writes the tasks in English.</p>` : ""}
              ${pages.length ? `<p class="wz-card small" style="margin:0">${ic("task_alt")} ${[`${ready} ready`, retakes && `${retakes} to retake`, skipped && `${skipped} skipped`, checking && `${checking} checking`].filter(Boolean).join(" · ")}</p>` : ""}
              <button type="button" class="wz-big" id="pages-read" ${ready && !checking ? "" : "disabled"}>${ready ? `Read ${ready} page${ready === 1 ? "" : "s"}` : "Read the pages"}</button>
              <p class="small muted" role="status" id="pages-msg" style="margin:0"></p>
              <button type="button" class="link small" id="pages-cancel" style="align-self:start">Cancel</button>
              <input id="page-camera" type="file" accept="image/*" capture="environment" class="sr-only">
              <input id="page-upload" type="file" accept="image/*" multiple class="sr-only">
            </div>`;
          const add = (files) => {
            for (const file of files) {
              if (pages.length >= MAX_PAGE_PHOTOS && replacing == null) break;
              const page = { src: null, check: null };
              if (replacing != null) pages[replacing] = page;
              else pages.push(page);
              replacing = null;
              shrink(file, 1568)
                .then(async (src) => {
                  page.src = src;
                  draw();
                  page.check = await api("/api/page-check", { image: src }).catch(() => ({ retake: null, english: true, language: null }));
                })
                .catch((err) => {
                  pages.splice(pages.indexOf(page), 1);
                  toast(err.message);
                })
                .finally(draw);
            }
            draw();
          };
          $("#page-camera").addEventListener("change", (e) => add([...e.target.files]));
          $("#page-upload").addEventListener("change", (e) => add([...e.target.files]));
          for (const b of section.querySelectorAll("[data-page]")) {
            b.addEventListener("click", () => {
              replacing = Number(b.dataset.page);
              $("#page-camera").click();
            });
          }
          for (const b of section.querySelectorAll("[data-drop]")) {
            b.addEventListener("click", () => {
              pages.splice(Number(b.dataset.drop), 1);
              draw();
            });
          }
          $("#pages-cancel").addEventListener("click", after);
          $("#pages-read").addEventListener("click", async (e) => {
            const button = e.currentTarget;
            const msg = $("#pages-msg");
            button.disabled = true;
            try {
              msg.textContent = "Putting the pages together…";
              const file = await pagesPdf(usable());
              const out = await uploadManual(item, file, (t) => {
                msg.textContent = t;
              });
              if (!out?.background) after();
            } catch (err) {
              button.disabled = false;
              msg.style.color = "var(--coral)";
              msg.textContent = err.message;
            }
          });
        };
        draw();
        section.scrollIntoView({ block: "start", behavior: "smooth" });
      }

      /** The wizard's last step, on the thing's page once its manual is read: what Muse found and what's first. */
      function readyCard(item) {
        const tasks = item.tasks.filter((t) => t.active);
        const codes = item.manual_facts.filter((f) => f.kind === "error_code").length;
        const specs = item.manual_facts.filter((f) => f.kind === "spec").length;
        const first = tasks.filter((t) => t.next_due_on).sort((a, b) => a.next_due_on.localeCompare(b.next_due_on))[0];
        const stat = (n, what) => `<div class="wz-stat"><strong>${n}</strong><span class="small muted">${what}</span></div>`;
        return `<section class="card wz-ready" id="ready-card" aria-labelledby="ready-h">
            <div class="row" style="justify-content:space-between;align-items:center"><span class="wz-ok big" aria-hidden="true">${ic("check")}</span><button type="button" class="quiet small" id="ready-close" aria-label="Close">${ic("close")}</button></div>
            <h2 id="ready-h" style="margin:0">${esc(item.nickname)} is ready</h2>
            <div class="wz-stats">${stat(tasks.length, tasks.length === 1 ? "upkeep task" : "upkeep tasks")}${stat(codes, codes === 1 ? "error code" : "error codes")}${stat(specs, specs === 1 ? "spec" : "specs")}</div>
            ${first ? `<div class="wz-card row" style="gap:12px;flex-wrap:nowrap">${ic("event")}<div class="stack" style="gap:2px"><strong>${esc(first.title)}</strong><span class="small muted">First up, ${esc(relDay(first.next_due_on))}</span></div></div>` : ""}
            <div class="wz-alts two">
              <button type="button" class="quiet" id="ready-receipt">${ic("receipt_long")}Add receipt</button>
              <button type="button" class="quiet" id="ready-tune">${ic("auto_awesome")}Tune with Muse</button>
            </div>
          </section>`;
      }

      async function findOnline(item, after, fresh = false) {
        const found = $("#found");
        const button = $("#find-manual");
        const fallback = () => {
          const own = $("#own-pdf");
          if (own) own.open = true;
        };
        if (button) button.disabled = true;
        found.innerHTML = '<p class="muted small" role="status">Searching the web for the manual and opening the best PDFs. About 10 seconds; you can leave this page and it keeps going.</p>';
        try {
          // One search per thing per visit; going back and forth reuses it.
          let out;
          try {
            out = fresh ? null : JSON.parse(sessionStorage.getItem(FOUND_KEY(item.id)) || "null");
          } catch {}
          if (!out && !fresh) out = await recentSearch(item.id);
          if (!out) {
            watchJob({ kind: "search", item: item.id, label: item.nickname });
            try {
              out = await api("/api/find-manual", { item_id: item.id });
            } catch (err) {
              // The phone paused the page (another app, screen off): the server keeps
              // searching and saves what it finds. The pill watches for it, and this
              // card fills in when it's done.
              if (err.dropped) {
                found.innerHTML = '<p class="muted small" role="status" data-still-searching>Still searching. The results show up here when it is done.</p>';
                return;
              }
              forgetJob("search", item.id);
              throw err;
            }
            forgetJob("search", item.id);
            // Only a search that found something is remembered; an empty one is tried again next visit.
            try {
              if (out.candidates.length) sessionStorage.setItem(FOUND_KEY(item.id), JSON.stringify(out));
              else sessionStorage.removeItem(FOUND_KEY(item.id));
            } catch {}
          }
          if (!out.candidates.length) {
            if (unstash(FRESH_KEY(item.id))) manualHeading("No PDF online");
            found.innerHTML = `<p class="muted small">No PDF turned up for “${esc(out.query)}”.</p>
              <button type="button" class="wz-big" data-pages>${ic("photo_camera")}Photograph the paper manual</button>
              <p class="small muted" style="margin:0">Or find it on the maker's Support page and paste the link or upload the PDF below.</p>`;
            wirePdfButtons(found, item, after);
            fallback();
            return;
          }
          // Fresh from the add wizard: Jev's pick (or the one clear match) is used without asking.
          const pick = unstash(FRESH_KEY(item.id)) ? autoPick(out.candidates) : null;
          if (pick?.model_hint) {
            // The maker's PDF prints the real number: the label photo was misread, so fix it quietly.
            const { error } = await (await db()).from("items").update({ model: pick.model_hint }).eq("id", item.id);
            if (!error) {
              item.model = pick.model_hint;
              toast(`Model saved as ${item.model}, the maker's spelling.`);
            }
            pick.model_hint = null;
          }
          const others = out.candidates.filter((c) => c !== pick);
          if (pick && !pick.blocked) {
            found.innerHTML = `<div class="wz-found">${foundHead(pick, item)}
                <ol class="wz-steps" aria-label="Progress">
                  <li data-st="dl" class="now" data-todo="Download it" data-now="Downloading" data-done="Downloaded">Downloading</li>
                  <li data-st="read" data-todo="Muse reads it" data-now="Muse is reading it" data-done="Read">Muse reads it</li>
                  <li data-st="facts" data-todo="Upkeep, error codes, specs" data-now="Sorting upkeep, error codes, specs" data-done="Upkeep, error codes, specs">Upkeep, error codes, specs</li>
                </ol>
                <div class="wz-progress" aria-hidden="true"><span class="wz-indeterminate"></span></div>
                <p class="small muted" role="status" data-attach-status style="margin:0">About a minute. Fine to leave; you'll get a heads-up when it's done.</p>
              </div>
              ${others.length ? `<details class="wz-more"><summary>Not this one? ${others.length} more</summary><div class="stack" style="margin-top:10px">${others.map((c) => candidateCard(c, item)).join("")}</div></details>` : ""}`;
            manualHeading("Found its manual");
          } else if (pick?.blocked) {
            // The right PDF, on a site that won't hand it to the app: three steps on the phone, or photograph it.
            manualHeading("Found it, but you'll need to grab it");
            found.innerHTML = `<div class="wz-found">${foundHead(pick, item)}${grabSteps(pick)}
                <p class="small muted" style="margin:0">We'll keep your place here.</p></div>
              <div class="wz-or" role="separator"><span>or</span></div>
              <button type="button" class="quiet wz-big" data-pages>${ic("photo_camera")}Photograph the paper manual</button>
              ${others.length ? `<details class="wz-more"><summary>Not this one? ${others.length} more</summary><div class="stack" style="margin-top:10px">${others.map((c) => candidateCard(c, item)).join("")}</div></details>` : ""}`;
          } else {
            if (unstash(FRESH_KEY(item.id))) manualHeading("Which one is yours?");
            found.innerHTML = `${pick || unstash(FRESH_KEY(item.id)) ? "" : "<h3>Is this yours?</h3>"}${(pick ? [pick, ...others] : out.candidates).map((c) => candidateCard(c, item)).join("")}`;
          }
          // Only sites that block apps: the PDF has to come in by hand, so show where.
          if (out.candidates.every((c) => c.blocked) && !pick?.blocked) fallback();
          // The maker's PDF prints the real number; one tap saves it on the thing.
          for (const b of found.querySelectorAll("[data-fix-model]")) {
            b.addEventListener("click", async () => {
              b.disabled = true;
              const { error } = await (await db()).from("items").update({ model: b.dataset.fixModel }).eq("id", item.id);
              if (error) {
                b.disabled = false;
                return toast(error.message);
              }
              item.model = b.dataset.fixModel;
              for (const other of found.querySelectorAll("[data-fix-model]")) other.closest("p")?.remove();
              toast(`Model saved as ${item.model}.`);
            });
          }
          for (const b of found.querySelectorAll("[data-use]")) {
            b.addEventListener("click", () => attachManual(found, { url: b.dataset.use, official: b.dataset.official === "true" }, item, after, fallback));
          }
          wirePdfButtons(found, item, after);
          if (pick && !pick.blocked) attachManual(found, pick, item, after, fallback);
        } catch (err) {
          found.innerHTML = `<p class="small" style="color:var(--coral)">${esc(err.message)}</p>`;
          fallback();
        } finally {
          if (button) {
            button.disabled = false;
            button.classList.remove("hidden");
          }
        }
      }

      function wireManualForm(item, after) {
        const link = main.querySelector("[data-link]");
        if (!link) return;
        $("#find-manual")?.addEventListener("click", () => findOnline(item, after, true));
        wirePdfButtons($("#own-pdf"), item, after);
        if (params.get("find") === "1") history.replaceState(null, "", `/things?id=${item.id}`);
        if (item.brand || item.model) findOnline(item, after);
        const progress = $("[data-progress]");
        link.addEventListener("submit", async (e) => {
          e.preventDefault();
          progress.textContent = "Muse is reading the manual. This takes up to a minute.";
          try {
            const out = await tool("add_item", { attach_to: item.id, pdf_url: $("#pdf-url").value.trim() });
            toast(out.summary);
            after();
          } catch (err) {
            progress.textContent = err.message;
          }
        });
        $("#pdf-file").addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          progress.textContent = "Uploading…";
          try {
            const out = await uploadManual(item, file, (t) => {
              progress.textContent = t;
            });
            if (!out?.background) after();
          } catch (err) {
            progress.textContent = err.message;
          }
        });
      }

      // A failed read used to save the reader's raw error here; show those as one plain sentence.
      const READ_FAILED = "Muse couldn't turn it into a schedule this time. The text is still searchable, and you can read it again.";
      // A read that died leaves its lock behind; past this it's over (READING_STALE_MS on the server).
      const readingNow = (m) => !!m.reading_since && Date.now() - Date.parse(m.reading_since) < JOB_MAX_MS;
      // Any manual with a PDF that isn't read, and isn't being read, can be read again.
      const canReread = (m) => (m.status === "text_ready" || m.status === "pending") && !!m.storage_path && !readingNow(m);

      /** How the manual's read went, and whether "Read it again" is the thing to do (primary) or a quiet option. */
      function manualStatus(manual) {
        const detail = readingNow(manual)
          ? "Muse is reading it now"
          : /couldn't distill/.test(manual.status_detail || "")
            ? READ_FAILED
            : manual.status_detail || (canReread(manual) ? "Muse didn't finish reading it" : "");
        // A failed or unread manual gets the button up front; a read one gets a quiet one (your fixes are kept).
        return { detail, reread: canReread(manual) ? "primary" : manual.status === "distilled" ? "quiet" : null };
      }

      /**
       * Asks Muse to read a manual. If the connection drops (the phone switched apps) or a
       * read is already running, the server keeps going, so this checks back until it's done.
       */
      const READING_IN_BACKGROUND =
        "Muse is reading it in the background, about a minute. You can leave this page or add another thing; you'll get a heads-up when it's done.";

      /** Starts Muse's read. A long one carries on in the background: returns { background: true } and the pill takes over. */
      async function readManual(manualId, say, reread = false, item) {
        let out;
        try {
          out = await api("/api/ingest", reread ? { manual_id: manualId, reread: true } : { manual_id: manualId });
        } catch (err) {
          if (!err.dropped && !err.busy) throw err;
          // A refused re-read right after a read has nothing to wait for.
          if (err.busy && reread && /just read/.test(err.message)) throw err;
          out = { reading: true };
        }
        if (out.reading) {
          if (item) watchJob({ kind: "read", item: item.id, label: item.nickname });
          say(READING_IN_BACKGROUND);
          return { background: true };
        }
        toast(out.distilled ? `Read it: ${out.distilled.tasks} tasks, ${out.distilled.facts} facts.` : out.note || "Saved.");
        return out;
      }

      async function uploadManual(item, file, say) {
        const supa = await db();
        const { data: hid } = await supa.rpc("ensure_household");
        const { data: manual, error } = await supa
          .from("manuals")
          .insert({ household_id: hid, item_id: item.id, title: file.name, source: "pdf_upload" })
          .select("id")
          .single();
        if (error) throw new Error(error.message);
        const path = `${hid}/${manual.id}.pdf`;
        const up = await supa.storage.from("manuals").upload(path, file, { contentType: "application/pdf", upsert: true });
        if (up.error) throw new Error(up.error.message);
        await supa.from("manuals").update({ storage_path: path }).eq("id", manual.id);
        say("Muse is reading the manual. This takes up to a minute.");
        return readManual(manual.id, say, false, item);
      }

      /** Shrinks a photo to at most 1280 px so it stays small to send. */

      // --- Receipt and warranty -----------------------------------------------
      // A photo of the receipt or warranty card, read by Muse into purchase
      // date, store, price and warranty length. The end date is worked out the
      // same way the server does it: a printed end date wins, else the
      // purchase date plus the warranty length.

      const RECEIPT_COLUMNS = "id, kind, purchased_on, store, price, currency, warranty_months, warranty_ends_on, warranty_note, image_path, read_by, created_at";
      const ENDING_SOON_DAYS = 60;
      const RECEIPT_FIELDS = { store: "store", purchased_on: "purchase date", price: "price", warranty_months: "warranty length" };

      /** What to say after /api/receipt read a photo: the note when it wasn't saved, plus any value Jev doubts. */
      function receiptSaid(out, saved = "Saved.") {
        const doubt = out.doubtful?.length
          ? ` Check the ${out.doubtful.map((f) => RECEIPT_FIELDS[f] || f).join(" and ")} against the photo; ${out.doubtful.length > 1 ? "they" : "it"} didn't look right.`
          : "";
        if (out.note) return out.note + doubt;
        return doubt ? saved + doubt : null;
      }

      /**
       * The strip of a photo where Jev found a doubtful value, cut here from the
       * photo the browser already has. `box` edges are fractions of the photo;
       * the margin (a quarter of the width, a fifth of the height) keeps the
       * text around it in view. Null when it can't be drawn.
       */
      function cropOf(image, box) {
        return new Promise((resolve) => {
          if (!image || !box) return resolve(null);
          const img = new Image();
          img.onload = () => {
            const gx = Math.max((box.right - box.left) * 0.25, 0.02);
            const gy = Math.max((box.bottom - box.top) * 0.2, 0.02);
            const x = Math.round(Math.max(0, box.left - gx) * img.width);
            const y = Math.round(Math.max(0, box.top - gy) * img.height);
            const w = Math.round(Math.min(1, box.right + gx) * img.width) - x;
            const h = Math.round(Math.min(1, box.bottom + gy) * img.height) - y;
            if (w < 2 || h < 2) return resolve(null);
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            c.getContext("2d").drawImage(img, x, y, w, h, 0, 0, w, h);
            resolve(c.toDataURL("image/jpeg", 0.9));
          };
          img.onerror = () => resolve(null);
          img.src = image;
        });
      }

      /** The crop of each doubtful value Jev found on the photo: { field: dataUrl }. */
      async function doubtCrops(image, out) {
        const crops = {};
        for (const f of out.doubtful || []) {
          const crop = await cropOf(image, out.boxes?.[f]);
          if (crop) crops[f] = crop;
        }
        return crops;
      }

      const cropImg = (src, alt) => `<img src="${src}" alt="${esc(alt)}" style="display:block;max-width:100%;max-height:120px;border-radius:8px;border:1px solid var(--line)">`;

      function addMonths(day, months) {
        const [y, m, d] = day.split("-").map(Number);
        const first = new Date(Date.UTC(y, m - 1 + months, 1));
        const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
        first.setUTCDate(Math.min(d, last));
        return first.toISOString().slice(0, 10);
      }

      function warrantyEnds(r) {
        if (r?.warranty_ends_on) return r.warranty_ends_on;
        if (r?.purchased_on && r.warranty_months) return addMonths(r.purchased_on, r.warranty_months);
        return null;
      }

      const howLong = (months) => (months % 12 === 0 ? `${months / 12} year${months === 12 ? "" : "s"}` : `${months} month${months === 1 ? "" : "s"}`);
      const longDate = (day) => new Date(`${day}T12:00:00`).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

      function money(price, currency) {
        try {
          return new Intl.NumberFormat(undefined, { style: "currency", currency: currency || "USD" }).format(price);
        } catch {
          return String(price);
        }
      }

      function warrantySection(item, r, ready) {
        const ends = warrantyEnds(r);
        const left = ends ? daysBetween(today(), ends) : null;
        const chip =
          left === null ? "" : left < 0 ? '<span class="chip strong">Ended</span>' : left <= ENDING_SOON_DAYS ? '<span class="chip gold strong">Ends soon</span>' : '<span class="chip teal strong">Under warranty</span>';
        const bought = r?.purchased_on ?? item.purchased_on;
        const lines = [];
        const where = [bought && longDate(bought), r?.store && `at ${r.store}`, r?.price != null && `for ${money(r.price, r.currency)}`].filter(Boolean);
        if (where.length) lines.push(`<strong>Bought ${esc(where.join(" "))}</strong>`);
        if (ends && left < 0) lines.push(`The warranty ended ${esc(longDate(ends))}, so a repair likely isn't covered.`);
        else if (ends)
          lines.push(
            `Covered until ${esc(longDate(ends))}${r.warranty_months && !r.warranty_ends_on ? ` (${howLong(r.warranty_months)})` : ""}, ${left} day${left === 1 ? "" : "s"} left. If it breaks, contact the maker or store with the receipt before paying for a repair.`,
          );
        else if (r) lines.push("The warranty length isn't saved yet. Add it from the card, or check the manual's warranty page.");
        if (r?.warranty_note) lines.push(`<span class="muted">${esc(r.warranty_note)}</span>`);
        const v = (x) => esc(x ?? "");
        const title = ends ? (left < 0 ? "Warranty ended" : `Covered until ${longDate(ends)}`) : bought ? `Bought ${longDate(bought)}` : "Warranty";
        const sub = ends ? (left < 0 ? longDate(ends) : `${left} day${left === 1 ? "" : "s"} left`) : r ? "Warranty length not saved yet" : "Add the receipt to see how long it's covered";
        return `<details class="ref-fold" id="warranty">
            <summary class="ref-row"><span class="ref-icon gold" aria-hidden="true">${ic("receipt_long")}</span>
              <span class="ref-text"><strong id="warranty-h">${esc(title)}</strong><span class="small muted">${esc(sub)}</span></span>${chip}<span class="ref-chev" aria-hidden="true">${ic("expand_more")}</span></summary>
            <div class="stack ref-body">
              ${lines.length ? lines.map((l) => `<p style="margin:0">${l}</p>`).join("") : '<p class="muted" style="margin:0">Snap the receipt or warranty card. Muse keeps the purchase date, store, price and warranty, and tells you if a repair is likely still covered.</p>'}
              ${ready ? "" : '<p class="small muted" style="margin:0">Saving receipts needs a database update here. For now only the purchase date is kept.</p>'}
              <div class="row">
                <label class="button ${r ? "quiet" : ""}" for="receipt-photo" style="cursor:pointer">${ic("photo_camera")}${r ? "New photo" : "Add a photo"}</label>
                <label class="button quiet" for="receipt-gallery" style="cursor:pointer">${ic("upload")}Choose photo</label>
                <button type="button" class="quiet" id="receipt-edit" aria-controls="receipt-form">${ic("edit")}${r ? "Edit" : "Type it in"}</button>
                ${r?.image_path ? `<a class="button quiet" id="receipt-view" style="display:none" target="_blank" rel="noopener noreferrer">${ic("receipt_long")}See the receipt</a>` : ""}
              </div>
              <p class="small muted" id="receipt-msg" role="status" style="margin:0"></p>
              <form class="stack" id="receipt-form" hidden>
                <label class="small" for="rf-date"><strong>Bought on</strong></label><input id="rf-date" type="date" value="${v(bought)}">
                <label class="small" for="rf-store"><strong>Store</strong></label><input id="rf-store" maxlength="120" value="${v(r?.store)}">
                <label class="small" for="rf-price"><strong>Price</strong></label><input id="rf-price" type="number" min="0" step="0.01" value="${v(r?.price)}">
                <label class="small" for="rf-months"><strong>Warranty length in months</strong> <span class="muted">(1 year is 12)</span></label><input id="rf-months" type="number" min="1" max="1200" step="1" value="${v(r?.warranty_months)}">
                <label class="small" for="rf-ends"><strong>Ends on</strong> <span class="muted">(only if the card prints a date)</span></label><input id="rf-ends" type="date" value="${v(r?.warranty_ends_on)}">
                <label class="small" for="rf-note"><strong>What it covers</strong> <span class="muted">(optional)</span></label><input id="rf-note" maxlength="500" placeholder="Parts and labor 1 year" value="${v(r?.warranty_note)}">
                <div class="row"><button type="submit">Save</button><button type="button" class="quiet" id="receipt-cancel">Cancel</button></div>
              </form>
            </div>
          </details>`;
      }

      function wireWarranty(item, r, ready, after) {
        const msg = $("#receipt-msg");
        const form = $("#receipt-form");
        $("#receipt-edit").addEventListener("click", () => {
          form.hidden = !form.hidden;
          if (!form.hidden) $("#rf-date").focus();
        });
        $("#receipt-cancel").addEventListener("click", () => {
          form.hidden = true;
        });
        // The photo is private; a short-lived link opens it.
        if (r?.image_path) {
          db()
            .then((supa) => supa.storage.from("receipts").createSignedUrl(r.image_path, 3600))
            .then(({ data }) => {
              const a = $("#receipt-view");
              if (a && data?.signedUrl) {
                a.href = data.signedUrl;
                a.style.display = "";
              }
            })
            .catch(() => {});
        }
        const send = async (image, force = false) => {
          msg.textContent = "Muse is reading it…";
          const out = await api("/api/receipt", { item_id: item.id, image, ...(force ? { force: true } : {}) });
          if (out.retake) {
            msg.textContent = "";
            const ask = out.retake === "blurry" ? "That photo is a little blurry. Read it anyway?" : "I don't see a receipt or warranty card in that one. Read it anyway?";
            return window.confirm(ask) ? send(image, true) : null;
          }
          if (!out.found) {
            msg.textContent = "Couldn't read a receipt in that one. Try a closer photo in good light, or type it in.";
            return null;
          }
          // A doubtful value Jev found on the photo is shown as a crop next to what was read, under the photo button.
          const crops = await doubtCrops(image, out);
          const rest = { ...out, doubtful: (out.doubtful || []).filter((f) => !crops[f]) };
          toast(receiptSaid(rest) || out.warranty?.summary.split(". ")[0] || "Saved.");
          await after();
          const box = $("#receipt-msg");
          if (!box || !Object.keys(crops).length) return;
          const shown = { store: out.store, purchased_on: out.purchased_on && longDate(out.purchased_on), price: out.price != null && money(out.price, out.currency), warranty_months: out.warranty_months && howLong(out.warranty_months) };
          box.innerHTML = Object.entries(crops)
            .map(
              ([f, src]) =>
                `<span style="display:block;margin:6px 0 4px">Is this the ${esc(RECEIPT_FIELDS[f] || f)}? I read <strong>${esc(String(shown[f] || ""))}</strong>. <button type="button" class="link small" data-fix="${esc(f)}">Fix it</button></span>${cropImg(src, `The ${RECEIPT_FIELDS[f] || f} on your receipt, up close`)}`,
            )
            .join("");
          const inputs = { store: "#rf-store", purchased_on: "#rf-date", price: "#rf-price", warranty_months: "#rf-months" };
          for (const b of box.querySelectorAll("[data-fix]")) {
            b.addEventListener("click", () => {
              $("#receipt-form").hidden = false;
              $(inputs[b.dataset.fix] || "#rf-date")?.focus();
            });
          }
        };
        // The camera, or a photo already in the gallery (Android offers only the gallery without `capture`).
        const pickReceipt = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            await send(await shrink(file, 1568));
          } catch (err) {
            msg.textContent = err.message;
          }
          e.target.value = "";
        };
        $("#receipt-photo").addEventListener("change", pickReceipt);
        $("#receipt-gallery").addEventListener("change", pickReceipt);
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const v = (sel) => $(sel).value.trim() || null;
          const row = {
            purchased_on: v("#rf-date"),
            store: v("#rf-store"),
            price: v("#rf-price") === null ? null : Number(v("#rf-price")),
            warranty_months: v("#rf-months") === null ? null : Number(v("#rf-months")),
            warranty_ends_on: v("#rf-ends"),
            warranty_note: v("#rf-note"),
            read_by: "user",
          };
          const button = form.querySelector("[type=submit]");
          button.disabled = true;
          try {
            const supa = await db();
            if (row.purchased_on && row.purchased_on !== item.purchased_on) {
              const { error } = await supa.from("items").update({ purchased_on: row.purchased_on }).eq("id", item.id);
              if (error) throw new Error(error.message);
            }
            if (ready) {
              const { error } = r ? await supa.from("receipts").update(row).eq("id", r.id) : await supa.from("receipts").insert({ ...row, item_id: item.id });
              if (error) throw new Error(error.message);
              toast("Saved.");
            } else toast("Saved the purchase date. The rest needs a database update first.");
            after();
          } catch (err) {
            button.disabled = false;
            msg.textContent = err.message;
          }
        });
      }

      // --- Add a thing: a short wizard -----------------------------------------

      // Where the model label usually is, by what the thing is.
      const LABEL_SPOTS = {
        washer: "under the lid or around the door opening",
        dryer: "inside the door frame",
        dishwasher: "on the edge of the door, top or side",
        fridge: "on a wall inside the fridge, near the top or the crisper",
        range: "behind the storage drawer or on the oven frame",
        microwave: "inside the door frame or on the back",
        furnace: "inside the front panel door",
        water_heater: "on the side of the tank",
        air_conditioner: "on the side of the outdoor unit",
        car_seat: "on a sticker on the side or the bottom of the seat",
        stroller: "on the frame near the back wheels",
        mower: "on the deck, near the back",
        vacuum: "under the base or the bin",
        coffee: "on the bottom",
        car: "on the driver's door frame",
        other: "on the back, the bottom, or inside a door",
      };
      const KIND_OF = { car_seat: "baby_gear", stroller: "baby_gear", car: "vehicle", mower: "other", other: "other" };

      function add() {
        // What we know so far; the photo fills it, the person corrects it.
        const thing = { nickname: "", brand: "", model: "", serial: "", category: null, kind: "appliance", pdf: "" };
        let image = null;
        let manual = params.get("add") === "pdf";

        function where() {
          const key = thing.category ? iconKey({ category: thing.category }) : null;
          return LABEL_SPOTS[key] ?? "inside the door, on the back, or under the base";
        }

        function picker(label) {
          return `<div class="stack" style="gap:8px">
            <strong class="small">${label}</strong>
            <div class="choices" role="group" aria-label="${label}">${Object.keys(ICONS)
              .map((k) => `<button type="button" data-what="${k}" aria-pressed="${thing.category && iconKey({ category: thing.category }) === k}" aria-label="${ICONS[k][0]}" title="${ICONS[k][0]}">${iconSvg(k, 26)}</button>`)
              .join("")}</div>
          </div>`;
        }

        function detailsForm(open) {
          return `<details class="card wz-details" id="manual-entry" ${open ? "open" : ""}>
            <summary style="font-weight:700;cursor:pointer">${open ? "Details" : thing.brand || thing.model ? "Edit the details" : "Enter the details yourself"}</summary>
            <form class="stack" id="add-form" style="margin-top:12px">
              <label class="small" for="f-nick"><strong>What do you call it?</strong></label>
              <input id="f-nick" required placeholder="Washer" value="${esc(thing.nickname)}">
              <label class="small" for="f-brand"><strong>Brand</strong></label><input id="f-brand" value="${esc(thing.brand)}">
              <label class="small" for="f-model"><strong>Model</strong></label><input id="f-model" value="${esc(thing.model)}">
              <label class="small" for="f-serial"><strong>Serial</strong> <span class="muted">(optional)</span></label><input id="f-serial" value="${esc(thing.serial)}">
              <label class="small" for="f-kind"><strong>Kind</strong></label>
              <select id="f-kind">${[["appliance", "Appliance"], ["baby_gear", "Baby gear"], ["vehicle", "Vehicle"], ["other", "Other"]]
                .map(([v, t]) => `<option value="${v}" ${thing.kind === v ? "selected" : ""}>${t}</option>`)
                .join("")}</select>
              <label class="small" for="f-pdf"><strong>Link to the manual PDF</strong> <span class="muted">(optional; we'll search for it otherwise)</span></label>
              <input id="f-pdf" type="url" placeholder="https://maker.example/manual.pdf" value="${esc(thing.pdf)}">
              <div class="row" style="gap:10px"><label class="button quiet small" for="f-pdf-file" style="cursor:pointer">${ic("upload")}Or upload the PDF</label><span class="small muted" id="f-pdf-name">${thing.file ? esc(thing.file.name) : ""}</span></div>
              <input id="f-pdf-file" type="file" accept="application/pdf" class="sr-only">
              <button type="submit">Continue</button>
              <p class="small muted" data-add-msg role="status"></p>
            </form>
          </details>`;
        }

        // Three steps (label, is it new, manual), shown as dots; the manual is step 3 on the thing's page.
        const dots = stepDots;
        const CANCEL = '<a href="/things" class="wz-link">Cancel</a>';
        const BACK = '<button type="button" class="link wz-link" data-back>Back</button>';
        // Back to the label photo, from a retake or the confirm card.
        const RESTART = '<button type="button" class="link wz-link" data-restart>Back</button>';
        const RETAKE = '<label class="wz-link" for="photo-camera" style="cursor:pointer">Retake</label>';
        const photoTop = () => (image ? `<img src="${image}" alt="Your label photo" class="wizard-photo">` : "");

        function step(body, { n = 1, details = true, left = CANCEL, right = "" } = {}) {
          main.innerHTML = `<section class="wizard-shell">
              <div class="wz-top">${left}${dots(n)}${right || '<span class="wz-link" aria-hidden="true"></span>'}</div>
              <section class="wizard stack">${body}</section>
              ${details ? detailsForm(manual) : ""}
            </section>
            <input id="photo-camera" type="file" accept="image/*" capture="environment" class="sr-only">
            <input id="photo" type="file" accept="image/*" class="sr-only">`;
          for (const id of ["#photo-camera", "#photo"]) {
            $(id).addEventListener("change", (e) => {
              const file = e.target.files?.[0];
              if (file) read(file);
            });
          }
          for (const b of main.querySelectorAll("[data-what]")) {
            b.addEventListener("click", () => {
              // The person's pick beats Muse's guess, and renames a thing still called by that guess.
              thing.category = b.dataset.what;
              thing.kind = KIND_OF[b.dataset.what] ?? "appliance";
              thing.picked = true;
              if (!thing.nickname || thing.nickname === thing.autoName) thing.nickname = thing.autoName = ICONS[b.dataset.what][0];
              redraw();
            });
          }
          $("[data-type]")?.addEventListener("click", () => {
            manual = true;
            redraw();
            $("#f-nick").focus();
          });
          $("[data-continue]")?.addEventListener("click", askHistory);
          $("[data-restart]")?.addEventListener("click", () => start());
          $("[data-anyway]")?.addEventListener("click", () => readImage(async () => image, true));
          $("#add-form")?.addEventListener("submit", (e) => {
            e.preventDefault();
            thing.nickname = $("#f-nick").value.trim();
            thing.brand = $("#f-brand").value.trim();
            thing.model = $("#f-model").value.trim();
            thing.serial = $("#f-serial").value.trim();
            thing.kind = $("#f-kind").value;
            thing.pdf = $("#f-pdf").value.trim();
            askHistory();
          });
          $("#f-pdf-file")?.addEventListener("change", (e) => {
            thing.file = e.target.files?.[0] ?? null;
            const name = $("#f-pdf-name");
            if (name) name.textContent = thing.file?.name ?? "";
          });
          $("#f-nick-quick")?.addEventListener("input", (e) => {
            thing.nickname = e.target.value;
          });
        }

        let redraw = start;
        let beforeHistory = start;

        function start() {
          redraw = start;
          step(`<h1 class="wz-title">Snap its label</h1>
            <label class="wz-frame" for="photo-camera">
              <span class="wz-brackets" aria-hidden="true"><span></span><span></span><span></span><span></span><span class="wz-sticker"><i></i><i></i><i></i></span></span>
              <span class="muted">Fill the frame with the sticker</span>
              <span class="wz-hint">${ic("location_on")}Usually ${esc(where())}</span>
            </label>
            <label class="button wz-big" for="photo-camera">${ic("photo_camera")}Take photo</label>
            <div class="wz-alts">
              <label class="button quiet" for="photo">${ic("upload")}Upload</label>
              <button type="button" class="quiet" data-type>${ic("keyboard")}Type it</button>
              <a class="button quiet" href="/things?add=pdf">${ic("picture_as_pdf")}Have PDF</a>
            </div>`);
        }

        function reading() {
          step(`${photoTop()}
            <h1 class="wz-title">Reading the label…</h1>
            <div class="wz-progress" role="progressbar" aria-label="Reading the label"><span class="wz-indeterminate"></span></div>`, { details: false });
        }

        /** Three short tips, each with an icon, in place of a paragraph. */
        function tips(list) {
          return `<ul class="wz-tips">${list.map(([icon, text]) => `<li>${ic(icon)}<span>${text}</span></li>`).join("")}</ul>`;
        }
        const PHOTO_TIPS = [["center_focus_strong", "Tap the sticker to focus"], ["zoom_in", "Move closer, hold still"], ["flare", "Tilt to dodge glare"]];

        function notFound() {
          redraw = notFound;
          step(`${photoTop()}
            <h1 class="wz-title">Couldn't read a label</h1>
            ${tips(PHOTO_TIPS)}
            ${thing.category ? `<p class="muted" style="margin:0">On a ${esc(ICONS[iconKey({ category: thing.category })][0].toLowerCase())} it's usually ${esc(where())}.</p>` : picker("What is it? I'll say where to look.")}
            <label class="button wz-big" for="photo-camera">${ic("photo_camera")}Retake</label>
            <button type="button" class="link" data-type style="align-self:center">Type it in instead</button>`);
        }

        // Jev's quick look found no label, or text too blurry to read; Muse wasn't asked yet.
        function retake(reason) {
          redraw = () => retake(reason);
          step(`<div class="wz-photo-flag">${photoTop()}<span class="chip gold strong">${reason === "blurry" ? "Too blurry to read" : "No label in this one"}</span></div>
            <h1 class="wz-title">One more try</h1>
            ${tips(reason === "blurry" ? PHOTO_TIPS : [["search", "Look for the sticker with the model number"], ["location_on", `Usually ${esc(where())}`], ["zoom_in", "Get close enough to fill the frame"]])}
            <label class="button wz-big" for="photo-camera">${ic("photo_camera")}Retake</label>
            <div class="row" style="justify-content:center"><button type="button" class="link" data-anyway>Read it anyway</button><span class="muted">·</span><button type="button" class="link" data-type>Type it in</button></div>`, { left: RESTART });
        }

        // Letters a label photo mixes up. Each one in a doubtful model is a button that swaps it.
        const LOOKALIKES = ["S5", "O0", "I1L", "B8", "Z2", "G6"];
        const swapOf = (ch) => {
          const set = LOOKALIKES.find((s) => s.includes(ch.toUpperCase()));
          return set ? set[(set.indexOf(ch.toUpperCase()) + 1) % set.length] : null;
        };

        function partial() {
          redraw = partial;
          // Jev found the doubtful model on the photo: show that strip, and let each look-alike letter be flipped in place.
          const crop = thing.model && thing.doubtful?.includes("model") && thing.crops?.model;
          if (crop) {
            const letters = [...thing.model]
              .map((ch, i) => (swapOf(ch) ? `<button type="button" class="wz-letter" data-flip="${i}" aria-label="${esc(ch)}, tap to switch to ${esc(swapOf(ch))}">${esc(ch)}</button>` : `<span>${esc(ch)}</span>`))
              .join("");
            const doubts = [...thing.model].map((ch, i) => (swapOf(ch) ? i : -1)).filter((i) => i >= 0);
            // One letter in doubt: ask it as a plain either-or. Several: each highlighted letter flips on a tap.
            const one = doubts.length === 1 ? doubts[0] : null;
            const pair = one == null ? null : [thing.model[one].toUpperCase(), swapOf(thing.model[one])];
            const article = (ch) => (/[AEFHILMNORSX18]/.test(ch) ? "an" : "a");
            step(`<h1 class="wz-title">Is this the model?</h1>
              ${cropImg(crop, "The model number on your label, up close")}
              <div class="wz-card stack">
                ${doubts.length ? `<span class="chip gold strong" style="align-self:start">${doubts.length} letter${doubts.length === 1 ? "" : "s"} to check</span>` : ""}
                <div class="wz-model">${letters}</div>
                ${
                  pair
                    ? `<p style="margin:0;font-weight:700">Is that ${article(pair[0])} ${esc(pair[0])} or ${article(pair[1])} ${esc(pair[1])}?</p>
                      <div class="wz-alts two">${pair.map((ch) => `<button type="button" class="quiet" data-pick-letter="${esc(ch)}">${esc(ch)}</button>`).join("")}</div>`
                    : doubts.length
                      ? '<p class="small muted" style="margin:0">Tap a highlighted letter to switch it: S and 5, O and 0 look alike.</p>'
                      : ""
                }
              </div>
              <button type="button" class="wz-big" id="doubt-ok">Yes, that's it</button>
              <details class="wz-more"><summary>Type it instead</summary>
                <form class="row" id="doubt-form" style="margin-top:10px">
                  <input id="doubt-model" value="${esc(thing.model)}" aria-label="Model number" autocomplete="off" autocapitalize="characters" spellcheck="false" style="flex:1;min-width:10ch;font-family:ui-monospace,monospace">
                  <button type="submit">Save</button>
                </form>
              </details>
              <p class="small muted" data-add-msg role="status"></p>`, { right: RETAKE });
            const accept = (model) => {
              if (!model) return $("#doubt-model").focus();
              thing.model = model;
              thing.doubtful = thing.doubtful.filter((f) => f !== "model");
              delete thing.crops.model;
              confirm();
            };
            for (const b of main.querySelectorAll("[data-flip]")) {
              b.addEventListener("click", () => {
                const i = Number(b.dataset.flip);
                const chars = [...thing.model];
                chars[i] = swapOf(chars[i]);
                thing.model = chars.join("");
                partial();
                main.querySelector(`[data-flip="${i}"]`)?.focus();
              });
            }
            for (const b of main.querySelectorAll("[data-pick-letter]")) {
              b.addEventListener("click", () => {
                const chars = [...thing.model];
                chars[one] = b.dataset.pickLetter;
                accept(chars.join(""));
              });
            }
            $("#doubt-ok").addEventListener("click", () => accept(thing.model));
            $("#doubt-form").addEventListener("submit", (e) => {
              e.preventDefault();
              accept($("#doubt-model").value.trim());
            });
            return;
          }
          // Where to look, only when we know what it is: the person said, or Muse read a model off its plate.
          // A category guessed from a sticker with no model (a Wi-Fi label, say) is often wrong.
          const sure = thing.category && (thing.picked || thing.model);
          const spot = sure ? `Usually ${esc(where())}` : "";
          const wifi = thing.radio ? "That's the Wi-Fi sticker; the model label is elsewhere." : "";
          // No line said "Model", but a code like "MO: R0698201" might be it: ask.
          if (!thing.model && thing.guess) {
            step(`${photoTop()}
              <h1 class="wz-title">Is this the model?</h1>
              ${thing.brand ? `<p class="muted" style="margin:0">${esc(thing.brand)} · no line says "Model", but this code might be it.</p>` : ""}
              <form class="stack" id="guess-form">
                <input id="guess-model" value="${esc(thing.guess)}" aria-label="Model number" autocomplete="off" autocapitalize="characters" spellcheck="false" class="wz-model-input">
                <button type="submit" class="wz-big">Yes, that's it</button>
              </form>
              ${wifi || spot ? tips([wifi && ["info", wifi], spot && ["location_on", spot]].filter(Boolean)) : ""}
              ${sure ? "" : picker("What is it?")}
              <div class="row" style="justify-content:center"><label class="link" for="photo-camera" style="cursor:pointer">Photo of the model label</label><span class="muted">·</span><button type="button" class="link" data-continue>Skip it</button></div>
              <p class="small muted" data-add-msg role="status"></p>`, { right: RETAKE });
            $("#guess-model").addEventListener("input", (e) => {
              thing.guess = e.target.value;
            });
            $("#guess-form").addEventListener("submit", (e) => {
              e.preventDefault();
              const model = $("#guess-model").value.trim();
              if (!model) return $("#guess-model").focus();
              thing.model = model;
              thing.guess = "";
              confirm();
            });
            return;
          }
          const got = [thing.brand && `<strong>${esc(thing.brand)}</strong>`, thing.model && `<strong>${esc(thing.model)}</strong>`].filter(Boolean).join(" · ");
          const missing = !thing.model ? "Missing the model number" : thing.doubtful?.includes("model") ? "Not sure of the model number" : "Some of it was hard to read";
          step(`${photoTop()}
            <h1 class="wz-title">Almost</h1>
            <div class="wz-card stack" style="gap:6px">${got ? `<span>${got}</span>` : ""}<span class="chip gold strong" style="justify-self:start">${missing}</span></div>
            ${tips([wifi && ["info", wifi], spot && ["location_on", spot], ["zoom_in", "A close photo of just that sticker works best"]].filter(Boolean))}
            ${sure ? "" : picker("What is it?")}
            <label class="button wz-big" for="photo-camera">${ic("photo_camera")}Closer photo</label>
            <div class="row" style="justify-content:center"><button type="button" class="link" data-type>Type the model</button><span class="muted">·</span><button type="button" class="link" data-continue>Skip it</button></div>
            <p class="small muted" data-add-msg role="status"></p>`);
        }

        function confirm() {
          redraw = confirm;
          const key = iconKey(thing);
          const what = ICONS[key][0].toLowerCase() === "other" ? "" : ICONS[key][0].toLowerCase();
          if (!thing.nickname) thing.nickname = thing.autoName = thing.category ? ICONS[key][0] : "";
          const ok = `<span class="wz-ok" aria-label="read">${ic("check")}</span>`;
          step(`<div class="wz-head">${itemIcon(thing, 64)}<div style="min-width:0"><h1 class="wz-title" style="margin:0">${esc([thing.brand, what].filter(Boolean).join(" ") || "Your thing")}</h1><p class="muted" style="margin:2px 0 0">Read off your photo</p></div></div>
            <div class="wz-card wz-rows">
              ${thing.brand ? `<div class="wz-row"><span class="muted">Brand</span><strong>${esc(thing.brand)}${ok}</strong></div>` : ""}
              <div class="wz-row"><span class="muted">Model</span><strong class="mono">${esc(thing.model)}${ok}</strong></div>
              ${thing.serial ? `<div class="wz-row"><span class="muted">Serial</span><span class="mono small">${esc(thing.serial)}</span></div>` : ""}
              <label class="wz-row" for="f-nick-quick"><span class="muted">Call it</span><input id="f-nick-quick" class="wz-inline" value="${esc(thing.nickname)}" placeholder="Washer" autocomplete="off">${ic("edit")}</label>
            </div>
            <button type="button" class="wz-big" data-continue>Looks right</button>
            <p class="small muted" data-add-msg role="status"></p>`, { left: RESTART, right: RETAKE });
        }

        async function read(file) {
          return readImage(() => shrink(file));
        }

        async function readImage(getImage, force = false) {
          // A closer photo after "Almost" adds to what we read; any other photo starts over.
          if (redraw !== partial) {
            Object.assign(thing, { nickname: "", autoName: "", brand: "", model: "", serial: "", category: null, kind: "appliance", picked: false, guess: "", radio: false, doubtful: [], crops: {} });
          }
          try {
            image = await getImage();
            reading();
            const label = await api("/api/snap", force ? { image, force: true } : { image });
            if (label.retake) return retake(label.retake);
            // What the person picked stays; Muse's read only fills in what they didn't say.
            if (!thing.picked) {
              if (label.category) thing.category = label.category;
              if (label.kind) thing.kind = label.kind;
            }
            if (!label.found && !label.brand && !label.model) return notFound();
            if (label.nickname && !thing.picked) thing.nickname = thing.autoName = label.nickname;
            thing.brand = label.brand || thing.brand;
            thing.model = label.model || thing.model;
            thing.serial = label.serial || thing.serial;
            if (label.model_guess) thing.guess = label.model_guess;
            thing.radio = Boolean(label.radio) && !thing.model;
            // A closer photo that didn't read a value again keeps the doubt about it.
            const reread = ["brand", "model", "serial"].filter((k) => label[k]);
            thing.doubtful = [...(thing.doubtful || []).filter((f) => !reread.includes(f)), ...(label.doubtful || [])];
            // Crops are cut from the photo that read the value, so a value read again gets a new one or none.
            const kept = Object.entries(thing.crops || {}).filter(([f]) => !reread.includes(f) && thing.doubtful.includes(f));
            thing.crops = { ...Object.fromEntries(kept), ...(await doubtCrops(image, label)) };
            if (!thing.model || label.unsure || thing.doubtful.includes("model")) return partial();
            confirm();
          } catch (err) {
            notFound();
            toast(err.message);
          }
        }

        /** Gives it a name from what it is, or opens the details form to type one. False when it still has none. */
        function named() {
          if (!thing.nickname) thing.nickname = thing.category ? ICONS[iconKey(thing)][0] : "";
          if (thing.nickname) return true;
          manual = true;
          redraw();
          $("#f-nick").focus();
          return false;
        }

        // Is it new? A used or stored thing gets a catch-up plan once its manual is read,
        // instead of a schedule that starts as if it was serviced today. Three tiles, then
        // one row of chips; the full form stays folded for anyone who wants to say more.
        const SERVICED = [["this month", "This month"], ["a few months ago", "A few months"], ["over a year ago", "Over a year"], ["", "No idea"]];
        const STORED = [["3", "A few months"], ["12", "About a year"], ["24", "Two years +"], ["", "Not sure"]];
        function askHistory() {
          if (!named()) return;
          if (redraw !== askHistory) beforeHistory = redraw;
          redraw = askHistory;
          const h = thing.history;
          const tile = (cond, icon, text) =>
            `<button type="button" class="wz-tile" data-cond="${cond}" aria-pressed="${h?.condition === cond}">${ic(icon)}<span>${text}</span></button>`;
          const chips = (list, key, value) =>
            `<div class="wz-chips" role="group">${list.map(([v, t]) => `<button type="button" data-${key}="${v}" aria-pressed="${value === v}">${t}</button>`).join("")}</div>`;
          step(
            `<h1 class="wz-title">Is it new?</h1>
              ${tile("new", "new_releases", "Brand new")}
              ${tile("used", "schedule", "Had it a while")}
              ${h?.condition === "used" ? `<div class="wz-sub"><span class="muted">Last cleaned or serviced?</span>${chips(SERVICED, "serviced", h.serviced)}</div>` : ""}
              ${tile("stored", "inventory_2", "Was in storage")}
              ${h?.condition === "stored" ? `<div class="wz-sub"><span class="muted">In storage for?</span>${chips(STORED, "stored", h.idle_months == null ? "" : String(h.idle_months))}</div>` : ""}
              ${
                h && h.condition !== "new"
                  ? `<details class="wz-more"><summary>Add more (optional)</summary><div class="stack" style="margin-top:10px">${historyFields(h, false)}</div></details>
                     <button type="button" class="wz-big" id="history-go">Add it</button>`
                  : ""
              }
              <p class="small muted" data-add-msg role="status"></p>`,
            { n: 2, details: false, left: BACK },
          );
          for (const b of main.querySelectorAll("[data-cond]")) {
            b.addEventListener("click", () => {
              if (b.dataset.cond === "new") {
                thing.history = null;
                return save(b);
              }
              thing.history = { ...(thing.history ?? {}), condition: b.dataset.cond };
              askHistory();
            });
          }
          for (const b of main.querySelectorAll("[data-serviced]")) {
            b.addEventListener("click", () => {
              const v = b.dataset.serviced;
              thing.history.serviced = v;
              thing.history.idle_months = 0;
              thing.history.done = v ? `Last cleaned or serviced ${v}.` : "No idea when it was last cleaned or serviced.";
              askHistory();
            });
          }
          for (const b of main.querySelectorAll("[data-stored]")) {
            b.addEventListener("click", () => {
              const v = b.dataset.stored;
              if (v === "") delete thing.history.idle_months;
              else thing.history.idle_months = Number(v);
              askHistory();
            });
          }
          $("[data-back]").addEventListener("click", () => beforeHistory());
          $("#history-go")?.addEventListener("click", (e) => {
            const { serviced: _, ...rest } = thing.history;
            thing.history = { ...rest, ...readHistory(thing.history.condition) };
            save(e.currentTarget);
          });
        }

        async function save(button) {
          const msg = main.querySelector("[data-add-msg]");
          if (!named()) return;
          button.disabled = true;
          const hasPdf = !!(thing.pdf || thing.file);
          if (msg) msg.textContent = hasPdf ? "Adding it. Muse is reading the manual, up to a minute." : "Adding it…";
          const args = { nickname: thing.nickname, kind: thing.kind, ...(thing.category ? { category: thing.category } : {}) };
          for (const key of ["brand", "model", "serial"]) if (thing[key]) args[key] = thing[key];
          if (thing.pdf) args.pdf_url = thing.pdf;
          if (thing.history) args.history = thing.history;
          try {
            const out = await tool("add_item", args);
            // The thing's page plans the catch-up once the manual is read.
            if (thing.history) stash(HISTORY_KEY(out.data.item.id), JSON.stringify(thing.history));
            toast(out.summary.split(".")[0]);
            // The thing's page finishes the wizard: it picks the manual and says when it's ready.
            stash(FRESH_KEY(out.data.item.id), "1");
            // A PDF from the phone goes up now; the read carries on while the thing's page opens.
            if (thing.file && !thing.pdf) {
              const say = (t) => {
                if (msg) msg.textContent = t;
              };
              await uploadManual(out.data.item, thing.file, say).catch((err) => toast(err.message));
            }
            location.assign(`/things?id=${out.data.item.id}${hasPdf ? "" : "&find=1"}`);
          } catch (err) {
            button.disabled = false;
            if (msg) msg.textContent = err.message;
            else toast(err.message);
          }
        }

        const handed = takePendingPhoto();
        if (handed) readImage(async () => handed);
        else start();
      }

      async function start() {
        if (!(await boot("/things"))) return;
        if (params.get("id")) return detail(params.get("id"));
        if (params.get("add")) return add();
        return list();
      }
      start().catch((err) => {
        main.innerHTML = `<p class="card">Something went wrong: ${esc(err.message)}</p>`;
      });
    </script>
  </body>
</html>
