<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manuals</title>
    <meta name="description" content="Every manual in the house, one question away." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header class="top" id="top"></header>
    <main class="wrap" id="main">
      <p class="muted">One moment…</p>
    </main>

    <script type="module">
      import {
        $,
        addDays,
        ago,
        api,
        boot,
        daysBetween,
        db,
        esc,
        handOffPhoto,
        howOften,
        itemIcon,
        openChat,
        relDay,
        signIn,
        toast,
        today,
        tool,
        typeAhead,
      } from "/app.js";

      const main = $("#main");
      const ITEM = "items!inner(id, nickname, brand, model, kind, category, icon, tint, archived_at)";
      const one = (x) => (Array.isArray(x) ? x[0] : x);

      async function load() {
        const supa = await db();
        const now = today();
        const until = addDays(now, 30);
        const [items, due, facts, tasks, seats, revisions, kids] = await Promise.all([
          supa
            .from("items")
            .select(
              "id, nickname, brand, model, category, child_id, uses_per_week, manuals(page_count), manual_facts(source, status), tasks(active, next_due_on), item_readings(kind, value, measured_on), seat_modes(mode, max_weight_kg, max_height_cm, source_page)",
            )
            .is("archived_at", null)
            .order("created_at"),
          supa
            .from("tasks")
            .select(`id, title, interval_unit, interval_value, next_due_on, source_page, ${ITEM}`)
            .eq("active", true)
            .is("items.archived_at", null)
            .lte("next_due_on", until)
            .order("next_due_on"),
          supa
            .from("manual_facts")
            .select(`id, label, value, source_page, manual_id, ${ITEM}`)
            .eq("status", "needs_review")
            .is("items.archived_at", null),
          supa
            .from("tasks")
            .select(
              `id, title, details, interval_unit, interval_value, source_page, source_manual_id, ${ITEM}`,
            )
            .eq("status", "needs_review")
            .is("items.archived_at", null),
          supa
            .from("seat_modes")
            .select(
              `id, mode, min_weight_kg, max_weight_kg, min_height_cm, max_height_cm, min_age_months, fit_note, source_page, manual_id, ${ITEM}`,
            )
            .eq("status", "needs_review")
            .is("items.archived_at", null),
          supa
            .from("revisions")
            .select("target_table, before, after, source, reason, created_at")
            .order("created_at", { ascending: false })
            .limit(4),
          supa
            .from("children")
            .select("id, nickname, measurements(measured_on, height_cm, weight_kg)"),
        ]);
        for (const r of [items, due, facts, tasks, seats, revisions, kids]) {
          if (r.error) throw new Error(r.error.message);
        }

        let review = [
          ...facts.data.map((f) => ({
            id: f.id,
            type: "fact",
            item: one(f.items),
            title: f.label,
            read: f.value,
            page: f.source_page,
            manual: f.manual_id,
          })),
          ...tasks.data.map((t) => ({
            id: t.id,
            type: "task",
            item: one(t.items),
            // "Check lint filters after every 2 to 3 loads" already says how often.
            title: SAYS_WHEN.test(t.title) ? t.title : `${t.title}, ${howOften(t.interval_unit, t.interval_value)}`,
            read: t.details || t.title,
            page: t.source_page,
            manual: t.source_manual_id,
          })),
          ...seats.data.map((s) => ({
            id: s.id,
            type: "seat_limit",
            item: one(s.items),
            title: `${s.mode[0].toUpperCase()}${s.mode.slice(1).replace(/_/g, "-")} limits`,
            read: seatLimits(s),
            page: s.source_page,
            manual: s.manual_id,
          })),
        ];
        // A manual read twice saves each entry twice ("Roller Ring", "Roller ring"): show one, settle both.
        const seen = new Map();
        for (const r of review) {
          const key = [r.type, r.item?.id, r.title, r.read]
            .map((s) => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, ""))
            .join("|");
          const first = seen.get(key);
          if (first) first.twins.push(r.id);
          else seen.set(key, Object.assign(r, { twins: [] }));
        }
        review = [...seen.values()];
        await Promise.all(
          review.map(async (r) => {
            if (!r.manual || !r.page) return;
            const { data } = await supa
              .from("manual_pages")
              .select("content")
              .eq("manual_id", r.manual)
              .eq("page_number", r.page)
              .maybeSingle();
            r.pageText = data?.content ?? null;
          }),
        );

        render({
          items: items.data,
          due: due.data,
          review,
          revisions: revisions.data,
          kids: kids.data,
        });
      }

      function seatLimits(s) {
        const parts = [];
        if (s.min_weight_kg || s.max_weight_kg)
          parts.push(`${s.min_weight_kg ?? 0} to ${s.max_weight_kg} kg`);
        if (s.min_height_cm || s.max_height_cm)
          parts.push(`${s.min_height_cm ?? 0} to ${s.max_height_cm} cm`);
        if (s.min_age_months) parts.push(`at least ${s.min_age_months} months old`);
        return parts.join(", ") || s.fit_note || "No limits saved";
      }

      /** Marks the sentence(s) of the page that share the most words and numbers with what was read. */
      /** The one or two sentences of a page that match what Muse read, the match marked. */
      function excerpt(text, read) {
        const tokens = (s) =>
          s
            .toLowerCase()
            .split(/[^a-z0-9.]+/)
            .map((w) => w.replace(/\.$/, ""))
            .filter((w) => w.length > 4 || /^\d/.test(w));
        const words = new Set(tokens(read));
        const sentences = text.split(/(?<=[.!?])\s+/);
        const scores = sentences.map((s) => new Set(tokens(s).filter((w) => words.has(w))).size);
        const best = Math.max(0, ...scores);
        if (!best) return esc(text.slice(0, 240)) + (text.length > 240 ? "…" : "");
        const top = scores
          .map((score, i) => ({ score, i }))
          .filter((x) => x.score > 0)
          .sort((a, b) => b.score - a.score || a.i - b.i)
          .slice(0, 2)
          .sort((a, b) => a.i - b.i);
        return top
          .map(({ i }) => {
            const s = sentences[i].length > 260 ? `${sentences[i].slice(0, 260)}…` : sentences[i];
            return scores[i] === best ? `<mark>${esc(s)}</mark>` : esc(s);
          })
          .join(" … ");
      }

      function highlight(text, read) {
        const tokens = (s) =>
          s
            .toLowerCase()
            .split(/[^a-z0-9.]+/)
            .map((w) => w.replace(/\.$/, ""))
            .filter((w) => w.length > 4 || /^\d/.test(w));
        const words = new Set(tokens(read));
        const sentences = text.split(/(?<=[.!?])\s+/);
        const scores = sentences.map((s) => new Set(tokens(s).filter((w) => words.has(w))).size);
        const best = Math.max(0, ...scores);
        return sentences
          .map((s, i) => (best > 0 && scores[i] === best ? `<mark>${esc(s)}</mark>` : esc(s)))
          .join(" ");
      }

      function agenda(due) {
        const now = today();
        const groups = [
          ["Late", (d) => d < 0, "late"],
          ["This week", (d) => d >= 0 && d < 7, ""],
          ["Next week", (d) => d >= 7 && d < 14, ""],
          ["Later this month", (d) => d >= 14, "muted"],
        ];
        const html = groups
          .map(([label, inGroup, tone]) => {
            const tasks = due.filter((t) => inGroup(daysBetween(now, t.next_due_on)));
            if (!tasks.length) return "";
            const rows = tasks
              .map((t) => {
                const d = daysBetween(now, t.next_due_on);
                const date = new Date(`${t.next_due_on}T12:00:00`);
                const when =
                  d < 0 ? relDay(t.next_due_on) : d < 2 ? relDay(t.next_due_on) : d < 7
                    ? date.toLocaleDateString(undefined, { weekday: "long" })
                    : `in ${d} days`;
                const item = one(t.items);
                const meta = [item?.nickname, howOften(t.interval_unit, t.interval_value), t.source_page ? `p. ${t.source_page}` : ""]
                  .filter(Boolean)
                  .join(" · ");
                return `<li class="agenda-row">
                  ${itemIcon(item)}
                  <div class="agenda-what"><strong>${esc(t.title)}</strong><span class="small muted">${esc(meta)}</span></div>
                  <div class="agenda-when"><strong class="${d < 0 ? "late" : ""}">${esc(when.charAt(0).toUpperCase() + when.slice(1))}</strong><span class="small muted">${esc(date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }))}</span></div>
                  <button type="button" class="agenda-done" data-done="${t.id}" aria-label="Mark ${esc(t.title)} done" title="Done">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                  </button>
                </li>`;
              })
              .join("");
            return `<div class="agenda-group"><h3 class="agenda-label ${tone}">${label}</h3><ul class="agenda card">${rows}</ul></div>`;
          })
          .join("");
        return html || '<p class="card muted">Nothing due this month. Enjoy it.</p>';
      }


      const SAYS_WHEN = /(every|each|daily|weekly|monthly|yearly|annually|once a)/i;
      const REVIEW_KIND = { fact: "Fact", task: "Upkeep", seat_limit: "Car seat limit" };
      function reviewTile(r) {
        return `<button type="button" class="rv-tile" data-review-tile="${r.id}" aria-pressed="false">
          <span class="small rv-kind">${REVIEW_KIND[r.type] ?? "Entry"}</span>
          <strong class="rv-title">${esc(r.title)}</strong>
          <span class="small muted">${esc(r.item?.nickname ?? "")}</span>
        </button>`;
      }

      function reviewCard(r) {
        const item = r.item;
        const page = r.pageText
          ? `<div class="panel"><div class="label">Page ${r.page} says</div><p style="margin-top:6px">${excerpt(r.pageText, r.read)}</p><details class="small" style="margin-top:6px"><summary style="cursor:pointer">Whole page</summary><p class="muted" style="margin-top:6px">${highlight(r.pageText, r.read)}</p></details></div>`
          : `<div class="panel"><div class="label">Page ${r.page ?? "?"}</div><p class="muted" style="margin-top:6px">The page text isn't saved, so check the paper manual.</p></div>`;
        return `<article class="card" data-review="${r.id}">
          <div class="row" style="align-items:baseline">
            <h3>${esc(r.title)}</h3>
            <span class="small muted">${esc(item?.nickname)} · ${esc([item?.brand, item?.model].filter(Boolean).join(" "))}</span>
          </div>
          <div class="grid">
            <div class="panel gold"><div class="label">Muse read (unsure)</div><p style="margin-top:6px">${esc(r.read)}</p></div>
            ${page}
          </div>
          <div class="row">
            <button type="button" data-ask>Ask Muse to check it</button>
            <button type="button" class="quiet" data-right>It's right</button>
            <button type="button" class="quiet" data-own>Write my own</button>
            <button type="button" class="quiet" data-na>Doesn't apply to mine</button>
          </div>
          <form class="field hidden" data-own-form>
            <label class="sr-only" for="own-${r.id}">Your version</label>
            <input id="own-${r.id}" required placeholder="What it should say">
            <button type="submit">Save</button>
          </form>
        </article>`;
      }

      function thingCard(item, kids) {
        const facts = item.manual_facts ?? [];
        const count = (s) => facts.filter((f) => f.source === s).length;
        const width = (n) => (facts.length ? (n / facts.length) * 100 : 0);
        const toCheck = facts.filter((f) => f.status === "needs_review").length;
        const tasks = (item.tasks ?? []).filter((t) => t.active);
        const late = tasks.filter((t) => t.next_due_on && t.next_due_on < today()).length;
        const pages = item.manuals?.[0]?.page_count;
        const cycles = (item.item_readings ?? [])
          .filter((r) => r.kind === "cycles")
          .sort((a, b) => b.measured_on.localeCompare(a.measured_on))[0];
        let extra = "";
        if (cycles) {
          extra = `${Number(cycles.value)} uses so far${item.uses_per_week ? `, about ${Number(item.uses_per_week)} a week` : ""}`;
        }
        const seat = (item.seat_modes ?? []).find((m) => m.mode === "rear_facing") ?? item.seat_modes?.[0];
        const kid = kids.find((k) => k.id === item.child_id);
        if (seat && kid) {
          const m = [...(kid.measurements ?? [])].sort((a, b) =>
            b.measured_on.localeCompare(a.measured_on),
          )[0];
          if (m) {
            extra = `${seat.mode.replace(/_/g, "-")}: ${Number(m.weight_kg)} of ${Number(seat.max_weight_kg)} kg · ${Number(m.height_cm)} of ${Number(seat.max_height_cm)} cm (p. ${seat.source_page})<br><span class="muted">${esc(kid.nickname)}, measured ${ago(m.measured_on).toLowerCase()}</span>`;
          }
        }
        return `<a class="card" href="/things?id=${item.id}" style="color:inherit;text-decoration:none">
          <div><h3>${esc(item.nickname)}</h3><div class="small muted">${esc([item.brand, item.model].filter(Boolean).join(" "))}${pages ? ` · ${pages}-page manual` : " · no manual yet"}</div></div>
          <div class="source-bar" role="img" aria-label="${facts.length} facts: ${count("reader")} read by Muse, ${count("assistant")} checked by an assistant, ${count("user")} set by you">
            <span class="src-reader" style="width:${width(count("reader"))}%"></span><span class="src-assistant" style="width:${width(count("assistant"))}%"></span><span class="src-user" style="width:${width(count("user"))}%"></span>
          </div>
          <div class="small">${facts.length} facts · ${tasks.length} tasks${toCheck ? ` · <strong>${toCheck} to check</strong>` : ""}${late ? ` · <strong style="color:var(--coral)">${late} late</strong>` : ""}</div>
          ${extra ? `<div class="small">${extra}</div>` : ""}
        </a>`;
      }

      function change(r) {
        const keys = Object.keys(r.after).filter(
          (k) => !["source", "status"].includes(k) && JSON.stringify(r.before[k]) !== JSON.stringify(r.after[k]),
        );
        const what = r.after.label || r.after.title || (r.after.mode ?? "").replace(/_/g, "-") || "A fact";
        const diff = keys
          .slice(0, 1)
          .map(
            (k) =>
              ` <s class="muted">${esc(r.before[k])}</s> → <strong>${esc(String(r.after[k]).replace(/\.$/, ""))}</strong>`,
          )
          .join("");
        const who = r.source === "user" ? ["You", "var(--coral)"] : ["Assistant", "var(--accent)"];
        return `<div class="row" style="align-items:baseline;gap:6px 14px">
          <span class="small muted" style="min-width:90px">${ago(r.created_at)}</span>
          <span style="flex:1 1 360px;min-width:0">${esc(what)}${diff || " confirmed"}. “${esc(r.reason)}”</span>
          <span class="small" style="font-weight:700;color:${who[1]}">${who[0]}</span>
        </div>`;
      }

      const CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>';
      /** The big "add a manual" card. */
      function hero() {
        return `<div class="hero">
            <span class="hero-icon">${CAMERA}</span>
            <div class="hero-text">
              <h2>Add a new manual</h2>
              <p>Snap the label. Muse finds the manual and turns it into a schedule.</p>
            </div>
            <div class="hero-actions">
              <label class="button hero-primary" for="home-camera">Take a photo</label>
              <label class="button hero-secondary" for="home-upload">Upload a photo</label>
              <a class="hero-link" href="/things?add=1">or type it in</a>
            </div>
            <input id="home-camera" type="file" accept="image/*" capture="environment" class="sr-only">
            <input id="home-upload" type="file" accept="image/*" class="sr-only">
          </div>`;
      }

      function wireHero() {
        for (const id of ["#home-camera", "#home-upload"]) {
          $(id)?.addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              await handOffPhoto(file);
            } catch (err) {
              toast(err.message);
            }
          });
        }
      }

      function render({ items, due, review, revisions, kids }) {
        if (!items.length) {
          main.innerHTML = `<section class="stack">
            <h1>An empty house, for now.</h1>
            ${hero()}
            <p class="muted">Just looking around? <button type="button" class="link" id="demo">Load the example home</button></p>
          </section>`;
          wireHero();
          $("#demo").addEventListener("click", async () => {
            const { error } = await (await db()).rpc("load_demo_household");
            if (error) return toast(error.message);
            load();
          });
          return;
        }
        const date = new Date().toLocaleDateString(undefined, {
          weekday: "long",
          month: "short",
          day: "numeric",
        });
        main.innerHTML = `
          <section class="stack">
            <h1 class="sr-only">Home</h1>
            <p class="muted" style="font-weight:600">${esc(date)}</p>
            ${hero()}
            <form class="field" id="ask" style="margin-top:6px">
              <label class="sr-only" for="ask-input">Ask or tell</label>
              <input id="ask-input" autocomplete="off" placeholder="Ask or tell Muse">
              <button type="submit">Go</button>
            </form>
          </section>

          <section aria-labelledby="pulse-h" id="pulse">
            <div class="section-head"><h2 id="pulse-h">Worth doing now</h2></div>
            <div id="pulse-body"><p class="small muted">Checking the house…</p></div>
          </section>

          <section aria-labelledby="week-h">
            <div class="section-head"><h2 id="week-h">Coming up</h2></div>
            <div class="stack" id="coming">${agenda(due)}</div>
          </section>

          ${
            review.length
              ? `<details class="card flat review-fold">
                  <summary><span class="chip gold strong">${review.length}</span> <strong>Muse wasn't sure about ${review.length === 1 ? "one entry" : `${review.length} entries`}</strong></summary>
                  <p class="small muted" style="margin:10px 0">Tap one to check it against its page.</p>
                  <div class="rv-grid" role="group" aria-label="To check">${review.map(reviewTile).join("")}</div>
                  <div id="review-open"></div>
                </details>`
              : ""
          }

          <section aria-labelledby="things-h">
            <div class="section-head"><h2 id="things-h">Your things</h2></div>
            <div class="grid">${items.map((i) => thingCard(i, kids)).join("")}</div>
          </section>

          ${
            revisions.length
              ? `<section class="card flat" aria-labelledby="changes-h">
                  <div class="section-head" style="margin:0"><h2 id="changes-h" style="font-size:22px">Recent changes</h2><a href="/history">All of them</a></div>
                  ${revisions.map(change).join("")}
                </section>`
              : ""
          }`;

        wireHero();
        loadPulse();
        typeAhead($("#ask-input"), (text) => {
          $("#ask-input").value = "";
          openChat(text, load);
        });
        $("#ask").addEventListener("submit", (e) => {
          e.preventDefault();
          const text = $("#ask-input").value.trim();
          $("#ask-input").value = "";
          openChat(text || undefined, load);
        });
        for (const b of main.querySelectorAll("[data-done]")) {
          b.addEventListener("click", async () => {
            b.disabled = true;
            const { error } = await (await db()).rpc("log_task_done", { p_task: b.dataset.done });
            if (error) {
              b.disabled = false;
              return toast(error.message);
            }
            toast("Done. The next one is scheduled.");
            load();
          });
        }
        const reviewOpen = $("#review-open");
        for (const tile of main.querySelectorAll("[data-review-tile]")) {
          tile.addEventListener("click", () => {
            const wasOpen = tile.getAttribute("aria-pressed") === "true";
            for (const t of main.querySelectorAll("[data-review-tile]")) t.setAttribute("aria-pressed", "false");
            reviewOpen.innerHTML = "";
            if (wasOpen) return;
            tile.setAttribute("aria-pressed", "true");
            const r = review.find((x) => x.id === tile.dataset.reviewTile);
            reviewOpen.innerHTML = reviewCard(r);
            wireReview(r, reviewOpen.firstElementChild);
            reviewOpen.scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
        }
        function wireReview(r, card) {
          $("[data-ask]", card).addEventListener("click", () =>
            openChat(
              `Check "${r.title}" for the ${r.item?.nickname?.toLowerCase()} against page ${r.page} of its manual, and fix it if it's wrong.`,
              load,
            ),
          );
          $("[data-right]", card).addEventListener("click", async () => {
            try {
              for (const id of [r.id, ...r.twins]) {
                await tool("revise_fact", {
                  id,
                  type: r.type,
                  source: "user",
                  reason: `Checked against page ${r.page} by you.`,
                });
              }
              toast("Marked as checked.");
              load();
            } catch (err) {
              toast(err.message);
            }
          });
          $("[data-na]", card).addEventListener("click", async () => {
            try {
              for (const id of [r.id, ...r.twins]) {
                await tool("revise_fact", {
                  id,
                  type: r.type,
                  source: "user",
                  not_applicable: true,
                  reason: `Doesn't apply to this ${r.item?.nickname?.toLowerCase() ?? "one"}, said by you.`,
                });
              }
              toast("Dropped. It's kept in the history.");
              load();
            } catch (err) {
              toast(err.message);
            }
          });
          $("[data-own]", card).addEventListener("click", () => {
            $("[data-own-form]", card).classList.remove("hidden");
            $("input", $("[data-own-form]", card)).focus();
          });
          $("[data-own-form]", card).addEventListener("submit", async (e) => {
            e.preventDefault();
            const value = $("input", e.target).value.trim();
            const field = { fact: "value", task: "details", seat_limit: "fit_note" }[r.type];
            try {
              for (const id of [r.id, ...r.twins]) {
                await tool("revise_fact", {
                  id,
                  type: r.type,
                  source: "user",
                  changes: { [field]: value },
                  reason: "Set by you.",
                });
              }
              toast("Saved. The earlier version is kept in the history.");
              load();
            } catch (err) {
              toast(err.message);
            }
          });
        }
      }

      // Household Pulse: of everything coming up, the few lines worth doing now
      // (server/src/pulse.ts, one Jev call). It loads after the page so the page
      // never waits on it; when Jev is unset or down the section just goes away.
      const PULSE_CHIP = {
        safety: ["Safety", "coral"],
        money: ["Saves money", "gold"],
        worse: ["Gets worse if left", "gold"],
        quick: ["5 minutes", "teal"],
      };
      function pulseRow(c) {
        const chip = PULSE_CHIP[c.chip];
        const act =
          c.kind === "task"
            ? `<button type="button" class="agenda-done" data-pulse-done="${esc(c.task_id)}" aria-label="Mark ${esc(c.title)} done" title="Done">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </button>`
            : `<a class="agenda-done" href="/things?id=${esc(c.item.id)}" aria-label="Open the ${esc(c.item.nickname)}" title="Open">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </a>`;
        return `<li class="agenda-row" data-pulse="${esc(c.key)}">
          ${itemIcon(c.item)}
          <div class="agenda-what">
            <strong>${esc(c.title)}</strong>
            <span class="small muted">${esc(c.item.nickname)} · ${esc(c.sub)}</span>
            <span class="row" style="gap:10px;align-items:center;margin-top:4px">
              ${chip ? `<span class="chip ${chip[1]} strong" style="font-size:12px;padding:2px 10px">${chip[0]}</span>` : ""}
              <button type="button" class="link small" data-pulse-later="${esc(c.key)}" data-days="${Number(c.snooze_days) || 7}">Not now</button>
            </span>
          </div>
          ${act}
        </li>`;
      }

      async function loadPulse() {
        const section = $("#pulse");
        const body = $("#pulse-body");
        if (!section || !body) return;
        let pulse = null;
        try {
          ({ pulse } = await api("/api/pulse", {}));
        } catch {}
        if (!pulse || !body.isConnected) {
          section.remove();
          return;
        }
        if (!pulse.cards.length) {
          body.innerHTML = '<p class="small muted">Nothing needs you today. Coming up has the rest.</p>';
          return;
        }
        body.innerHTML = `<ul class="agenda card">${pulse.cards.map(pulseRow).join("")}</ul>`;
        for (const b of body.querySelectorAll("[data-pulse-done]")) {
          b.addEventListener("click", async () => {
            b.disabled = true;
            const { error } = await (await db()).rpc("log_task_done", { p_task: b.dataset.pulseDone });
            if (error) {
              b.disabled = false;
              return toast(error.message);
            }
            toast("Done. The next one is scheduled.");
            load();
          });
        }
        for (const b of body.querySelectorAll("[data-pulse-later]")) {
          b.addEventListener("click", async () => {
            b.disabled = true;
            const days = Number(b.dataset.days) || 7;
            // The server compares `until` with its own UTC date, so count from
            // UTC here too: from a local date, a one-day snooze in a US evening
            // (already tomorrow in UTC) would end the moment it was saved.
            const utcToday = new Date().toISOString().slice(0, 10);
            const { error } = await (await db())
              .from("pulse_snoozes")
              .upsert({ event_key: b.dataset.pulseLater, until: addDays(utcToday, days) });
            if (error) {
              b.disabled = false;
              return toast(error.message);
            }
            b.closest("[data-pulse]")?.remove();
            if (!body.querySelector("[data-pulse]"))
              body.innerHTML = '<p class="small muted">Nothing else needs you today.</p>';
            toast(days === 1 ? "Hidden until tomorrow." : `Hidden for ${days} days.`);
          });
        }
      }

      async function start() {
        const session = await boot("/");
        if (!session) {
          signIn(main, () => location.reload());
          return;
        }
        await load();
      }
      start().catch((err) => {
        main.innerHTML = `<p class="card">Something went wrong: ${esc(err.message)}</p>`;
      });
    </script>
  </body>
</html>
