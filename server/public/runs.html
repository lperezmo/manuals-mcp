<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15131c" media="(prefers-color-scheme: dark)" />
    <title>Model log · Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  </head>
  <body>
    <header class="top" id="top"></header>
    <main class="wrap" id="main">
      <p class="muted">One moment…</p>
    </main>

    <script type="module">
      import { $, ago, boot, db, esc, reportIssue, toast } from "/app.js";

      const main = $("#main");
      const num = (n) => (n == null ? "?" : n.toLocaleString());
      const FILTERS = [
        ["all", "All"],
        ["read", "Manual reads"],
        ["chat", "Chats"],
        ["fast", "Instant answers"],
        ["pulse", "Pulse"],
        ["search", "Searches"],
        ["snap", "Label photos"],
        ["plan", "Catch-up plans"],
        ["image", "Marked photos"],
        ["failed", "Failed"],
      ];
      let runs = [];
      let spend = [];
      // What each credit costs per million tokens, and how much the hackathon gave us.
      // Estimated from the tokens in the log: the providers' own billing is the real number.
      const CREDITS = [
        { name: "Muse on Baseten", match: (m) => m.startsWith("meta-models/"), in: 1.25, out: 4.25, credit: 100 },
        { name: "Jev on TypeSafe", match: (m) => m.startsWith("jev"), in: 0.042, out: 0, credit: 5 },
      ];
      const usd = (n) => (n < 0.01 && n > 0 ? "<$0.01" : `$${n.toFixed(2)}`);
      // Meta bills per picture: Muse Image about a cent, SAM 3.1 a quarter of a cent
      // (Meta's pricing page). Both stop at the server's IMAGE_CAP, 140 unless set otherwise.
      const IMAGE_CAP = 140;
      const IMAGE_PRICE = 0.01;
      const SAM_PRICE = 0.0025;
      let images = 0;
      let imageCost = 0;
      function imageCard() {
        const text = spend.filter((r) => r.model.startsWith("muse-spark"));
        const calls = text.reduce((n, r) => n + Number(r.runs), 0);
        const left = Math.max(0, IMAGE_CAP - images);
        const pct = Math.min(100, (100 * images) / IMAGE_CAP);
        return `<div class="card credit">
          <div class="row" style="justify-content:space-between;align-items:baseline"><strong class="small">Images on Meta</strong><span class="small muted">${num(images)} of ${IMAGE_CAP} used · about ${usd(imageCost)}</span></div>
          <strong class="credit-left">${num(left)} left</strong>
          <div class="credit-bar" role="meter" aria-label="Images on Meta used" aria-valuemin="0" aria-valuemax="${IMAGE_CAP}" aria-valuenow="${images}"><span style="width:${pct.toFixed(1)}%"></span></div>
          <span class="small muted">Circled photos in the chat${calls ? ` · plus ${num(calls)} Muse text calls on Meta from local testing` : ""}</span>
        </div>`;
      }
      function creditCard(c) {
        const rows = spend.filter((r) => c.match(r.model));
        const tin = rows.reduce((n, r) => n + Number(r.tokens_in), 0);
        const tout = rows.reduce((n, r) => n + Number(r.tokens_out), 0);
        const calls = rows.reduce((n, r) => n + Number(r.runs), 0);
        const first = rows.map((r) => r.first_at).sort()[0];
        const used = (tin * c.in + tout * c.out) / 1e6;
        const left = Math.max(0, c.credit - used);
        const pct = Math.min(100, (100 * used) / c.credit);
        return `<div class="card credit">
          <div class="row" style="justify-content:space-between;align-items:baseline"><strong class="small">${c.name}</strong><span class="small muted">${usd(used)} of $${c.credit} used</span></div>
          <strong class="credit-left">${usd(left)} left</strong>
          <div class="credit-bar" role="meter" aria-label="${c.name} credit used" aria-valuemin="0" aria-valuemax="${c.credit}" aria-valuenow="${used.toFixed(2)}"><span style="width:${pct.toFixed(1)}%"></span></div>
          <span class="small muted">${num(calls)} calls · ${num(tin)} tokens in, ${num(tout)} out${first ? ` · since ${new Date(first).toLocaleDateString()}` : ""}</span>
        </div>`;
      }
      let names = new Map();
      let filter = "all";

      function pages(list) {
        if (!list?.length) return null;
        return list.length > 12 ? `${list.slice(0, 12).join(", ")} and ${list.length - 12} more` : list.join(", ");
      }

      function title(r) {
        if (r.kind === "read") return `Read the ${names.get(r.item_id) ?? "manual"} manual`;
        if (r.kind === "snap") return "Read a label photo";
        if (r.kind === "plan") return `Made a catch-up plan for the ${names.get(r.item_id) ?? "thing"}`;
        if (r.kind === "search") return `Searched for the ${names.get(r.item_id) ?? "thing's"} manual`;
        if (r.kind === "fast") return `Instant answer about the ${names.get(r.item_id) ?? "thing"}, no Muse`;
        if (r.kind === "pulse") return "Pulse: picked what's worth doing now, no Muse";
        if (r.kind === "image")
          return r.model?.startsWith("sam-")
            ? "Outlined a part on a chat photo (Jev found it, SAM traced it)"
            : "Circled a part on a chat photo";
        return r.tools_used?.length ? `Chat: ${r.tools_used.join(", ")}` : "Chat, no tools";
      }

      /** Plain text for pasting into a bug report or a chat with Claude. */
      function debugText(r) {
        return [
          `Manuals model run ${r.id}`,
          `when: ${new Date(r.created_at).toISOString()}`,
          `kind: ${r.kind}  ok: ${r.ok}  model: ${r.model ?? "?"}`,
          `time: ${r.ms ?? "?"} ms  tokens: ${r.tokens_in ?? "?"} in / ${r.tokens_out ?? "?"} out`,
          r.item_id ? `item: ${names.get(r.item_id) ?? ""} ${r.item_id}` : null,
          r.manual_id ? `manual: ${r.manual_id}` : null,
          r.pages_sent?.length ? `pages sent: ${r.pages_sent.join(", ")} (${r.chars_sent ?? "?"} chars)` : null,
          r.tools_used?.length ? `tools: ${r.tools_used.join(", ")}` : null,
          r.error ? `error: ${r.error}` : null,
          r.raw_output ? `--- model answer ---\n${r.raw_output}` : null,
        ]
          .filter(Boolean)
          .join("\n");
      }

      function row(r) {
        const facts = [
          ["Model", r.model],
          ["Time", r.ms != null ? `${(r.ms / 1000).toFixed(1)} s` : null],
          ["Tokens", `${num(r.tokens_in)} in, ${num(r.tokens_out)} out`],
          ["Pages sent", pages(r.pages_sent)],
          ["Text sent", r.chars_sent != null ? `${num(r.chars_sent)} characters` : null],
          ["Tools", r.tools_used?.length ? r.tools_used.join(", ") : null],
          ["Run id", r.id],
        ].filter(([, v]) => v);
        return `<details class="run">
          <summary>
            <span class="run-status ${r.ok ? "ok" : "failed"}">${r.ok ? "OK" : "Failed"}</span>
            <span class="run-what"><strong>${esc(title(r))}</strong><span class="small muted">${esc([r.ms != null ? `${(r.ms / 1000).toFixed(1)} s` : "", `${num((r.tokens_in ?? 0) + (r.tokens_out ?? 0))} tokens`].filter(Boolean).join(" · "))}</span></span>
            <span class="small muted run-when">${ago(r.created_at)}</span>
          </summary>
          <div class="run-body">
            ${r.error ? `<p class="run-error"><strong>Error:</strong> ${esc(r.error)}</p>` : ""}
            <dl class="run-facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
            ${
              r.raw_output
                ? `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><strong class="small">${r.kind === "search" ? "Query and PDFs tried" : "What Muse answered"}</strong><button type="button" class="quiet small" data-copy-raw="${r.id}">Copy answer</button></div><pre class="run-raw">${esc(r.raw_output)}</pre></div>`
                : ""
            }
            <div class="row"><button type="button" class="quiet small" data-copy="${r.id}">Copy debug info</button><button type="button" class="quiet small" data-report="${r.id}">Report this run</button></div>
          </div>
        </details>`;
      }

      function draw() {
        const since = Date.now() - 86_400_000;
        const today = runs.filter((r) => Date.parse(r.created_at) > since);
        const count = (kind) => today.filter((r) => r.kind === kind).length;
        const failed = today.filter((r) => !r.ok).length;
        const tokens = today.reduce((n, r) => n + (r.tokens_in ?? 0) + (r.tokens_out ?? 0), 0);
        const shown = runs.filter((r) =>
          filter === "all" ? true : filter === "failed" ? !r.ok : r.kind === filter,
        );
        main.innerHTML = `
          <section class="stack">
            <h1>Model log</h1>
            <p class="muted">Every manual Muse read and every chat question, newest first. Open one to see the details, or copy them for a bug report.</p>
          </section>
          ${spend.length ? `          <section class="stack" style="gap:8px" aria-label="Credits">
            <div class="credits">${CREDITS.map(creditCard).join("")}${imageCard()}</div>
            <p class="small muted" style="margin:0">Estimated from the tokens logged for every household. Runs from before photo reads logged tokens count as zero, and the providers' billing is the real number.</p>
          </section>` : ""}
          <section class="run-stats" aria-label="Last 24 hours">
            <div class="card"><strong>${count("chat")}</strong><span class="small muted">chat questions today</span></div>
            <div class="card"><strong>${count("fast") + count("chat") ? `${Math.round((100 * count("fast")) / (count("fast") + count("chat")))}%` : "0%"}</strong><span class="small muted">answered without Muse</span></div>
            <div class="card"><strong>${count("read")}</strong><span class="small muted">manual reads today</span></div>
            <div class="card"><strong>${num(tokens)}</strong><span class="small muted">tokens today</span></div>
            <div class="card"><strong ${failed ? 'style="color:var(--coral)"' : ""}>${failed}</strong><span class="small muted">failed today</span></div>
          </section>
          <section class="stack">
            <div class="filters" role="group" aria-label="Show">${FILTERS.map(([k, label]) => `<button type="button" data-filter="${k}" aria-pressed="${filter === k}">${label}</button>`).join("")}</div>
            <div class="card runs">${
              shown.map(row).join("") ||
              `<p class="muted">${runs.length ? "Nothing matches that filter." : "Nothing yet. Ask the chat something or add a manual."}</p>`
            }</div>
          </section>`;
        for (const b of main.querySelectorAll("[data-filter]")) {
          b.addEventListener("click", () => {
            filter = b.dataset.filter;
            draw();
          });
        }
        const copy = async (text, what) => {
          try {
            await navigator.clipboard.writeText(text);
            toast(`${what} copied.`);
          } catch {
            toast("Couldn't copy here. Select the text and copy it instead.");
          }
        };
        for (const b of main.querySelectorAll("[data-copy]")) {
          b.addEventListener("click", () => copy(debugText(runs.find((r) => r.id === b.dataset.copy)), "Debug info"));
        }
        for (const b of main.querySelectorAll("[data-report]")) {
          b.addEventListener("click", () => {
            const r = runs.find((x) => x.id === b.dataset.report);
            reportIssue({ runId: r.id, debug: debugText(r), about: title(r) });
          });
        }
        for (const b of main.querySelectorAll("[data-copy-raw]")) {
          b.addEventListener("click", () => copy(runs.find((r) => r.id === b.dataset.copyRaw).raw_output, "Answer"));
        }
      }

      async function start() {
        if (!(await boot("/runs"))) return;
        const client = await db();
        const [result, items, spent] = await Promise.all([
          client
            .from("model_runs")
            .select(
              "id, kind, item_id, manual_id, model, ok, error, ms, tokens_in, tokens_out, pages_sent, chars_sent, tools_used, raw_output, created_at",
            )
            .order("created_at", { ascending: false })
            .limit(200),
          client.from("items").select("id, nickname"),
          client.rpc("model_spend_all"),
        ]);
        // No spend function yet (the migration isn't in) just leaves the credits at zero.
        spend = spent.data ?? [];
        // The same count the server's cap uses: image calls that came back with a picture.
        const pictures = (prefix) =>
          spend
            .filter((r) => r.model.startsWith(prefix))
            .reduce((n, r) => n + Number(r.ok_runs ?? r.runs), 0);
        const [muse, sam] = [pictures("muse-image"), pictures("sam-")];
        images = muse + sam;
        imageCost = muse * IMAGE_PRICE + sam * SAM_PRICE;
        if (result.error) throw new Error(result.error.message);
        runs = result.data;
        names = new Map((items.data ?? []).map((i) => [i.id, i.nickname]));
        draw();
      }
      start().catch((err) => {
        main.innerHTML = `<p class="card">Something went wrong: ${esc(err.message)}</p>`;
      });
    </script>
  </body>
</html>
