# Runs the Jev photo checks against the real TypeSafe service with the repo
# secret JEV_API_KEY. The key only reaches the script as an env var; nothing
# prints it, and GitHub masks it in logs.
name: jev-live

on:
  pull_request:
    paths:
      - "server/src/photo-check.ts"
      - "server/test/live/**"
      - "server/test/fixtures/jev/**"
      - ".github/workflows/jev-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Jev live checks
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: bun run server/test/live/jev-live.ts
