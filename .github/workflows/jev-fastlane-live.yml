# Runs the fast lane's live check against the real TypeSafe service with the
# repo secret JEV_API_KEY. The key only reaches the script as an env var;
# nothing prints it, and GitHub masks it in logs.
name: jev-fastlane-live

on:
  push:
    branches: [claude/project-thread-tiykni]
    paths:
      - "server/src/fastlane.ts"
      - "server/test/live/fastlane-live.ts"
      - ".github/workflows/jev-fastlane-live.yml"
  pull_request:
    paths:
      - "server/src/fastlane.ts"
      - "server/test/live/fastlane-live.ts"
      - ".github/workflows/jev-fastlane-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-fastlane-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Fast lane live check
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: bun run server/test/live/fastlane-live.ts
